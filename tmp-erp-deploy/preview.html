function erpNewAccountForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Account name", true);
  form.appendChild(erpField("Name", nameInput));
  form.appendChild(erpField("Contact", erpTextInput("contact_name", "Buyer name")));
  form.appendChild(erpField("Contact person (portal login name)", erpTextInput("contact_person", "")));
  var emailInput = erpTextInput("email", "buyer@example.com");
  emailInput.type = "email";
  form.appendChild(erpField("Email", emailInput));
  form.appendChild(erpField("Phone", erpTextInput("phone", "")));
  form.appendChild(erpField("Address", erpTextInput("address", "")));
  form.appendChild(erpField("Price/bag ($)", erpTextInput("price_per_bag", "4.00")));
  form.appendChild(erpField("Savory price/bag ($)", erpTextInput("savory_price", "4.00")));
  form.appendChild(erpField("Sweet price/bag ($)", erpTextInput("sweet_price", "4.00")));
  form.appendChild(erpField("Default PO", erpTextInput("default_po", "")));
  form.appendChild(erpField("Payment terms", erpTextInput("payment_terms", "Net 30")));
  form.appendChild(erpField("Notes", erpTextInput("notes", "")));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = true;
  form.appendChild(erpField("Active", activeInput));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Create account";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Account name is required.";
      return;
    }
    var payload = {
      name: name,
      contact_name: form.contact_name.value.trim(),
      contact_person: form.contact_person.value.trim(),
      email: emailInput.value.trim(),
      phone: form.phone.value.trim(),
      address: form.address.value.trim(),
      payment_terms: form.payment_terms.value.trim(),
      default_po: form.default_po.value.trim(),
      notes: form.notes.value.trim(),
      active: activeInput.checked
    };
    var priceFields = [["price_per_bag", "price_per_bag_cents"],
      ["savory_price", "savory_price_cents"], ["sweet_price", "sweet_price_cents"]];
    for (var pi = 0; pi < priceFields.length; pi++) {
      var raw = form[priceFields[pi][0]].value.trim();
      if (raw) {
        var c = erpDollarsToCents(raw);
        if (c === null) {
          status.textContent = "Prices must be numbers.";
          return;
        }
        payload[priceFields[pi][1]] = c;
      }
    }
    submit.disabled = true;
    status.textContent = "Creating account…";
    erpPost("/api/erp/wholesale-accounts", payload).then(function (res) {
      erpState.showNewAccount = false;
      erpState.selectedAccountId = res.account.id;
      erpState.showEditAccount = false;
      return loadErpOrdersDetail();
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

/* ---------- account detail ---------- */
function renderErpAccountDetail(body) {
  var id = erpState.selectedAccountId;
  setAdminDetailStatus("Loading account…");
  erpGet("/api/erp/wholesale-accounts/" + encodeURIComponent(String(id))).then(function (res) {
    var a = res.account;
    var orders = res.orders || [];
    body.replaceChildren();
    body.appendChild(erpBackButton("← All accounts", function () {
      erpState.selectedAccountId = null;
      erpState.showEditAccount = false;
      erpState.ordersView = "accounts";
      renderErpOrdersDetail();
    }));
    var h2 = document.createElement("h2");
    h2.textContent = a.name + " ";
    h2.appendChild(erpChip(a.active ? "received" : "cancelled", a.active ? "Active" : "Inactive"));
    body.appendChild(h2);
    var meta = document.createElement("div");
    meta.className = "erp-detail-meta";
    ["Contact: " + (a.contact_name || "—"),
     "Contact person: " + (a.contact_person || "—"),
     "Email: " + (a.email || "—"),
     "Phone: " + (a.phone || "—"),
     "Address: " + (a.address || "—"),
     "Price/bag: " + (a.price_per_bag_cents ? erpMoney(a.price_per_bag_cents) : "—"),
     "Savory: " + (a.savory_price_cents ? erpMoney(a.savory_price_cents) : "—") +
       " · Sweet: " + (a.sweet_price_cents ? erpMoney(a.sweet_price_cents) : "—"),
     "Default PO: " + (a.default_po || "—"),
     "Portal: " + (a.account_status || "active"),
     "Terms: " + (a.payment_terms || "—"),
     "Orders: " + orders.length
    ].forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      meta.appendChild(s);
    });
    body.appendChild(meta);
    if (a.notes) {
      var notes = document.createElement("p");
      notes.textContent = a.notes;
      body.appendChild(notes);
    }
    if (erpIsAdmin()) {
      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.textContent = erpState.showEditAccount ? "Cancel edit" : "Edit account";
      editBtn.addEventListener("click", function () {
        erpState.showEditAccount = !erpState.showEditAccount;
        renderErpAccountDetail(body);
      });
      var etool = document.createElement("div");
      etool.className = "erp-toolbar";
      etool.appendChild(editBtn);
      // Phase 5: invite the customer to the ordering portal.
      var inviteBtn = document.createElement("button");
      inviteBtn.type = "button";
      inviteBtn.textContent = "Invite to portal";
      inviteBtn.addEventListener("click", function () {
        inviteBtn.disabled = true;
        setAdminDetailStatus("Sending invitation…");
        erpPost("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id)) + "/invite?reveal=1", {
          portal_url: location.origin + location.pathname
        }).then(function (res) {
          setAdminDetailStatus("Invitation sent to " + res.email + "." +
            (res.invite_link ? " Invite link (copy to customer): " + res.invite_link : ""));
        }).catch(function (error) {
          setAdminDetailStatus(error.message, true);
        }).finally(function () { inviteBtn.disabled = false; });
      });
      etool.appendChild(inviteBtn);
      body.appendChild(etool);
      if (erpState.showEditAccount) body.appendChild(erpEditAccountForm(a));
    }
    // Phase 5: delivery addresses.
    var ah = document.createElement("h3");
    ah.textContent = "Delivery addresses";
    body.appendChild(ah);
    var abody = document.createElement("div");
    abody.id = "erpAccountAddresses";
    body.appendChild(abody);
    erpRenderAccountAddresses(abody, a.id);
    var oh = document.createElement("h3");
    oh.textContent = "Order history";
    body.appendChild(oh);
    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    body.appendChild(wrap);
    if (!orders.length) {
      var empty = document.createElement("p");
      empty.className = "admin-orders-empty";
      empty.textContent = "No orders for this account yet.";
      wrap.appendChild(empty);
    } else {
      var table = document.createElement("table");
      table.className = "admin-orders-table";
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      ["Order", "Status", "Qty", "Total", "Order date", "Due"].forEach(function (c) {
        var th = document.createElement("th");
        th.textContent = c;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = document.createElement("tbody");
      orders.forEach(function (o) {
        var tr = document.createElement("tr");
        var numTd = document.createElement("td");
        var link = document.createElement("a");
        link.href = "#/orders";
        link.textContent = o.order_number;
        link.addEventListener("click", function (e) {
          e.preventDefault();
          erpGoToOrder("wholesale", o.id);
        });
        numTd.appendChild(link);
        tr.appendChild(numTd);
        var stTd = document.createElement("td");
        stTd.appendChild(erpChip(o.status, erpOrderStatusLabel(o.status)));
        tr.appendChild(stTd);
        tr.appendChild(erpCell("Qty", o.total_qty));
        tr.appendChild(erpCell("Total", erpMoney(o.total_cents)));
        tr.appendChild(erpCell("Order date", o.order_date || erpFmtDate(o.created_at)));
        tr.appendChild(erpCell("Due", o.due_date || "—"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }
    setAdminDetailStatus(a.name + ".");
  }).catch(function (error) {
    setAdminDetailStatus(error.message, true);
  });
}

/* ---------- Phase 5: delivery addresses ---------- */
function erpRenderAccountAddresses(container, accountId) {
  container.replaceChildren();
  erpGet("/api/erp/wholesale-accounts/" + encodeURIComponent(String(accountId)) + "/addresses").then(function (res) {
    var addrs = res.addresses || [];
    if (addrs.length) {
      var list = document.createElement("div");
      addrs.forEach(function (ad) {
        var row = document.createElement("div");
        row.className = "ws-prod-line" + (ad.active ? "" : " done");
        var info = document.createElement("div");
        var nm = document.createElement("div");
        nm.style.fontWeight = "800";
        nm.textContent = (ad.label || "Address") + (ad.active ? "" : " (inactive)");
        var sub = document.createElement("div");
        sub.style.fontSize = "13px";
        sub.style.color = "var(--muted)";
        sub.textContent = [ad.street, ad.city, ad.state, ad.zip].filter(Boolean).join(", ") +
          (ad.phone ? " · " + ad.phone : "");
        info.appendChild(nm);
        info.appendChild(sub);
        row.appendChild(info);
        if (erpIsAdmin()) {
          var tgl = document.createElement("button");
          tgl.type = "button";
          tgl.textContent = ad.active ? "Deactivate" : "Activate";
          tgl.addEventListener("click", function () {
            erpPut("/api/erp/wholesale-accounts/addresses/" + ad.id, {active: !ad.active}).then(function () {
              erpRenderAccountAddresses(container, accountId);
            }).catch(function (e) { setAdminDetailStatus(e.message, true); });
          });
          row.appendChild(tgl);
        }
        list.appendChild(row);
      });
      container.appendChild(list);
    } else {
      var e = document.createElement("p");
      e.className = "admin-orders-empty";
      e.textContent = "No delivery addresses yet — the account address is used.";
      container.appendChild(e);
    }
    if (erpIsAdmin()) {
      var form = document.createElement("form");
      form.className = "erp-form erp-form-inline";
      var li = erpTextInput("label", "Label (e.g. Store #2)");
      var st = erpTextInput("street", "Street");
      var ci = erpTextInput("city", "City");
      var sa = erpTextInput("state", "ST");
      sa.style.maxWidth = "70px";
      var zi = erpTextInput("zip", "ZIP");
      zi.style.maxWidth = "110px";
      form.appendChild(li);
      form.appendChild(st);
      form.appendChild(ci);
      form.appendChild(sa);
      form.appendChild(zi);
      var add = document.createElement("button");
      add.type = "submit";
      add.textContent = "Add address";
      form.appendChild(add);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        erpPost("/api/erp/wholesale-accounts/" + encodeURIComponent(String(accountId)) + "/addresses", {
          label: li.value.trim(), street: st.value.trim(), city: ci.value.trim(),
          state: sa.value.trim(), zip: zi.value.trim()
        }).then(function () {
          erpRenderAccountAddresses(container, accountId);
        }).catch(function (err) { setAdminDetailStatus(err.message, true); });
      });
      container.appendChild(form);
    }
  }).catch(function (error) {
    container.textContent = error.message;
  });
}

function erpEditAccountForm(a) {

  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Account name", true);
  nameInput.value = a.name || "";
  form.appendChild(erpField("Name", nameInput));
  var contactInput = erpTextInput("contact_name", "");
  contactInput.value = a.contact_name || "";
  form.appendChild(erpField("Contact", contactInput));
  var emailInput = erpTextInput("email", "");
  emailInput.type = "email";
  emailInput.value = a.email || "";
  form.appendChild(erpField("Email", emailInput));
  var phoneInput = erpTextInput("phone", "");
  phoneInput.value = a.phone || "";
  form.appendChild(erpField("Phone", phoneInput));
  var addrInput = erpTextInput("address", "");
  addrInput.value = a.address || "";
  form.appendChild(erpField("Address", addrInput));
  var priceInput = erpTextInput("price_per_bag", "4.00");
  if (a.price_per_bag_cents) priceInput.value = (Number(a.price_per_bag_cents) / 100).toFixed(2);
  form.appendChild(erpField("Price/bag ($)", priceInput));
  var contactPersonInput = erpTextInput("contact_person", "");
  contactPersonInput.value = a.contact_person || "";
  form.appendChild(erpField("Contact person (portal)", contactPersonInput));
  var savoryInput = erpTextInput("savory_price", "4.00");
  if (a.savory_price_cents) savoryInput.value = (Number(a.savory_price_cents) / 100).toFixed(2);
  form.appendChild(erpField("Savory price/bag ($)", savoryInput));
  var sweetInput = erpTextInput("sweet_price", "4.00");
  if (a.sweet_price_cents) sweetInput.value = (Number(a.sweet_price_cents) / 100).toFixed(2);
  form.appendChild(erpField("Sweet price/bag ($)", sweetInput));
  var poInput = erpTextInput("default_po", "");
  poInput.value = a.default_po || "";
  form.appendChild(erpField("Default PO", poInput));
  var termsInput = erpTextInput("payment_terms", "Net 30");
  termsInput.value = a.payment_terms || "";
  form.appendChild(erpField("Payment terms", termsInput));
  var notesInput = erpTextInput("notes", "");
  notesInput.value = a.notes || "";
  form.appendChild(erpField("Notes", notesInput));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = !!a.active;
  form.appendChild(erpField("Active", activeInput));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Save account";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Account name is required.";
      return;
    }
    var priceRaw = priceInput.value.trim();
    var payload = {
      name: name,
      contact_name: contactInput.value.trim(),
      contact_person: contactPersonInput.value.trim(),
      email: emailInput.value.trim(),
      phone: phoneInput.value.trim(),
      address: addrInput.value.trim(),
      payment_terms: termsInput.value.trim(),
      default_po: poInput.value.trim(),
      notes: notesInput.value.trim(),
      active: activeInput.checked
    };
    var priceFields = [["price_per_bag", "price_per_bag_cents", priceRaw],
      ["savory_price", "savory_price_cents", savoryInput.value.trim()],
      ["sweet_price", "sweet_price_cents", sweetInput.value.trim()]];
    for (var pi = 0; pi < priceFields.length; pi++) {
      if (priceFields[pi][2]) {
        var cents = erpDollarsToCents(priceFields[pi][2]);
        if (cents === null) {
          status.textContent = "Prices must be numbers.";
          return;
        }
        payload[priceFields[pi][1]] = cents;
      }
    }
    submit.disabled = true;
    status.textContent = "Saving…";
    erpPut("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id)), payload).then(function () {
      erpState.showEditAccount = false;
      renderErpAccountDetail(adminDetailEls().body);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

/* ---------- Phase 5: production checklist ---------- */
function erpRenderProductionChecklist(container, orderId, orderStatus, onDone) {
  container.replaceChildren();
  erpGet("/api/erp/wholesale-orders/" + encodeURIComponent(String(orderId)) + "/production").then(function (res) {
    var lines = res.lines || [];
    if (!lines.length) return; // no checklist until the order enters production
    var h = document.createElement("h3");
    h.textContent = "Production checklist";
    container.appendChild(h);
    var prog = document.createElement("p");
    prog.className = "ws-progress";
    prog.textContent = res.done + " of " + res.total + " flavors done";
    container.appendChild(prog);
    lines.forEach(function (l) {
      var row = document.createElement("div");
      row.className = "ws-prod-line" + (l.done ? " done" : "");
      var info = document.createElement("div");
      var nm = document.createElement("div");
      nm.style.fontWeight = "800";
      nm.textContent = l.flavor_name + " — " + l.qty_bags + " bags";
      info.appendChild(nm);
      if (l.done && l.done_by) {
        var sub = document.createElement("div");
        sub.style.fontSize = "13px";
        sub.style.color = "var(--muted)";
        sub.textContent = "Done by " + l.done_by;
        info.appendChild(sub);
      }
      row.appendChild(info);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = l.done ? "Undo" : "Mark done";
      btn.addEventListener("click", function () {
        btn.disabled = true;
        erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(orderId)) +
          "/production/" + l.id + "/done", {done: !l.done}).then(function () {
          if (onDone) onDone();
        }).catch(function (e) {
          btn.disabled = false;
          setAdminDetailStatus(e.message, true);
        });
      });
      row.appendChild(btn);
      container.appendChild(row);
    });
  }).catch(function () { /* checklist unavailable — not fatal */ });
}

/* ---------- batch detail: linked orders section (Phase 3 extension) ---------- */
function erpRenderBatchLinkedOrders(body, batch) {
  var h = document.createElement("h3");
  h.textContent = "Linked orders";
  body.appendChild(h);
  var linkable = erpIsAdmin() && batch.status !== "completed" && batch.status !== "reversed" && batch.status !== "cancelled";
  if (linkable) {
    var toolbar = document.createElement("div");
    toolbar.className = "erp-toolbar";
    var linkBtn = document.createElement("button");
    linkBtn.type = "button";
    linkBtn.textContent = "Link order";
    linkBtn.addEventListener("click", function () {
      erpShowLinkOrderModal(batch, function () { renderErpBatchDetail(adminDetailEls().body); });
    });
    toolbar.appendChild(linkBtn);
    body.appendChild(toolbar);
  }
  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  body.appendChild(wrap);
  var loading = document.createElement("p");
  loading.className = "admin-orders-empty";
  loading.textContent = "Loading linked orders…";
  wrap.appendChild(loading);
  erpGet("/api/erp/batches/" + encodeURIComponent(String(batch.id)) + "/orders").then(function (res) {
    wrap.replaceChildren();
    var links = res.links || [];
    if (!links.length) {
      var empty = document.createElement("p");
      empty.className = "admin-orders-empty";
      empty.textContent = "No orders linked to this batch yet.";
      wrap.appendChild(empty);
      return;
    }
    var table = document.createElement("table");
    table.className = "admin-orders-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["Order", "Source", "Customer", "Bags", "Linked by", "Linked at"].concat(linkable ? [""] : []).forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    links.forEach(function (lk) {
      var tr = document.createElement("tr");
      var numTd = document.createElement("td");
      var link = document.createElement("a");
      link.href = "#/orders";
      link.textContent = lk.order_number;
      link.addEventListener("click", function (e) {
        e.preventDefault();
        erpGoToOrder(lk.order_source, lk.order_id);
      });
      numTd.appendChild(link);
      tr.appendChild(numTd);
      var srcTd = document.createElement("td");
      srcTd.appendChild(erpChip(lk.order_source, erpSourceLabel(lk.order_source)));
      tr.appendChild(srcTd);
      tr.appendChild(erpCell("Customer", lk.customer_name));
      tr.appendChild(erpCell("Bags", erpQty(lk.qty_bags)));
      tr.appendChild(erpCell("Linked by", lk.created_by));
      tr.appendChild(erpCell("Linked at", erpFmtDate(lk.created_at)));
      if (linkable) {
        var unTd = document.createElement("td");
        var unBtn = document.createElement("button");
        unBtn.type = "button";
        unBtn.textContent = "Unlink";
        unBtn.addEventListener("click", function () {
          if (!window.confirm("Unlink order " + lk.order_number + " from batch " + batch.batch_number + "?")) return;
          unBtn.disabled = true;
          setAdminDetailStatus("Unlinking…");
          erpDelete("/api/erp/batches/" + encodeURIComponent(String(batch.id)) +
            "/orders/" + encodeURIComponent(String(lk.id))).then(function () {
            renderErpBatchDetail(adminDetailEls().body);
          }).catch(function (error) {
            unBtn.disabled = false;
            setAdminDetailStatus(error.message, true);
          });
        });
        unTd.appendChild(unBtn);
        tr.appendChild(unTd);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }).catch(function (error) {
    wrap.replaceChildren();
    var e = document.createElement("p");
    e.className = "admin-orders-empty";
    e.textContent = error.message;
    wrap.appendChild(e);
  });
}

/* ---------------- EDI ---------------- */
function erpEdiStatusLabel(s) {
  var labels = {received: "Received", parsed: "Parsed", mapped: "Mapped",
    queued: "Queued", sent: "Sent", acked: "Acked", failed: "Failed"};
  return labels[s] || s;
}
function erpEdiDocTypeLabel(t) {
  var labels = {850: "850 PO", 855: "855 Ack", 856: "856 ASN", 810: "810 Invoice", 997: "997"};
  return labels[t] || t;
}
function erpEdiDirectionLabel(d) {
  return d === "inbound" ? "Inbound" : d === "outbound" ? "Outbound" : (d || "—");
}
function erpTransportLabel(t) {
  var labels = {"manual-file": "Manual file", sftp: "SFTP", api: "API", webhook: "Webhook"};
  return labels[t] || t;
}

async function loadErpEdiDetail() {
  setAdminDetailStatus("Loading EDI…");
  try {
    var q = [];
    if (erpState.ediDocDirectionFilter) q.push("direction=" + encodeURIComponent(erpState.ediDocDirectionFilter));
    if (erpState.ediDocTypeFilter) q.push("doc_type=" + encodeURIComponent(erpState.ediDocTypeFilter));
    if (erpState.ediDocStatusFilter) q.push("status=" + encodeURIComponent(erpState.ediDocStatusFilter));
    var qs = q.length ? "?" + q.join("&") : "";
    var results = await Promise.all([
      erpGet("/api/erp/edi-documents" + qs),
      erpGet("/api/erp/edi-partners")
    ]);
    erpState.ediDocuments = results[0].documents || [];
    erpState.ediPartners = results[1].partners || [];
    renderErpEdiDetail();
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ?
      "We couldn't connect to load EDI." : error.message, true);
  }
}

function renderErpEdiDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  if (erpState.selectedEdiDocId) { renderErpEdiDocDetail(els.body); return; }
  if (erpState.selectedEdiPartnerId) { renderErpEdiPartnerDetail(els.body); return; }
  var h2 = document.createElement("h2");
  h2.textContent = "EDI";
  els.body.appendChild(h2);
  if (erpState.lastWebhookKey) els.body.appendChild(erpWebhookKeyNotice());
  var tabs = document.createElement("div");
  tabs.className = "erp-subtabs";
  [["documents", "Documents"], ["partners", "Partners"]].forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t[1];
    if (erpState.ediView === t[0]) b.classList.add("active");
    b.addEventListener("click", function () {
      erpState.ediView = t[0];
      renderErpEdiDetail();
    });
    tabs.appendChild(b);
  });
  els.body.appendChild(tabs);
  if (erpState.ediView === "documents") renderErpEdiDocuments(els.body);
  else renderErpEdiPartners(els.body);
}

/* ---------- EDI documents ---------- */
function renderErpEdiDocuments(body) {
  var toolbar = document.createElement("div");
  toolbar.className = "erp-toolbar";
  function filterSelect(labelText, options, current, onChange) {
    var label = document.createElement("label");
    label.textContent = labelText + " ";
    var sel = document.createElement("select");
    options.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt[0];
      o.textContent = opt[1];
      if (current === opt[0]) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", onChange);
    label.appendChild(sel);
    return label;
  }
  toolbar.appendChild(filterSelect("Direction",
    [["", "All"], ["inbound", "Inbound"], ["outbound", "Outbound"]],
    erpState.ediDocDirectionFilter,
    function (e) { erpState.ediDocDirectionFilter = e.target.value; loadErpEdiDetail(); }));
  toolbar.appendChild(filterSelect("Type",
    [["", "All"], ["850", "850 PO"], ["855", "855 Ack"], ["856", "856 ASN"], ["810", "810 Invoice"], ["997", "997"]],
    erpState.ediDocTypeFilter,
    function (e) { erpState.ediDocTypeFilter = e.target.value; loadErpEdiDetail(); }));
  toolbar.appendChild(filterSelect("Status",
    [["", "All"], ["received", "Received"], ["parsed", "Parsed"], ["mapped", "Mapped"],
     ["queued", "Queued"], ["sent", "Sent"], ["acked", "Acked"], ["failed", "Failed"]],
    erpState.ediDocStatusFilter,
    function (e) { erpState.ediDocStatusFilter = e.target.value; loadErpEdiDetail(); }));
  if (erpIsAdmin()) {
    var upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.textContent = erpState.showUploadEdi ? "Cancel" : "Upload X12";
    upBtn.addEventListener("click", function () {
      erpState.showUploadEdi = !erpState.showUploadEdi;
      renderErpEdiDetail();
    });
    toolbar.appendChild(upBtn);
  }
  body.appendChild(toolbar);
  if (erpState.showUploadEdi && erpIsAdmin()) body.appendChild(erpEdiUploadForm());
  if (erpState.ediUploadPreview) body.appendChild(erpEdiUploadPreview());

  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  body.appendChild(wrap);
  if (!erpState.ediDocuments.length) {
    var empty = document.createElement("p");
    empty.className = "admin-orders-empty";
    empty.textContent = "No EDI documents match these filters.";
    wrap.appendChild(empty);
    return;
  }
  var table = document.createElement("table");
  table.className = "admin-orders-table";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["#", "Partner", "Direction", "Type", "Status", "Order", "Created"].forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  erpState.ediDocuments.forEach(function (d) {
    var tr = document.createElement("tr");
    tr.style.cursor = "pointer";
    tr.addEventListener("click", function () {
      erpState.selectedEdiDocId = d.id;
      renderErpEdiDetail();
    });
    tr.appendChild(erpCell("#", d.id));
    tr.appendChild(erpCell("Partner", d.partner_name));
    var dirTd = document.createElement("td");
    dirTd.appendChild(erpChip(d.direction, erpEdiDirectionLabel(d.direction)));
    tr.appendChild(dirTd);
    tr.appendChild(erpCell("Type", erpEdiDocTypeLabel(d.doc_type)));
    var stTd = document.createElement("td");
    stTd.appendChild(erpChip(d.status, erpEdiStatusLabel(d.status)));
    tr.appendChild(stTd);
    var ordTd = document.createElement("td");
    if (d.order_source && d.order_id) {
      var link = document.createElement("a");
      link.href = "#/orders";
      link.textContent = d.order_number || (d.order_source + "/" + d.order_id);
      link.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        erpGoToOrder(d.order_source, d.order_id);
      });
      ordTd.appendChild(link);
    } else {
      ordTd.textContent = "—";
    }

function erpEdiUploadForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var partnerSel = document.createElement("select");
  partnerSel.name = "partner_id";
  var none = document.createElement("option");
  none.value = "";
  none.textContent = "No partner (auto-match)";
  partnerSel.appendChild(none);
  erpState.ediPartners.forEach(function (p) {
    var o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name + " (" + erpTransportLabel(p.transport) + ")";
    partnerSel.appendChild(o);
  });
  form.appendChild(erpField("Partner", partnerSel));
  var fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".txt,.edi,.x12";
  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      area.value = String(reader.result || "");
      nameInput.value = file.name;
    };
    reader.readAsText(file);
  });
  form.appendChild(erpField("File", fileInput));
  var nameInput = erpTextInput("filename", "purchase-order.x12");
  form.appendChild(erpField("Filename", nameInput));
  var area = document.createElement("textarea");
  area.rows = 10;
  area.required = true;
  area.style.width = "100%";
  area.placeholder = "Paste X12 content here (or choose a file above)…";
  form.appendChild(area);
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Parse upload";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!area.value.trim()) {
      status.textContent = "Paste X12 content or choose a file.";
      return;
    }
    submit.disabled = true;
    status.textContent = "Parsing…";
    var payload = {filename: nameInput.value.trim(), content: area.value};
    if (partnerSel.value) payload.partner_id = Number(partnerSel.value);
    erpPost("/api/erp/edi-documents/upload", payload).then(function (res) {
      erpState.ediUploadPreview = res.preview;
      erpState.ediUploadedDocId = res.document.id;
      erpState.showUploadEdi = false;
      status.textContent = "";
      return loadErpEdiDetail();
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

function erpEdiUploadPreview() {
  var preview = erpState.ediUploadPreview;
  var box = document.createElement("div");
  box.className = "erp-alert-box";
  var strong = document.createElement("strong");
  strong.textContent = "Upload parsed — document #" + erpState.ediUploadedDocId + ".";
  box.appendChild(strong);
  var meta = document.createElement("div");
  meta.className = "erp-detail-meta";
  ["PO: " + (preview.po_number || "—"),
   "Partner: " + (preview.partner_name || "—"),
   "Matched account: " + (preview.account_name || "—")
  ].forEach(function (t) {
    var s = document.createElement("span");
    s.textContent = t;
    meta.appendChild(s);
  });
  box.appendChild(meta);
  var lines = preview.lines || [];
  if (lines.length) {
    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    var table = document.createElement("table");
    table.className = "admin-orders-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["Flavor", "Qty", "Unit price"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    lines.forEach(function (l) {
      var tr = document.createElement("tr");
      tr.appendChild(erpCell("Flavor", l.flavor));
      tr.appendChild(erpCell("Qty", l.qty));
      tr.appendChild(erpCell("Unit price", l.unit_price_cents ? erpMoney(l.unit_price_cents) : "—"));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.appendChild(wrap);
  }
  var errors = preview.errors || [];
  if (errors.length) {
    var eh = document.createElement("p");
    eh.style.fontWeight = "800";
    eh.textContent = "Fix these before confirming:";
    box.appendChild(eh);
    var ul = document.createElement("ul");
    errors.forEach(function (e) {
      var li = document.createElement("li");
      li.textContent = e;
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  var btnRow = document.createElement("div");
  btnRow.className = "erp-toolbar";
  if (!errors.length) {
    var confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.textContent = "Confirm → create wholesale order";
    confirmBtn.addEventListener("click", function () {
      confirmBtn.disabled = true;
      setAdminDetailStatus("Creating wholesale order from PO…");
      erpPost("/api/erp/edi-documents/" + encodeURIComponent(String(erpState.ediUploadedDocId)) + "/map", {}).then(function (res) {
        erpState.ediUploadPreview = null;
        erpState.ediUploadedDocId = null;
        erpGoToOrder("wholesale", res.order.id);
      }).catch(function (error) {
        confirmBtn.disabled = false;
        setAdminDetailStatus(error.message, true);
      });
    });
    btnRow.appendChild(confirmBtn);
  }
  var discardBtn = document.createElement("button");
  discardBtn.type = "button";
  discardBtn.textContent = "Discard";
  discardBtn.addEventListener("click", function () {
    erpState.ediUploadPreview = null;
    erpState.ediUploadedDocId = null;
    renderErpEdiDetail();
  });
  btnRow.appendChild(discardBtn);
  box.appendChild(btnRow);
  return box;
}

function erpEditEdiPartnerForm(p) {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Partner name", true);
  nameInput.value = p.name || "";
  form.appendChild(erpField("Name", nameInput));
  var providerInput = erpTextInput("provider", "");
  providerInput.value = p.provider || "";
  form.appendChild(erpField("Provider", providerInput));
  var transportSel = document.createElement("select");
  [["manual-file", "Manual file"], ["sftp", "SFTP"], ["api", "API"], ["webhook", "Webhook"]].forEach(function (t) {
    var o = document.createElement("option");
    o.value = t[0];
    o.textContent = t[1];
    if (p.transport === t[0]) o.selected = true;
    transportSel.appendChild(o);
  });
  form.appendChild(erpField("Transport", transportSel));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = !!p.active;
  form.appendChild(erpField("Active", activeInput));
  var configArea = document.createElement("textarea");
  configArea.rows = 4;
  configArea.style.width = "100%";
  try {
    configArea.value = JSON.stringify(p.config || {}, null, 2);
  } catch (e) {
    configArea.value = "";
  }
  form.appendChild(erpField("Config JSON", configArea));
  var rotateInput = document.createElement("input");
  rotateInput.type = "checkbox";
  form.appendChild(erpField("Rotate webhook key", rotateInput));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Save partner";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Partner name is required.";
      return;
    }
    var payload = {
      name: name,
      provider: providerInput.value.trim(),
      transport: transportSel.value,
      active: activeInput.checked
    };
    var cfgRaw = configArea.value.trim();
    if (cfgRaw) {
      try {
        payload.config = JSON.parse(cfgRaw);
      } catch (e) {
        status.textContent = "Config must be valid JSON.";
        return;
      }
    }
    if (rotateInput.checked) payload.rotate_webhook_key = true;
    submit.disabled = true;
    status.textContent = "Saving…";
    erpPut("/api/erp/edi-partners/" + encodeURIComponent(String(p.id)), payload).then(function (res) {
      erpState.showEditPartner = false;
      var key = res.webhook_key || (res.partner && res.partner.webhook_key);
      if (key) erpState.lastWebhookKey = key;
      renderErpEdiPartnerDetail(adminDetailEls().body);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

async function erpDownloadCsv(path, filename) {
  setAdminDetailStatus("Preparing export…");
  try {
    var response = await authFetch(path);
    if (!response.ok) {
      var data = await response.json().catch(function () { return {}; });
      throw new Error(authMessage(data, "Export failed."));
    }
    var blob = await response.blob();
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error.message, true);
  }
}

function erpReportTable(headers, rows) {
  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  var table = document.createElement("table");
  table.className = "admin-orders-table";
  var thead = document.createElement("thead");
  var htr = document.createElement("tr");
  headers.forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    r.forEach(function (c) {
      var td = document.createElement("td");
      td.textContent = (c === null || c === undefined || c === "") ? "—" : String(c);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function erpReportQuery(extra) {
  var q = [];
  if (erpState.reportFilters.from) q.push("from=" + encodeURIComponent(erpState.reportFilters.from));
  if (erpState.reportFilters.to) q.push("to=" + encodeURIComponent(erpState.reportFilters.to));
  if (extra) q.push(extra);
  return q.length ? "?" + q.join("&") : "";
}

      var o = document.createElement("option");
      o.value = opt[0];
      o.textContent = opt[1];

/* ---------------- QuickBooks push modal (shared) ---------------- */
function erpShowQbPushModal(opts) {
  var modal = erpOpenModal(opts.title);
  var status = document.createElement("div");
  status.style.marginBottom = "8px";
  modal.body.appendChild(status);
  status.textContent = "Loading preview…";
  erpGet(opts.previewPath).then(function (pv) {
    status.textContent = "";
    opts.renderPreview(modal.body, pv);
    if (pv.item_configured === false) {
      var warn = document.createElement("p");
      warn.style.color = "#c92e29";
      warn.textContent = "No QuickBooks item is configured. Set it in Settings → QuickBooks first.";
      modal.body.appendChild(warn);
      return;
    }
    var note = document.createElement("p");
    note.style.color = "var(--muted)";
    note.textContent = "QuickBooks invoices and sales receipts go live immediately — there is no draft state. This cannot be undone from here.";
    modal.body.appendChild(note);
    var row = document.createElement("div");
    row.className = "erp-toolbar";
    var confirm = document.createElement("button");
    confirm.type = "button";
    confirm.textContent = opts.confirmLabel;
    confirm.addEventListener("click", function () {
      confirm.disabled = true;
      status.textContent = "Pushing to QuickBooks…";
      erpPost(opts.pushPath, {}).then(function (res) {
        modal.close();
        setAdminDetailStatus("Pushed to QuickBooks.");
        if (opts.onDone) opts.onDone(res);
      }).catch(function (error) {
        confirm.disabled = false;
        status.textContent = error.message;
      });
    });
    row.appendChild(confirm);
    modal.body.appendChild(row);
  }).catch(function (error) {
    status.textContent = error.message;
  });
}

    var nameInput = erpTextInput("wholesale_item_name", "Item name (label)");
    nameInput.style.width = "200px";
    var salesInput = erpTextInput("sales_item_id", "Sales summary item ID (optional)");
    salesInput.style.width = "200px";
    form.appendChild(erpField("Wholesale item ID", itemInput));
    form.appendChild(erpField("Item name", nameInput));
    form.appendChild(erpField("Summary item ID", salesInput));
    var save = document.createElement("button");
    save.type = "button";
    save.textContent = "Save mapping";
    save.addEventListener("click", function () {
      save.disabled = true;
      erpPost("/api/erp/quickbooks/config", {
        wholesale_item_id: itemInput.value.trim(),
        wholesale_item_name: nameInput.value.trim(),
        sales_item_id: salesInput.value.trim()
      }).then(function (res) {
        save.disabled = false;
        setAdminDetailStatus("Mapping saved.");
        itemInput.value = res.config.wholesale_item_id || "";
        nameInput.value = res.config.wholesale_item_name || "";
        salesInput.value = res.config.sales_item_id || "";
      }).catch(function (error) {
        save.disabled = false;
        setAdminDetailStatus(error.message, true);
      });
    });
    form.appendChild(save);
    card.appendChild(form);
    erpGet("/api/erp/quickbooks/config").then(function (res) {
      itemInput.value = res.config.wholesale_item_id || "";
      nameInput.value = res.config.wholesale_item_name || "";
      salesInput.value = res.config.sales_item_id || "";
    }).catch(function () {});
  }
  els.body.appendChild(card);
}
</script>
</body>
</html>
