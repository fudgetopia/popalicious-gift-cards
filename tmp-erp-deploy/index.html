<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop-A-Licious ERP</title>
<style>

:root {
  --ink: #16130f; --muted: #6d655e; --paper: #fffaf2; --surface: #ffffff;
  --line: #ded5c8; --red: #ec3f38; --red-dark: #c92e29;
  --yellow: #ffc928; --teal: #1a8d83;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Avenir LT Pro", Avenir, -apple-system, "Segoe UI", sans-serif; }
button { font-family: inherit; }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: min(420px, 100%); background: var(--surface); border: 2px solid var(--ink);
  padding: 32px 28px; box-shadow: 0 15px 35px rgba(40,25,10,.12); }
.login-card h1 { margin: 0 0 4px; font-size: 28px; }
.login-sub { margin: 0 0 20px; color: var(--muted); }
.login-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.login-tab { flex: 1; padding: 10px; border: 2px solid var(--ink); background: var(--surface);
  font-weight: 800; cursor: pointer; }
.login-tab.active { background: var(--ink); color: var(--paper); }
.login-card label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
.login-card input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
  border: 2px solid var(--ink); font-size: 15px; }
.login-card button[type="submit"] { width: 100%; padding: 12px; margin-top: 6px; border: 2px solid var(--ink);
  background: var(--yellow); font-weight: 800; font-size: 16px; cursor: pointer; }
.login-error { color: var(--red-dark); font-weight: 700; font-size: 14px; }

/* app shell */
.app-header { background: var(--ink); color: var(--paper); padding: 0 20px;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.app-brand { font-weight: 900; font-size: 19px; padding: 14px 0; letter-spacing: -.01em; }
.app-nav { display: flex; gap: 4px; }
.app-nav a { color: var(--paper); text-decoration: none; font-weight: 700; font-size: 14px;
  padding: 16px 14px; opacity: .75; }
.app-nav a.active { opacity: 1; border-bottom: 4px solid var(--yellow); }
.app-user { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.app-user button { border: 2px solid var(--paper); background: transparent; color: var(--paper);
  padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
.app-main { max-width: 1120px; margin: 0 auto; padding: 20px 20px 60px; }
.app-main h2 { margin: 6px 0 4px; font-size: 26px; }
.app-status { min-height: 22px; margin: 0 0 14px; color: var(--muted); }
.app-status[data-state="error"] { color: var(--red-dark); font-weight: 700; }
.role-badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px;
  border-radius: 999px; background: var(--teal); color: #fff; margin-left: 6px; vertical-align: middle; }
      .erp-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
      .erp-toolbar input[type="search"] { min-width: 240px; }
      .erp-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 12px 0 20px; padding: 14px; border: 2px solid var(--ink); background: var(--surface); }
      .erp-form label { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 14px; }
      .erp-form input, .erp-form select { padding: 8px 10px; border: 2px solid var(--ink); font-size: 14px; }
      .erp-form button { padding: 8px 14px; border: 2px solid var(--ink); background: var(--yellow); font-weight: 800; cursor: pointer; }
      .erp-form-status { width: 100%; margin: 4px 0 0; font-size: 14px; font-weight: 700; }
      .erp-alert-box { border: 2px solid var(--ink); background: #fff3d6; padding: 12px 16px; margin-bottom: 18px; }
      .erp-alert-box ul { margin: 8px 0 0; padding-left: 20px; }
      .erp-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; border: 2px solid var(--ink); background: #eee; }
      .erp-chip[data-status="sent"] { background: #dbeafe; }
      .erp-chip[data-status="partial"] { background: #fde68a; }
      .erp-chip[data-status="received"] { background: #bbf7d0; }
      .erp-chip[data-status="Planned"] { background: #e0e7ff; }
      .erp-chip[data-status="In progress"] { background: #fde68a; }
      .erp-chip[data-status="Completed"] { background: #bbf7d0; }
      .erp-chip[data-status="Cancelled"] { background: #f3f4f6; }
      .erp-chip[data-status="Reversed"] { background: #fecaca; }
      .erp-detail-meta { display: flex; gap: 8px 20px; flex-wrap: wrap; margin: 10px 0 18px; font-size: 14px; }
      .erp-detail-meta span { background: var(--surface); border: 1px solid var(--line); padding: 4px 10px; }
      .erp-form-inline { align-items: flex-end; }
      .erp-recipe-lines { width: 100%; display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
      .erp-recipe-line-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .erp-recipe-line-row select { min-width: 220px; }
      .erp-chip[data-status="closed"] { background: #ddd; }
      .erp-chip[data-status="cancelled"] { background: #fecaca; }
      .erp-section-title { margin: 26px 0 6px; font-size: 18px; }
      .erp-back { margin-bottom: 8px; border: 2px solid var(--ink); background: var(--surface); padding: 6px 12px; font-weight: 800; cursor: pointer; }
      .erp-item-head h3 { margin: 4px 0; }
      .erp-po-lines { width: 100%; display: grid; gap: 8px; }
      .erp-po-line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .erp-po-line select, .erp-po-line input { padding: 8px 10px; border: 2px solid var(--ink); font-size: 14px; }
      td[data-sign="pos"] { color: #166534; font-weight: 700; }
      td[data-sign="neg"] { color: #b91c1c; font-weight: 700; }
      .admin-stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
      .admin-stat-card { min-width: 0; min-height: 138px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; padding: 20px; border: 2px solid var(--ink); background: var(--surface); }
      .admin-stat-card:nth-child(3n+1) { background: color-mix(in srgb, var(--yellow) 38%, var(--surface)); }
      .admin-stat-card:nth-child(3n+2) { background: color-mix(in srgb, var(--teal) 20%, var(--surface)); }
      .admin-stat-card:nth-child(3n) { background: color-mix(in srgb, var(--red) 13%, var(--surface)); }
      .admin-stat-label { color: var(--muted); font-size: 13px; font-weight: 850; line-height: 1.25; }
      .admin-stat-value { font: 800 clamp(25px, 3vw, 36px)/1 "Avenir LT Pro", Avenir, sans-serif; letter-spacing: -.035em; overflow-wrap: anywhere; }
      .admin-orders-wrap { border: 2px solid var(--ink); background: var(--surface); }
      .admin-orders-table { width: 100%; border-collapse: collapse; }
      .admin-orders-table th { padding: 13px 16px; background: var(--ink); color: var(--paper); text-align: left; font-size: 12px; letter-spacing: .025em; }
      .admin-orders-table td { padding: 16px; border-top: 1px solid var(--line); vertical-align: top; }
      .admin-orders-table th:last-child, .admin-orders-table td:last-child { text-align: right; white-space: nowrap; }
      .admin-orders-empty { margin: 0; padding: 24px; color: var(--muted); }
      .admin-stat-card--clickable { cursor: pointer; }
      .admin-stat-card--clickable:hover, .admin-stat-card--clickable:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .admin-orders-table tbody tr.admin-order-row--clickable { cursor: pointer; }
      .admin-orders-table tbody tr.admin-order-row--clickable:hover { background: color-mix(in srgb, var(--teal) 12%, var(--surface)); }
      .admin-detail-status { min-height: 22px; margin: 0 0 14px; color: var(--muted); }
      .admin-detail-status[data-state="error"] { color: var(--red-dark); font-weight: 700; }

      /* ============ ERP Phase 3: Order hub / Wholesale / EDI ============ */
      .erp-chip[data-status="new"] { background: #e0e7ff; }
      .erp-chip[data-status="in_production"] { background: #fde68a; }
      .erp-chip[data-status="ready"] { background: #dbeafe; }
      .erp-chip[data-status="shipped"] { background: #bbf7d0; }
      .erp-chip[data-status="picked_up"] { background: #ccfbf1; }
      .erp-chip[data-status="parsed"] { background: #e0e7ff; }
      .erp-chip[data-status="mapped"] { background: #fef3c7; }
      .erp-chip[data-status="queued"] { background: #fde68a; }
      .erp-chip[data-status="acked"] { background: #bbf7d0; }
      .erp-chip[data-status="failed"] { background: #fecaca; }
      .erp-chip[data-status="stripe"] { background: #e6e6fa; }
      .erp-chip[data-status="paypal"] { background: #dbeafe; }
      .erp-chip[data-status="wholesale"] { background: #fef3c7; }
      .erp-chip[data-status="inbound"] { background: #e0e7ff; }
      .erp-chip[data-status="outbound"] { background: #fde68a; }
      .erp-subtabs { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
      .erp-subtabs button { padding: 8px 16px; border: 2px solid var(--ink); background: var(--surface);
        font-weight: 800; cursor: pointer; font-size: 14px; }
      .erp-subtabs button.active { background: var(--ink); color: var(--paper); }
      .erp-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5);
        display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
      .erp-modal { background: var(--surface); border: 2px solid var(--ink); max-width: 760px; width: 100%;
        max-height: 85vh; overflow: auto; padding: 20px 24px; }
      .erp-modal h3 { margin-top: 0; }
      .erp-pre { background: #1c1917; color: #f5f0e8; padding: 14px; overflow: auto;
        font-size: 12px; max-height: 320px; white-space: pre-wrap; word-break: break-word; }
      .erp-key-notice { border: 2px solid var(--ink); background: #fff3d6; padding: 14px 18px; margin: 14px 0; }
      .erp-key-notice code { display: block; margin-top: 8px; padding: 10px; background: #fff;
        border: 2px dashed var(--ink); font-size: 15px; word-break: break-all; }
      .erp-chip[data-status="submitted"] { background: #fef3c7; }
      .erp-chip[data-status="accepted"] { background: #d1fae5; }

      /* ============ ERP Phase 5: wholesale customer portal (mobile-first) ============ */
      .ws-shell { max-width: 860px; margin: 0 auto; padding: 12px 12px 96px; }
      .ws-topbar { display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 10px 2px; position: sticky; top: 0; background: var(--paper); z-index: 50; }
      .ws-brand { font-weight: 900; font-size: 18px; }
      .ws-brand small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
      .ws-topbar button { padding: 10px 14px; font-size: 14px; }
      .ws-field { margin: 12px 0; }
      .ws-field label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
      .ws-field input, .ws-field select { width: 100%; padding: 12px; font-size: 16px;
        border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); }
      .ws-cat { font-size: 13px; font-weight: 800; text-transform: uppercase;
        letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
      .ws-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
      @media (min-width: 640px) { .ws-grid { grid-template-columns: 1fr 1fr; } }
      .ws-card { border: 2px solid var(--ink); border-radius: 8px; background: var(--surface);
        padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .ws-card .ws-name { font-weight: 800; font-size: 15px; }
      .ws-card .ws-price { color: var(--muted); font-size: 13px; }
      .ws-stepper { display: flex; align-items: center; gap: 4px; }
      .ws-stepper button { width: 44px; height: 44px; font-size: 22px; font-weight: 900;
        border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; cursor: pointer; }
      .ws-stepper button:active { background: var(--ink); color: var(--paper); }
      .ws-stepper .ws-qty { min-width: 44px; text-align: center; font-size: 18px; font-weight: 800; }
      .ws-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
        border-top: 2px solid var(--ink); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 60; }
      .ws-bar .ws-total { font-size: 20px; font-weight: 900; }
      .ws-bar button { padding: 14px 22px; font-size: 16px; font-weight: 800; }
      .ws-review-line { display: flex; justify-content: space-between; gap: 8px;
        padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
      .ws-review-total { display: flex; justify-content: space-between; font-size: 18px;
        font-weight: 900; padding: 12px 0; }
      .ws-order { border: 2px solid var(--ink); border-radius: 8px; background: var(--surface);
        padding: 12px; margin: 10px 0; }
      .ws-order .ws-order-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .ws-order .ws-order-num { font-weight: 900; font-size: 16px; }
      .ws-prod-line { display: flex; align-items: center; justify-content: space-between; gap: 8px;
        border: 2px solid var(--ink); border-radius: 8px; background: var(--surface);
        padding: 10px 12px; margin: 8px 0; }
      .ws-prod-line.done { background: #d1fae5; }
      .ws-prod-line button { padding: 12px 18px; font-size: 15px; font-weight: 800; min-width: 110px; }
      .ws-progress { font-weight: 800; margin: 10px 0; }
      .ws-empty { color: var(--muted); padding: 24px 0; text-align: center; }
      .ws-error { color: var(--red-dark); font-weight: 700; margin: 10px 0; }
      .pw-wrap { position: relative; display: block; }
      .pw-wrap input { width: 100%; padding-right: 44px; box-sizing: border-box; }
      .pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; font-size: 19px; line-height: 1; padding: 8px; }
      .forgot-wrap { margin: 12px 0 2px; text-align: center; }
      .link-btn { background: none; border: none; color: var(--teal); font-weight: 700;
        cursor: pointer; padding: 4px 2px; font-size: 14px; text-decoration: underline; }
      .login-note { color: var(--teal); font-weight: 700; margin: 10px 0; }

      /* ============ Readability: slightly larger text ============ */
      .login-card label, .login-error { font-size: 15px; }
      .app-nav a { font-size: 15px; }
      .app-user { font-size: 15px; }
      .app-user button { font-size: 14px; }
      .role-badge { font-size: 13px; }
      .erp-form label { font-size: 15px; }
      .erp-form input, .erp-form select { font-size: 15px; }
      .erp-form-status { font-size: 15px; }
      .erp-chip { font-size: 14px; }
      .erp-detail-meta { font-size: 15px; }
      .erp-po-line select, .erp-po-line input { font-size: 15px; }
      .admin-stat-label { font-size: 14px; }
      .admin-orders-table th { font-size: 14px; }
      .admin-orders-table td { font-size: 15px; }
      .erp-pre { font-size: 14px; }
      .ws-brand small { font-size: 13px; }
      .ws-topbar button { font-size: 15px; }
      .ws-field label { font-size: 15px; }
      .ws-cat { font-size: 14px; }
      .ws-card .ws-price { font-size: 14px; }
      .link-btn { font-size: 15px; }

      /* ============ Responsive: phones & tablets ============ */
      /* All data tables live in .admin-orders-wrap: swipe horizontally instead of squeezing. */
      .admin-orders-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      @media (max-width: 900px) {
        .app-header { gap: 12px; padding: 0 12px; }
        .app-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
        .app-nav a { white-space: nowrap; flex-shrink: 0; padding: 14px 10px; }
        .app-user button { min-height: 44px; padding: 10px 16px; }
        .app-main { padding: 12px 12px 48px; }
        .app-main h2 { font-size: 22px; }
        .admin-stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .erp-toolbar input[type="search"] { min-width: 0; flex: 1 1 100%; }
        .erp-form button, .erp-toolbar button { min-height: 44px; }
        .erp-subtabs button { min-height: 44px; }
        .erp-back { min-height: 44px; }
        /* Tables swipe sideways instead of squeezing or pushing the page wide. */
        .admin-orders-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
        .admin-orders-table th, .admin-orders-table td { white-space: nowrap; }
        .admin-orders-table button { min-height: 44px; margin-right: 8px; }
        .admin-orders-table button:last-child { margin-right: 0; }
        /* Barcode and other pictures never overflow their box. */
        .admin-orders-wrap img { max-width: 100%; height: auto; }
        /* 16px inputs stop iOS Safari auto-zoom on focus. */
        .erp-form input, .erp-form select, .erp-form textarea,
        .erp-toolbar input, .erp-toolbar select,
        .login-card input, .login-card select { font-size: 16px; }
        .login-card { padding: 24px 18px; }
      }
      @media (max-width: 640px) {
        /* One field per row on phones so nothing sits side by side and cramped. */
        .erp-form label { flex: 1 1 100%; }
        .erp-form label input, .erp-form label select { flex: 1; min-width: 0; }
        .erp-recipe-line-row select { min-width: 0; flex: 1 1 100%; }
      }
      @media (min-width: 641px) and (max-width: 1100px) {
        .admin-stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (max-width: 420px) {
        .ws-topbar button { padding: 10px 10px; font-size: 13px; }
        .ws-brand { font-size: 16px; }
        .admin-stat-grid { grid-template-columns: 1fr; }
      }

      /* ============ Print-label view (same tab, no pop-up) ============ */
      /* Pop-up windows print blank on some phones/tablets, so the label
         prints from this page: the app hides, only the label shows, and
         the browser prints the real document. Back restores the app. */
      #erpPrintView { display: none; }
      body.erp-printing > :not(#erpPrintView) { display: none !important; }
      body.erp-printing #erpPrintView { display: block; }
      /* Screen only: the bar floats above the label, so the label itself
         renders exactly as it prints — white, no shadow, no gray surround. */
      @media screen {
        body.erp-printing #erpPrintView { padding-top: 120px; }
        #erpPrintView .erp-print-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #fff; padding: 8px 12px; margin: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
      }
      #erpPrintView .erp-print-bar button { min-height: 44px; margin-right: 8px; }
      #erpPrintView .erp-print-help { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
      @media print {
        body.erp-printing > :not(#erpPrintView) { display: none !important; }
        body.erp-printing #erpPrintView { padding-top: 0; }
        #erpPrintView .erp-print-bar { display: none !important; }
        #erpPrintView .label { zoom: 1 !important; }
        /* Print uses a plain block/float layout, not flexbox: some
           browsers mishandle flex in print and can drop the bottom
           band. Proportions stay the photo split: panel 1.70in,
           gap 0.07in, ingredients take the rest; the codes live in
           the ingredients column (bottom-aligned on screen). */
        #erpPrintView .cols { display: block !important; overflow: hidden !important; }
        #erpPrintView .panelcol { float: left !important; }
        #erpPrintView .ingcol { margin-left: 1.77in !important; }
        #erpPrintView .bot { display: block !important; overflow: hidden !important; }
        #erpPrintView .botleft { float: left !important; width: calc(100% - 2.05in) !important; }
        #erpPrintView .botright { float: right !important; }
      }
</style>
</head>
<body>
<div id="bootView" class="login-wrap">
  <div class="login-card">
    <h1>Pop-A-Licious ERP</h1>
    <p class="login-sub">Loading&hellip;</p>
    <noscript><p>JavaScript is required for the ERP. Please enable it and reload.</p></noscript>
  </div>
</div>
<div id="loginView" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Pop-A-Licious ERP</h1>
    <p class="login-sub">Inventory &amp; Purchasing</p>
    <div class="login-tabs">
      <button type="button" id="tabAdmin" class="login-tab active">Admin</button>
      <button type="button" id="tabStaff" class="login-tab">Staff</button>
      <button type="button" id="tabWholesale" class="login-tab">Wholesale</button>
    </div>
    <form id="loginForm">
      <label>Email<input type="email" id="loginEmail" required autocomplete="username"></label>
      <label>Password<span class="pw-wrap"><input type="password" id="loginPass" required autocomplete="current-password"><button type="button" class="pw-eye" data-pw="loginPass" aria-label="Show password">👁</button></span></label>
      <p id="loginNote" class="login-note" hidden></p>
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" id="loginSubmit">Log in</button>
      <p class="forgot-wrap" id="forgotWrap"><button type="button" id="forgotBtn" class="link-btn">Forgot password?</button></p>
    </form>
  </div>
</div>
<div id="setupView" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Set your password</h1>
    <p class="login-sub">Wholesale ordering account</p>
    <form id="setupForm">
      <label>New password (8+ characters)<span class="pw-wrap"><input type="password" id="setupPass" required autocomplete="new-password" minlength="8"><button type="button" class="pw-eye" data-pw="setupPass" aria-label="Show password">👁</button></span></label>
      <label>Confirm password<span class="pw-wrap"><input type="password" id="setupPass2" required autocomplete="new-password" minlength="8"><button type="button" class="pw-eye" data-pw="setupPass2" aria-label="Show password">👁</button></span></label>
      <p id="setupError" class="login-error" hidden></p>
      <button type="submit" id="setupSubmit">Set password &amp; log in</button>
    </form>
  </div>
</div>
<div id="appView" hidden>
  <header class="app-header">
    <div class="app-brand">Pop-A-Licious ERP</div>
    <nav class="app-nav">
      <a href="#/" data-route="home">Dashboard</a>
      <a href="#/inventory" data-route="inventory">Inventory</a>
      <a href="#/purchasing" data-route="purchasing">Purchasing</a>
      <a href="#/production" data-route="production">Production</a>
      <a href="#/orders" data-route="orders">Order hub</a>
      <a href="#/edi" data-route="edi">EDI</a>
      <a href="#/reports" data-route="reports">Reports</a>
      <a href="#/marketing" data-route="marketing">Marketing &amp; Service</a>
      <a href="#/accounting" data-route="accounting">Accounting</a>
      <a href="#/settings" data-route="settings">Settings</a>
      <a href="#/staff-perms" data-route="staff-perms">Staff &amp; permissions</a>
    </nav>
    <div class="app-user"><span id="userLabel"></span><a href="https://pop-a-licious.com/" id="viewStorefrontLink" target="_blank" rel="noopener">View storefront</a><button type="button" id="logoutBtn">Log out</button></div>
  </header>
  <main class="app-main">
    <p id="appStatus" class="app-status"></p>
    <div id="appBody"></div>
  </main>
</div>
<script>
"use strict";

/* ---------- boot loading state (no login flash) ---------- */
// The login form used to be the page's default paint, so a signed-in admin
// arriving on the shared cookie saw it for the seconds the session check
// takes. The form is now hidden in the HTML and a "Loading…" card paints
// instead; the check then reveals the app or the form. This watchdog is
// registered first, so it still fires if later code throws: after 10s with
// no view revealed, fall back to the login form rather than sitting on
// "Loading…" forever.
function hideBoot() {
  var b = document.getElementById("bootView");
  if (b) b.hidden = true;
}
setTimeout(function () {
  var b = document.getElementById("bootView");
  var l = document.getElementById("loginView");
  var a = document.getElementById("appView");
  if (b && !b.hidden && l && l.hidden && a && a.hidden) { b.hidden = true; l.hidden = false; }
}, 10000);

/* ============ Standalone ERP shell ============ */
var API_BASE = "https://popalicious-gift-cards-production.up.railway.app";
var lastAuthStatus = 0;

function erpStoredPerms() {
  try {
    var p = JSON.parse(sessionStorage.getItem("erpUserPerms") || "[]");
    return Array.isArray(p) ? p : [];
  } catch (e) { return []; }
}
function erpSession() {
  try {
    return {
      token: sessionStorage.getItem("erpAuthToken") || "",
      name: sessionStorage.getItem("erpUserName") || "",
      email: sessionStorage.getItem("erpUserEmail") || "",
      role: sessionStorage.getItem("erpUserRole") || "",
      perms: erpStoredPerms()
    };
  } catch (e) { return { token: "", name: "", email: "", role: "" }; }
}
function isLoggedIn() { var s = erpSession(); return !!s.token || !!s.role; }

async function authFetch(path, options) {
  var request = Object.assign({}, options || {});
  var headers = new Headers(request.headers || {});
  var token = erpSession().token;
  if (token && !headers.has("Authorization")) headers.set("Authorization", "Bearer " + token);
  headers.set("X-ERP-Request", "1");
  request.headers = headers;
  request.credentials = "include";
  var response = await fetch(API_BASE + path, request);
  lastAuthStatus = response.status;
  return response;
}
function authMessage(data, fallback) {
  if (!data || typeof data !== "object") return fallback;
  return data.error || data.message || data.detail || fallback;
}
function money(value) { return "$" + Number(value).toFixed(2); }

function adminDetailEls() {
  return {
    body: document.getElementById("appBody"),
    status: document.getElementById("appStatus")
  };
}
function setAdminDetailStatus(message, isError) {
  if (isError && lastAuthStatus === 401) {
    doLogout("Your session expired — please log in again.");
    return;
  }
  var el = document.getElementById("appStatus");
  el.textContent = message || "";
  if (isError) el.setAttribute("data-state", "error");
  else el.removeAttribute("data-state");
}

/* ---------- login ---------- */
var loginMode = "admin";
function setLoginMode(mode) {
  loginMode = mode;
  document.getElementById("tabAdmin").classList.toggle("active", mode === "admin");
  document.getElementById("tabStaff").classList.toggle("active", mode === "staff");
  document.getElementById("tabWholesale").classList.toggle("active", mode === "wholesale");
  document.getElementById("forgotWrap").hidden = false;
  document.getElementById("loginError").hidden = true;
  loginNote("");
}
function loginError(msg) {
  var el = document.getElementById("loginError");
  el.textContent = msg;
  el.hidden = false;
}
async function doLogin(event) {
  event.preventDefault();
  var email = document.getElementById("loginEmail").value.trim();
  var password = document.getElementById("loginPass").value;
  var btn = document.getElementById("loginSubmit");
  btn.disabled = true;
  document.getElementById("loginError").hidden = true;
  try {
    if (loginMode === "admin") {
      var resp = await fetch(API_BASE + "/api/auth/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok || !data.token) throw new Error(authMessage(data, "Login failed."));
      var chk = await fetch(API_BASE + "/api/admin/is-admin?email=" + encodeURIComponent(data.email || email), {
        headers: { "Authorization": "Bearer " + data.token }
      });
      var chkData = await chk.json().catch(function () { return {}; });
      if (!chkData.is_admin) throw new Error("This ERP requires an admin account.");
      saveSession(data.token, data.name || email, data.email || email, "admin");
    } else if (loginMode === "wholesale") {
      var wresp = await fetch(API_BASE + "/api/wholesale/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      });
      var wdata = await wresp.json().catch(function () { return {}; });
      if (!wresp.ok || !wdata.token) throw new Error(authMessage(wdata, "Wholesale login failed."));
      saveSession(wdata.token, wdata.account_name || email, wdata.email || email, "wholesale");
    } else {
      var sresp = await fetch(API_BASE + "/api/loyalty/staff/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      });
      var sdata = await sresp.json().catch(function () { return {}; });
      if (!sresp.ok || !sdata.ok || !sdata.token) throw new Error(authMessage(sdata, "Staff login failed."));
      saveSession(sdata.token, sdata.name || email, sdata.email || email, "staff");
    }
    document.getElementById("loginPass").value = "";
    enterApp();
  } catch (error) {
    loginError(error instanceof TypeError ? "We couldn't reach the server." : error.message);
  } finally {
    btn.disabled = false;
  }
}
function saveSession(token, name, email, role) {
  try {
    sessionStorage.setItem("erpAuthToken", token);
    sessionStorage.setItem("erpUserName", name);
    sessionStorage.setItem("erpUserEmail", email);
    sessionStorage.setItem("erpUserRole", role);
  } catch (e) {}
}
function erpSavePerms(perms) {
  try { sessionStorage.setItem("erpUserPerms", JSON.stringify(perms || [])); } catch (e) {}
}
function doLogout(message) {
  try { fetch(API_BASE + "/api/auth/logout", { method: "POST", credentials: "include" }).catch(function () {}); } catch (e) {}
  try {
    sessionStorage.removeItem("erpAuthToken");
    sessionStorage.removeItem("erpUserName");
    sessionStorage.removeItem("erpUserEmail");
    sessionStorage.removeItem("erpUserRole");
  } catch (e) {}
  var nav = document.querySelector(".app-nav");
  if (nav) nav.style.display = "";
  var brand = document.querySelector(".app-brand");
  if (brand) brand.textContent = "Pop-A-Licious ERP";
  if (location.hash !== "#/") history.replaceState(null, "", "#/");
  showLogin();
  if (message) loginError(message);
}
function showLogin() {
  hideBoot();
  document.getElementById("loginView").hidden = false;
  document.getElementById("setupView").hidden = true;
  document.getElementById("appView").hidden = true;
  document.title = "Log in \u00b7 Pop-A-Licious ERP";
}
/* ---------- wholesale set-password (invite link: #/wholesale-setup?token=…) ---------- */
function wholesaleSetupToken() {
  var h = location.hash || "";
  var m = h.match(/^#\/wholesale-setup\?token=([A-Za-z0-9\-_]+)/);
  return m ? m[1] : "";
}
/* Accept-order email button: #/login?accept_order=W-1002 — handled after login. */
function hashQueryParam(name) {
  var h = location.hash || "";
  var q = h.indexOf("?");
  if (q < 0) return "";
  var parts = h.slice(q + 1).split("&");
  for (var i = 0; i < parts.length; i++) {
    var kv = parts[i].split("=");
    if (decodeURIComponent(kv[0] || "") === name) return decodeURIComponent(kv.slice(1).join("=") || "");
  }
  return "";
}
function erpHandleAcceptOrderIntent(orderNumber) {
  // The admin clicked "Accept order" in the new-order email. They are logged in
  // (this only runs for admins); accept the order now and land on its page.
  try { history.replaceState(null, "", "#/orders"); } catch (e) {}
  setAdminDetailStatus("Accepting order " + orderNumber + "…");
  erpGet("/api/erp/wholesale-orders/by-number/" + encodeURIComponent(orderNumber)).then(function (res) {
    var id = res.order.id;
    return erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(id)) + "/accept", {}).then(function () {
      return { id: id, ok: true };
    }).catch(function (e) {
      return { id: id, ok: false, note: e.message };
    });
  }).then(function (r) {
    erpState.ordersPostMap = { source: "wholesale", id: r.id };
    if ((location.hash || "") !== "#/orders") location.hash = "#/orders";
    else renderRoute();
    setAdminDetailStatus(r.ok
      ? "Order " + orderNumber + " accepted — customer notified. Ready for production."
      : "Order " + orderNumber + " opened (" + (r.note || "could not auto-accept") + ").");
  }).catch(function (e) {
    setAdminDetailStatus("Could not find order " + orderNumber + ": " + e.message, true);
    if ((location.hash || "") !== "#/orders") location.hash = "#/orders";
    else renderRoute();
  });
}
function showWholesaleSetup() {
  hideBoot();
  document.getElementById("loginView").hidden = true;
  document.getElementById("appView").hidden = true;
  document.getElementById("setupView").hidden = false;
  document.title = "Set password \u00b7 Pop-A-Licious Wholesale";
}
function setupError(msg) {
  var el = document.getElementById("setupError");
  el.textContent = msg;
  el.hidden = false;
}
async function doWholesaleSetup(event) {
  event.preventDefault();
  var p1 = document.getElementById("setupPass").value;
  var p2 = document.getElementById("setupPass2").value;
  var btn = document.getElementById("setupSubmit");
  document.getElementById("setupError").hidden = true;
  if (p1 !== p2) { setupError("Passwords do not match."); return; }
  btn.disabled = true;
  try {
    var resp = await fetch(API_BASE + "/api/wholesale/set-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: wholesaleSetupToken(), password: p1 })
    });
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok || !data.token) throw new Error(authMessage(data, "Could not set password."));
    saveSession(data.token, data.account_name || data.email, data.email, "wholesale");
    document.getElementById("setupPass").value = "";
    document.getElementById("setupPass2").value = "";
    history.replaceState(null, "", "#/");
    enterApp();
  } catch (error) {
    setupError(error instanceof TypeError ? "We couldn't reach the server." : error.message);
  } finally {
    btn.disabled = false;
  }
}
function enterApp() {
  hideBoot();
  var s = erpSession();
  document.getElementById("loginView").hidden = true;
  document.getElementById("setupView").hidden = true;
  document.getElementById("appView").hidden = false;
  var label = document.getElementById("userLabel");
  label.textContent = s.name || s.email;
  var badge = document.createElement("span");
  badge.className = "role-badge";
  badge.textContent = s.role === "admin" ? "ADMIN" : (s.role === "wholesale" ? "WHOLESALE" : "STAFF");
  label.appendChild(badge);
  // Wholesale customers get a customer-only shell: no ERP nav at all.
  var nav = document.querySelector(".app-nav");
  if (nav) nav.style.display = s.role === "wholesale" ? "none" : "";
  var brand = document.querySelector(".app-brand");
  if (brand) brand.textContent = s.role === "wholesale" ? "Pop-A-Licious Wholesale" : "Pop-A-Licious ERP";
  var vsLink = document.getElementById("viewStorefrontLink");
  if (vsLink) vsLink.style.display = s.role === "admin" ? "" : "none";
  if ((location.hash || "#/") === "#/") location.hash = "#/";
  renderRoute();
}

/* ================= ERP Phase 5: wholesale customer portal =================
   Customer-only shell: order page + order history. No ERP nav or internals.
   Mobile-first; works at any served path (hash routing only). */
var wsState = { me: null, flavors: [], cart: {}, addressId: 0, po: "", view: "order", orderId: null };

function wsEls() {
  return { body: document.getElementById("appBody"), status: document.getElementById("appStatus") };
}
function wsSetStatus(msg, isErr) {
  var els = wsEls();
  els.status.textContent = msg || "";
  if (isErr) els.status.setAttribute("data-state", "error");
  else els.status.removeAttribute("data-state");
}
function wsMoney(cents) { return "$" + (Number(cents) / 100).toFixed(2); }
function wsStatusLabel(s) {
  return {submitted: "Submitted", accepted: "Accepted", in_production: "In production",
    ready: "Ready", shipped: "Shipped", picked_up: "Picked up", cancelled: "Cancelled"}[s] || s;
}
function renderWholesaleRoute() {
  hideBoot();
  var h = location.hash || "#/";
  document.getElementById("loginView").hidden = true;
  document.getElementById("setupView").hidden = true;
  document.getElementById("appView").hidden = false;
  var nav = document.querySelector(".app-nav");
  if (nav) nav.style.display = "none";
  var m = h.match(/^#\/wholesale-orders\/(\d+)/);
  if (m) { wsState.view = "detail"; wsState.orderId = parseInt(m[1], 10); }
  else if (h.indexOf("#/wholesale-orders") === 0) { wsState.view = "history"; wsState.orderId = null; }
  else if (h.indexOf("#/wholesale-profile") === 0) { wsState.view = "profile"; wsState.orderId = null; }
  else { wsState.view = "order"; wsState.orderId = null; }
  if (wsState.view === "detail") wsRenderOrderDetail();
  else if (wsState.view === "history") wsRenderHistory();
  else if (wsState.view === "profile") wsRenderProfile();
  else wsRenderOrderPage();
}
function wsTopbar(title, showHistory) {
  var bar = document.createElement("div");
  bar.className = "ws-topbar";
  var brand = document.createElement("div");
  brand.className = "ws-brand";
  brand.textContent = "Pop-A-Licious Wholesale";
  var sub = document.createElement("small");
  sub.textContent = (wsState.me && wsState.me.business_name) || title || "";
  brand.appendChild(sub);
  bar.appendChild(brand);
  var right = document.createElement("div");
  if (showHistory !== false) {
    var pb = document.createElement("button");
    pb.type = "button";
    pb.textContent = "Profile";
    pb.addEventListener("click", function () { location.hash = "#/wholesale-profile"; });
    right.appendChild(pb);
    var hb = document.createElement("button");
    hb.type = "button";
    hb.textContent = wsState.view === "history" ? "New order" : "My orders";
    hb.addEventListener("click", function () {
      location.hash = wsState.view === "history" ? "#/" : "#/wholesale-orders";
    });
    right.appendChild(hb);
  }
  var lo = document.createElement("button");
  lo.type = "button";
  lo.textContent = "Log out";
  lo.addEventListener("click", function () { doLogout(); });
  right.appendChild(lo);
  bar.appendChild(right);
  return bar;
}
function wsEnsureData() {
  // Returns a promise resolving when me + flavors are loaded.
  if (wsState.me && wsState.flavors.length) return Promise.resolve();
  wsSetStatus("Loading…");
  return erpGet("/api/wholesale/me").then(function (me) {
    wsState.me = me;
    if (!wsState.po) wsState.po = me.default_po || "";
    return erpGet("/api/wholesale/flavors");
  }).then(function (fl) {
    wsState.flavors = fl.flavors || [];
    wsSetStatus("");
  }).catch(function (error) {
    wsSetStatus(error.message, true);
    throw error;
  });
}
function wsCaseMode() {
  return wsState.me && (wsState.me.pricing_mode || "bag") === "case";
}
function wsCartLines() {
  var lines = [];
  var caseMode = wsCaseMode();
  wsState.flavors.forEach(function (f) {
    var q = Number(wsState.cart[f.flavor_name] || 0);
    if (q > 0) {
      var bags = caseMode ? q * 12 : q;
      lines.push({ flavor_name: f.flavor_name, qty_bags: bags,
        cases: caseMode ? q : 0,
        unit_price_cents: f.price_cents, line_total_cents: Math.round(bags * f.price_cents) });
    }
  });
  return lines;
}
function wsCartTotal() {
  return wsCartLines().reduce(function (t, l) { return t + l.line_total_cents; }, 0);
}
function wsRenderOrderPage() {
  var els = wsEls();
  document.title = "Order \u00b7 Pop-A-Licious Wholesale";
  wsEnsureData().then(function () {
    var me = wsState.me;
    var wrap = document.createElement("div");
    wrap.className = "ws-shell";
    wrap.appendChild(wsTopbar("New order"));
    var h2 = document.createElement("h2");
    h2.textContent = "New order";
    h2.style.margin = "6px 0 0";
    wrap.appendChild(h2);
    // Location picker (only when the customer has multiple addresses)
    var addrs = me.addresses || [];
    if (addrs.length > 1) {
      var f = document.createElement("div");
      f.className = "ws-field";
      var lab = document.createElement("label");
      lab.textContent = "Choose a delivery address";
      var sel = document.createElement("select");
      addrs.forEach(function (a) {
        var o = document.createElement("option");
        o.value = a.id;
        o.textContent = (a.location_name || a.label ? (a.location_name || a.label) + " — " : "") +
          a.street + ", " + a.city + ", " + a.state + " " + a.zip;
        sel.appendChild(o);
      });
      if (wsState.addressId) sel.value = String(wsState.addressId);
      sel.addEventListener("change", function () { wsState.addressId = Number(sel.value); });
      wsState.addressId = wsState.addressId || Number(sel.value);
      lab.appendChild(sel);
      f.appendChild(lab);
      wrap.appendChild(f);
    } else if (addrs.length === 1) {
      wsState.addressId = addrs[0].id;
    }
    // PO field
    var pf = document.createElement("div");
    pf.className = "ws-field";
    var plab = document.createElement("label");
    plab.textContent = "PO number";
    var pin = document.createElement("input");
    pin.value = wsState.po || "";
    pin.placeholder = "Optional";
    pin.addEventListener("input", function () { wsState.po = pin.value; });
    plab.appendChild(pin);
    pf.appendChild(plab);
    wrap.appendChild(pf);
    // Flavor grid grouped by category
    var lastCat = "";
    wsState.flavors.forEach(function (fl) {
      if (fl.category !== lastCat) {
        lastCat = fl.category;
        var ch = document.createElement("div");
        ch.className = "ws-cat";
        ch.textContent = lastCat === "savory" ? "Savory" : "Sweet";
        wrap.appendChild(ch);
        var grid = document.createElement("div");
        grid.className = "ws-grid";
        grid.setAttribute("data-cat", lastCat);
        wrap.appendChild(grid);
      }
      var gridEl = wrap.querySelector('.ws-grid[data-cat="' + lastCat + '"]');
      var card = document.createElement("div");
      card.className = "ws-card";
      var info = document.createElement("div");
      var nm = document.createElement("div");
      nm.className = "ws-name";
      nm.textContent = fl.flavor_name;
      var pr = document.createElement("div");
      pr.className = "ws-price";
      pr.textContent = wsCaseMode() ? wsMoney(fl.price_cents * 12) + " / case (12 bags)"
        : wsMoney(fl.price_cents) + " / bag";
      info.appendChild(nm);
      info.appendChild(pr);
      card.appendChild(info);
      var stepper = document.createElement("div");
      stepper.className = "ws-stepper";
      var minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      minus.setAttribute("aria-label", wsCaseMode() ? "Remove one case of " + fl.flavor_name : "Remove one bag of " + fl.flavor_name);
      var qty = document.createElement("span");
      qty.className = "ws-qty";
      var plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", wsCaseMode() ? "Add one case of " + fl.flavor_name : "Add one bag of " + fl.flavor_name);
      var paint = function () {
        var q = Number(wsState.cart[fl.flavor_name] || 0);
        qty.textContent = String(q);
        card.style.borderColor = q > 0 ? "var(--teal)" : "";
        wsPaintBar();
      };
      minus.addEventListener("click", function () {
        var q = Number(wsState.cart[fl.flavor_name] || 0);
        wsState.cart[fl.flavor_name] = Math.max(0, q - 1);
        paint();
      });
      plus.addEventListener("click", function () {
        var q = Number(wsState.cart[fl.flavor_name] || 0);
        wsState.cart[fl.flavor_name] = Math.min(999, q + 1);
        paint();
      });
      stepper.appendChild(minus);
      stepper.appendChild(qty);
      stepper.appendChild(plus);
      card.appendChild(stepper);
      gridEl.appendChild(card);
      paint();
    });
    els.body.replaceChildren(wrap);
    wsPaintBar();
  }).catch(function () {});
}
function wsPaintBar() {
  var old = document.querySelector(".ws-bar");
  if (old) old.parentNode.removeChild(old);
  if (wsState.view !== "order") return;
  var bar = document.createElement("div");
  bar.className = "ws-bar";
  var total = document.createElement("div");
  total.className = "ws-total";
  var caseMode = wsCaseMode();
  var bags = wsCartLines().reduce(function (t, l) { return t + l.qty_bags; }, 0);
  var cases = wsCartLines().reduce(function (t, l) { return t + (l.cases || 0); }, 0);
  total.textContent = caseMode
    ? wsMoney(wsCartTotal()) + " · " + cases + " case" + (cases === 1 ? "" : "s") + " (" + bags + " bags)"
    : wsMoney(wsCartTotal()) + " · " + bags + " bag" + (bags === 1 ? "" : "s");
  bar.appendChild(total);
  var btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Review order";
  btn.disabled = !wsCartLines().length;
  btn.addEventListener("click", wsShowReviewModal);
  bar.appendChild(btn);
  document.getElementById("appView").appendChild(bar);
}
function wsShowReviewModal() {
  var lines = wsCartLines();
  if (!lines.length) return;
  var me = wsState.me;
  var overlay = document.createElement("div");
  overlay.className = "erp-modal-overlay";
  var modal = document.createElement("div");
  modal.className = "erp-modal";
  var h3 = document.createElement("h3");
  h3.textContent = "Review your order";
  modal.appendChild(h3);
  var caseMode = wsCaseMode();
  lines.forEach(function (l) {
    var row = document.createElement("div");
    row.className = "ws-review-line";
    var left = document.createElement("span");
    left.textContent = caseMode
      ? l.cases + " case" + (l.cases === 1 ? "" : "s") + " × " + l.flavor_name + " @ " + wsMoney(l.unit_price_cents * 12) + "/case"
      : l.qty_bags + " × " + l.flavor_name + " @ " + wsMoney(l.unit_price_cents) + "/bag";
    var right = document.createElement("span");
    right.textContent = wsMoney(l.line_total_cents);
    row.appendChild(left);
    row.appendChild(right);
    modal.appendChild(row);
  });
  var addr = (me.addresses || []).filter(function (a) { return a.id === wsState.addressId; })[0];
  var meta = document.createElement("div");
  meta.className = "ws-review-line";
  var mleft = document.createElement("span");

/* ---------- router ---------- */
function currentRoute() {
  var h = location.hash || "#/";
  if (h.indexOf("#/inventory") === 0) return "inventory";
  if (h.indexOf("#/purchasing") === 0) return "purchasing";
  if (h.indexOf("#/production") === 0) return "production";
  if (h.indexOf("#/orders") === 0) return "orders";
  if (h.indexOf("#/edi") === 0) return "edi";
  if (h.indexOf("#/reports") === 0) return "reports";
  if (h.indexOf("#/marketing") === 0) return "marketing";
  if (h.indexOf("#/accounting") === 0) return "accounting";
  if (h.indexOf("#/settings") === 0) return "settings";
  if (h.indexOf("#/staff-perms") === 0) return "staff-perms";
  return "home";
}
function renderRoute() {
  // Invite links land here even with no session: #/wholesale-setup?token=…
  if (wholesaleSetupToken()) { showWholesaleSetup(); return; }
  if (!isLoggedIn()) { showLogin(); return; }
  // "Accept order" button from the new-order admin email: #/login?accept_order=W-1002
  if (erpSession().role === "admin") {
    var acceptNum = hashQueryParam("accept_order");
    if (acceptNum) { erpHandleAcceptOrderIntent(acceptNum); return; }
  }
  // Wholesale customers never see ERP internals: dedicated customer shell.
  if (erpSession().role === "wholesale") { renderWholesaleRoute(); return; }
  var openModals = document.querySelectorAll(".erp-modal-overlay");
  openModals.forEach(function (m) { m.parentNode.removeChild(m); });
  hideBoot();
  document.getElementById("loginView").hidden = true;
  document.getElementById("appView").hidden = false;
  var r = currentRoute();
  var links = document.querySelectorAll(".app-nav a");
  links.forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-route") === r);
    // Phase 4: Reports and Settings are admin-only (permission matrix).
    var dr = a.getAttribute("data-route");
    if (dr === "reports" || dr === "settings" || dr === "accounting" || dr === "staff-perms") {
      a.style.display = erpIsAdmin() ? "" : "none";
    }
    else if (dr === "marketing") {
      // Marketing & Service: staff see it when they hold any marketing read perm.
      a.style.display = (mktHas("instagram.read") || mktHas("newsletter.read") || mktHas("support.read")) ? "" : "none";
    }
  });
  if (r === "inventory") {
    document.title = "Inventory \u00b7 Pop-A-Licious ERP";
    erpState.selectedItemId = null;
    erpState.selectedItem = null;
    loadErpInventoryDetail();
  } else if (r === "purchasing") {
    document.title = "Purchasing \u00b7 Pop-A-Licious ERP";
    erpState.selectedPOId = null;
    loadErpPurchasingDetail();
  } else if (r === "production") {
    document.title = "Production \u00b7 Pop-A-Licious ERP";
    erpState.selectedBatchId = null;
    erpState.selectedRecipeId = null;
    if (erpState.productionPostBatch) {
      erpState.selectedBatchId = erpState.productionPostBatch;
      erpState.productionPostBatch = null;
    }
    loadErpProductionDetail();
  } else if (r === "orders") {
    document.title = "Order hub \u00b7 Pop-A-Licious ERP";
    erpState.selectedOrderSource = null;
    erpState.selectedOrderId = null;
    erpState.selectedAccountId = null;
    if (erpState.ordersPostMap) {
      erpState.selectedOrderSource = erpState.ordersPostMap.source;
      erpState.selectedOrderId = erpState.ordersPostMap.id;
      erpState.ordersPostMap = null;
    }
    loadErpOrdersDetail();
  } else if (r === "edi") {
    document.title = "EDI \u00b7 Pop-A-Licious ERP";
    erpState.selectedEdiDocId = null;
    erpState.selectedEdiPartnerId = null;
    if (erpState.ediPostDoc) {
      erpState.selectedEdiDocId = erpState.ediPostDoc;
      erpState.ediPostDoc = null;
    }
    loadErpEdiDetail();
  } else if (r === "accounting") {
    document.title = "Accounting \u00b7 Pop-A-Licious ERP";
    loadErpAccountingDetail();
  } else if (r === "reports") {
    document.title = "Reports \u00b7 Pop-A-Licious ERP";
    if (!erpIsAdmin()) { location.hash = "#/"; return; }
    loadErpReportsDetail();
  } else if (r === "marketing") {
    document.title = "Marketing & Service \u00b7 Pop-A-Licious ERP";
    if (!(mktHas("instagram.read") || mktHas("newsletter.read") || mktHas("support.read"))) { location.hash = "#/"; return; }
    loadErpMarketingDetail();
  } else if (r === "settings") {
    document.title = "Settings \u00b7 Pop-A-Licious ERP";
    if (!erpIsAdmin()) { location.hash = "#/"; return; }
    loadErpSettingsDetail();
  } else if (r === "staff-perms") {
    document.title = "Staff & permissions \u00b7 Pop-A-Licious ERP";
    if (!erpIsAdmin()) { location.hash = "#/"; return; }
    loadErpStaffPermsDetail();
  } else {
    document.title = "Dashboard \u00b7 Pop-A-Licious ERP";
    renderHome();
  }
  window.scrollTo(0, 0);
}
async function renderHome() {
  var body = document.getElementById("appBody");
  body.replaceChildren();
  setAdminDetailStatus("Loading dashboard\u2026");
  var h2 = document.createElement("h2");
  h2.textContent = "Dashboard";
  body.appendChild(h2);
  var grid = document.createElement("div");
  grid.className = "admin-stat-grid";
  body.appendChild(grid);
  var invVal = null, openPOs = null, note = "";
  try {
    var resp = await authFetch("/api/admin/dashboard");
    var data = await resp.json().catch(function () { return {}; });
    if (resp.ok) {
      invVal = data.inventory_value_cents;
      openPOs = data.open_purchase_orders;
    } else if (resp.status === 403) {
      note = "Inventory value is admin-only; sign in as an admin to see it.";
    } else {
      note = authMessage(data, "Dashboard unavailable.");
    }
  } catch (e) {
    note = "We couldn't connect to load the dashboard.";
  }
  function card(label, value, hash) {
    var a = document.createElement("a");
    a.className = "admin-stat-card admin-stat-card--clickable";
    a.href = hash;
    a.style.textDecoration = "none";
    a.style.color = "inherit";
    var lab = document.createElement("div");
    lab.className = "admin-stat-label";
    lab.textContent = label;
    var val = document.createElement("div");
    val.className = "admin-stat-value";
    val.textContent = value;
    a.appendChild(lab);
    a.appendChild(val);
    return a;
  }
  grid.appendChild(card("Inventory value",
    invVal === null || invVal === undefined ? "\u2014" : money(invVal / 100), "#/inventory"));
  grid.appendChild(card("Open purchase orders",
    openPOs === null || openPOs === undefined ? "\u2014" : String(openPOs), "#/purchasing"));
  setAdminDetailStatus(note, !!note && invVal === null);
}

            var d = 0, c = 0, bad = false, effective = 0;

              var dv = erpDollarsToCents(lr.debit.value || "0");
              var cv = erpDollarsToCents(lr.credit.value || "0");
              if (dv === null || cv === null) { bad = true; return; }
              if (dv && cv) { bad = true; return; }
              if (!dv && !cv) return;
              effective++;
              d += dv; c += cv;
            });
            totals.textContent = "Debits " + erpMoney(d) + " \u00b7 Credits " + erpMoney(c) +
              (d === c && d > 0 ? " \u00b7 Balanced" : " \u00b7 Out of balance by " + erpMoney(Math.abs(d - c)));
            submit.disabled = bad || d !== c || d <= 0 || effective < 2;
          }
          function addLineRow() {
            var row = document.createElement("div");

            credit.placeholder = "Credit $";

            memo.placeholder = "Line memo";

            remove.textContent = "Remove";
            var lr = { sel: sel, debit: debit, credit: credit, memo: memo, row: row };
            remove.addEventListener("click", function () {
              var idx = lineRows.indexOf(lr);
              if (idx >= 0) lineRows.splice(idx, 1);
              if (row.parentNode) row.parentNode.removeChild(row);
              updateTotals();
            });
            debit.addEventListener("input", updateTotals);
            credit.addEventListener("input", updateTotals);
            row.appendChild(sel); row.appendChild(debit); row.appendChild(credit);
            row.appendChild(memo); row.appendChild(remove);

              var dv = erpDollarsToCents(lr.debit.value || "0");
              var cv = erpDollarsToCents(lr.credit.value || "0");
              if (dv === null || cv === null || (dv && cv)) { bad = true; return; }
              if (!dv && !cv) return;
              lines.push({ account_id: Number(lr.sel.value), debit_cents: dv, credit_cents: cv, memo: lr.memo.value.trim() });
            });
            if (bad || lines.length < 2) { status.textContent = "Each line needs exactly one of debit or credit."; return; }
            var d = 0, c = 0;
            lines.forEach(function (l) { d += l.debit_cents; c += l.credit_cents; });
            if (d !== c || d <= 0) { status.textContent = "Debits must equal credits."; return; }
            submit.disabled = true;
            status.textContent = "Posting\u2026";
            erpPost("/api/erp/accounting/journal", { date: dateInput.value, memo: memoInput.value.trim(), lines: lines }).then(function () {
              erpState.showNewEntry = false;
              return loadErpAccountingDetail();
            }).catch(function (error) {
              submit.disabled = false;
              status.textContent = error.message;
            });
          });
          return form;
        }

          table.innerHTML = "<thead><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Remaining</th><th>Unit cost</th></tr></thead>";
          var tb = document.createElement("tbody");
          (data.lines || []).forEach(function (l) {
            var tr = document.createElement("tr");
            var itemCell = document.createElement("td");
            itemCell.setAttribute("data-label", "Item");
            var sku = document.createElement("strong");
            sku.textContent = l.sku;
            itemCell.appendChild(sku);
            itemCell.appendChild(document.createElement("br"));
            itemCell.appendChild(document.createTextNode(l.item_name));
            tr.appendChild(itemCell);
            tr.appendChild(erpCell("Ordered", erpQty(l.qty_ordered)));
            tr.appendChild(erpCell("Received", erpQty(l.qty_received)));
            tr.appendChild(erpCell("Remaining", erpQty(Number(l.qty_ordered) - Number(l.qty_received))));
            tr.appendChild(erpCell("Unit cost", erpMoney(l.unit_cost_cents)));
            tb.appendChild(tr);
          });
          table.appendChild(tb);
          wrap.appendChild(table);
          body.appendChild(wrap);
          var actions = document.createElement("div");
          actions.className = "erp-toolbar";
          function statusButton(label, toStatus, confirmText) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = label;
            btn.addEventListener("click", function () {
              if (confirmText && !window.confirm(confirmText)) return;
              btn.disabled = true;
              erpPost("/api/erp/purchase-orders/" + encodeURIComponent(String(po.id)) + "/status", {status: toStatus})
                .then(function () { return loadErpPurchasingDetail(); })
                .catch(function (error) {
                  btn.disabled = false;
                  setAdminDetailStatus(error.message, true);
                });
            });
            actions.appendChild(btn);
          }
          if (po.status === "draft") {
            statusButton("Mark sent", "sent");
            statusButton("Cancel PO", "cancelled", "Cancel " + po.po_number + "?");
          } else if (po.status === "sent" || po.status === "partial") {
            statusButton("Cancel PO", "cancelled", "Cancel " + po.po_number + "?");
          } else if (po.status === "received") {
            statusButton("Close PO", "closed");
          }
          if (actions.children.length) body.appendChild(actions);
          if (po.status === "sent" || po.status === "partial") {
            body.appendChild(erpSectionTitle("Receive goods"));
            body.appendChild(erpReceiveForm(po, data.lines || []));
          }
        }
        function erpReceiveForm(po, lines) {
          var form = document.createElement("form");
          form.className = "erp-form";
          var open = lines.filter(function (l) { return Number(l.qty_ordered) - Number(l.qty_received) > 1e-9; });
          if (!open.length) {
            var done = document.createElement("p");
            done.className = "admin-orders-empty";
            done.textContent = "All lines fully received.";
            form.appendChild(done);
            return form;
          }
          var locLabel = document.createElement("label");
          locLabel.textContent = "Receive into ";
          var locSel = document.createElement("select");
          erpLocationOptions(erpDefaultLocationId()).forEach(function (o) { locSel.appendChild(o); });
          locLabel.appendChild(locSel);
          form.appendChild(locLabel);
          var lotLabel = document.createElement("label");
          lotLabel.textContent = "Lot code ";
          var lotInput = document.createElement("input");
          lotInput.placeholder = "optional (auto if blank)";
          lotLabel.appendChild(lotInput);
          form.appendChild(lotLabel);
          var expLabel = document.createElement("label");
          expLabel.textContent = "Expiry ";
          var expInput = document.createElement("input");
          expInput.type = "date";
          expLabel.appendChild(expInput);
          form.appendChild(expLabel);
          var qtyInputs = [];
          open.forEach(function (l) {
            var remaining = Number(l.qty_ordered) - Number(l.qty_received);
            var rowLabel = document.createElement("label");
            rowLabel.textContent = l.sku + " — receive (max " + erpQty(remaining) + ") ";
            var qtyInput = document.createElement("input");
            qtyInput.type = "number";
            qtyInput.step = "any";
            qtyInput.min = "0";
            qtyInput.max = String(remaining);
            qtyInput.placeholder = "0";
            qtyInput.setAttribute("aria-label", "Quantity received for " + l.sku);
            rowLabel.appendChild(qtyInput);
            form.appendChild(rowLabel);
            qtyInputs.push({line_id: l.id, input: qtyInput, max: remaining});
          });
          var submit = document.createElement("button");
          submit.type = "submit";
          submit.textContent = "Record receipt";
          form.appendChild(submit);
          var status = document.createElement("p");
          status.className = "erp-form-status";
          form.appendChild(status);
          form.addEventListener("submit", function (event) {
            event.preventDefault();
            var payload = [];
            for (var i = 0; i < qtyInputs.length; i++) {
              var q = Number(qtyInputs[i].input.value);
              if (!isFinite(q) || q < 0) {
                status.textContent = "Quantities must be numbers.";
                return;
              }
              if (q > qtyInputs[i].max + 1e-9) {
                status.textContent = "Can't receive more than ordered.";
                return;
              }
              if (q > 0) payload.push({line_id: qtyInputs[i].line_id, qty_received: q});
            }
            if (!payload.length) {
              status.textContent = "Enter a quantity for at least one line.";
              return;
            }
            submit.disabled = true;
            status.textContent = "Receiving…";
            erpPost("/api/erp/purchase-orders/" + encodeURIComponent(String(po.id)) + "/receive", {
              lines: payload,
              location_id: Number(locSel.value),
              lot_code: lotInput.value.trim(),
              expiry_date: expInput.value
            }).then(function (res) {
              status.textContent = "Received. PO is now " + res.status + ".";
              return loadErpPurchasingDetail();
            }).catch(function (error) {
              submit.disabled = false;
              status.textContent = error.message;
            });
          });
          return form;
        }

function erpIsAdmin() { return erpSession().role === "admin"; }

async function erpPut(path, body) {
  var response = await authFetch(path, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });
  var data = await response.json().catch(function () { return {}; });
  if (response.status === 401 || response.status === 403) throw new Error("Admin or staff access required.");
  if (!response.ok) throw new Error(authMessage(data, "We couldn't complete that request."));
  return data;
}

async function erpDelete(path) {
  var response = await authFetch(path, { method: "DELETE" });
  var data = await response.json().catch(function () { return {}; });
  if (response.status === 401 || response.status === 403) throw new Error("Admin or staff access required.");
  if (!response.ok) throw new Error(authMessage(data, "We couldn't complete that request."));
  return data;
}

function erpBatchStatusLabel(s) {
  var labels = {planned: "Planned", in_progress: "In progress", completed: "Completed",
                cancelled: "Cancelled", reversed: "Reversed"};
  return labels[s] || s;
}

async function loadErpProductionDetail() {
  setAdminDetailStatus("Loading production…");
  try {
    var results = await Promise.all([
      erpGet("/api/erp/recipes"),
      erpGet("/api/erp/batches"),
      erpGet("/api/erp/items"),
      erpGet("/api/erp/locations")
    ]);
    erpState.recipes = results[0].recipes || [];
    erpState.batches = results[1].batches || [];
    erpState.items = results[2].items || [];
    erpState.locations = results[3].locations || [];
    renderErpProductionDetail();
    setAdminDetailStatus(erpState.batches.length +
      (erpState.batches.length === 1 ? " batch, " : " batches, ") +
      erpState.recipes.length +
      (erpState.recipes.length === 1 ? " recipe." : " recipes."));
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ?
      "We couldn't connect to load production." : error.message, true);
  }
}

function erpRecipeById(id) {
  for (var i = 0; i < erpState.recipes.length; i++) {
    if (String(erpState.recipes[i].id) === String(id)) return erpState.recipes[i];
  }
  return null;
}

function renderErpProductionDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  if (erpState.selectedBatchId) { renderErpBatchDetail(els.body); return; }
  if (erpState.selectedRecipeId) { renderErpRecipeDetail(els.body); return; }

  // ---- Batches section ----
  var h2 = document.createElement("h2");
  h2.textContent = "Production";
  els.body.appendChild(h2);

  var toolbar = document.createElement("div");
  toolbar.className = "erp-toolbar";
  var filterLabel = document.createElement("label");
  filterLabel.textContent = "Status ";
  var filterSel = document.createElement("select");
  [["", "All batches"], ["planned", "Planned"], ["in_progress", "In progress"],
   ["completed", "Completed"], ["cancelled", "Cancelled"], ["reversed", "Reversed"]
  ].forEach(function (opt) {
    var o = document.createElement("option");
    o.value = opt[0];
    o.textContent = opt[1];
    if (erpState.batchStatusFilter === opt[0]) o.selected = true;
    filterSel.appendChild(o);
  });
  filterSel.addEventListener("change", function () {
    erpState.batchStatusFilter = filterSel.value;
    renderErpProductionDetail();
  });
  filterLabel.appendChild(filterSel);
  toolbar.appendChild(filterLabel);
  if (erpIsAdmin()) {
    var newBtn = document.createElement("button");
    newBtn.type = "button";
    newBtn.textContent = erpState.showNewBatch ? "Cancel" : "New batch";
    newBtn.addEventListener("click", function () {
      erpState.showNewBatch = !erpState.showNewBatch;
      erpState.newBatchResult = null;
      erpState.lastShortfalls = null;
      renderErpProductionDetail();
    });
    toolbar.appendChild(newBtn);
  }
  els.body.appendChild(toolbar);
  if (erpState.showNewBatch) {
    if (!erpState.recipes.length) {
      var noRec = document.createElement("p");
      noRec.className = "admin-orders-empty";
      noRec.textContent = "Add a recipe first (below) before creating a batch.";
      els.body.appendChild(noRec);
    } else {
      els.body.appendChild(erpNewBatchForm());
    }
  }
  if (erpState.newBatchResult) {
    var doneBox = document.createElement("div");
    doneBox.className = "erp-alert-box";
    var strong = document.createElement("strong");
    strong.textContent = "Batch " + erpState.newBatchResult.batch_number + " created.";
    doneBox.appendChild(strong);
    els.body.appendChild(doneBox);
  }
  if (erpState.lastShortfalls && erpState.lastShortfalls.length) {
    var warn = document.createElement("div");
    warn.className = "erp-alert-box";
    var wh = document.createElement("strong");
    wh.textContent = "Stock shortfalls for this batch:";

    var wul = document.createElement("ul");
    erpState.lastShortfalls.forEach(function (s) {
      var li = document.createElement("li");
      li.textContent = s.sku + " (" + s.item_name + "): need " + erpQtyFrac(s.required) +
        " " + (s.unit || "") + ", have " + erpQtyFrac(s.on_hand);
      wul.appendChild(li);
    });
    warn.appendChild(wul);
    els.body.appendChild(warn);
  }

  var batches = erpState.batches.filter(function (b) {
    return !erpState.batchStatusFilter || b.status === erpState.batchStatusFilter;
  });
  if (!batches.length) {
    var empty = document.createElement("p");
    empty.className = "admin-orders-empty";
    empty.textContent = "No batches yet — start one above when it's time to pop.";
    els.body.appendChild(empty);

    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    var table = document.createElement("table");
    table.className = "admin-orders-table";

    var hr = document.createElement("tr");
    ["Batch", "Recipe", "Status", "Planned", "Actual", "Cost/bag", "Lot code", "Order ref"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

        erpState.selectedBatchId = b.id;
        renderErpProductionDetail();
      });
      tr.appendChild(erpCell("Batch", b.batch_number));
      tr.appendChild(erpCell("Recipe", b.recipe_name));
      var std = document.createElement("td");
      std.setAttribute("data-label", "Status");

      tr.appendChild(std);
      tr.appendChild(erpCell("Planned", erpQty(b.planned_qty_bags)));
      tr.appendChild(erpCell("Actual", b.actual_qty_bags ? erpQty(b.actual_qty_bags) : "—"));
      tr.appendChild(erpCell("Cost/bag", b.cost_per_bag_cents !== null && b.cost_per_bag_cents !== undefined ?
        erpMoney(b.cost_per_bag_cents) : "—"));

      tr.appendChild(erpCell("Order ref", b.order_ref || "—"));
      tbody.appendChild(tr);

    table.appendChild(tbody);
    wrap.appendChild(table);
    els.body.appendChild(wrap);

  // ---- Recipes section ----
  var rh = document.createElement("h2");
  rh.textContent = "Recipes";
  rh.style.marginTop = "32px";
  els.body.appendChild(rh);
  var rtoolbar = document.createElement("div");
  rtoolbar.className = "erp-toolbar";
  if (erpIsAdmin()) {
    var nrBtn = document.createElement("button");
    nrBtn.type = "button";
    nrBtn.textContent = erpState.showNewRecipe ? "Cancel" : "New recipe";
    nrBtn.addEventListener("click", function () {
      erpState.showNewRecipe = !erpState.showNewRecipe;
      erpState.showImportRecipes = false;
      renderErpProductionDetail();
    });
    rtoolbar.appendChild(nrBtn);
    var impBtn = document.createElement("button");
    impBtn.type = "button";
    impBtn.textContent = erpState.showImportRecipes ? "Cancel" : "Import recipes (CSV)";
    impBtn.addEventListener("click", function () {
      erpState.showImportRecipes = !erpState.showImportRecipes;
      erpState.showNewRecipe = false;
      renderErpProductionDetail();
    });
    rtoolbar.appendChild(impBtn);
  }
  els.body.appendChild(rtoolbar);
  if (erpState.showNewRecipe) els.body.appendChild(erpNewRecipeForm(null));
  if (erpState.showImportRecipes) els.body.appendChild(erpImportRecipesForm());

  if (!erpState.recipes.length) {
    var rempty = document.createElement("p");
    rempty.className = "admin-orders-empty";
    rempty.textContent = "No recipes yet — add each flavor's recipe to start tracking production.";
    els.body.appendChild(rempty);
  } else {
    var rwrap = document.createElement("div");
    rwrap.className = "admin-orders-wrap";
    var rtable = document.createElement("table");
    rtable.className = "admin-orders-table";
    var rthead = document.createElement("thead");
    var rhr = document.createElement("tr");
    ["Recipe", "Batch size", "Version", "Lines"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      rhr.appendChild(th);
    });
    rthead.appendChild(rhr);
    rtable.appendChild(rthead);
    var rtbody = document.createElement("tbody");
    erpState.recipes.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.addEventListener("click", function () {
        erpState.selectedRecipeId = r.id;
        erpState.selectedRecipeVersion = null;
        renderErpProductionDetail();
      });
      tr.appendChild(erpCell("Recipe", r.name));
      tr.appendChild(erpCell("Batch size", erpQty(r.batch_size_bags) + " bags"));
      tr.appendChild(erpCell("Version", "v" + r.version));
      tr.appendChild(erpCell("Lines", String(r.line_count)));
      rtbody.appendChild(tr);
    });
    rtable.appendChild(rtbody);
    rwrap.appendChild(rtable);
    els.body.appendChild(rwrap);
  }
}

function erpStateSelect(name, required) {
  var sel = document.createElement("select");
  sel.name = name;
  if (required) sel.required = true;
  var ph = document.createElement("option");
  ph.value = "";
  ph.textContent = "Select state";
