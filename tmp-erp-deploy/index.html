function erpNewWholesaleOrderForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";

  var acctSel = document.createElement("select");
  acctSel.name = "account_id";
  acctSel.required = true;
  erpState.wholesaleAccounts.forEach(function (a) {
    var o = document.createElement("option");
    o.value = a.id;
    o.textContent = a.name + " (" + erpMoney(a.price_per_bag_cents) + "/bag)";
    acctSel.appendChild(o);
  });
  form.appendChild(erpField("Account", acctSel));

  function accountPriceDollars() {
    var a = erpAccountById(acctSel.value);
    if (a && a.price_per_bag_cents) return (Number(a.price_per_bag_cents) / 100).toFixed(2);
    return "";
  }
  acctSel.addEventListener("change", function () {
    var d = accountPriceDollars();
    var rows = linesWrap.querySelectorAll(".erp-po-line");
    for (var i = 0; i < rows.length; i++) {
      var p = rows[i].querySelector('input[name="unit_price"]');
      if (p && !p.value.trim() && d) p.value = d;
    }
  });

  var orderDate = erpTextInput("order_date", "YYYY-MM-DD");
  orderDate.type = "date";
  form.appendChild(erpField("Order date", orderDate));
  var dueDate = erpTextInput("due_date", "YYYY-MM-DD");
  dueDate.type = "date";
  form.appendChild(erpField("Due date", dueDate));
  form.appendChild(erpField("Notes (optional)", erpTextInput("notes", "")));

  var linesWrap = document.createElement("div");
  linesWrap.className = "erp-po-lines";
  form.appendChild(linesWrap);
  var addRowBtn = document.createElement("button");
  addRowBtn.type = "button";
  addRowBtn.textContent = "+ Add line";
  addRowBtn.addEventListener("click", function () {
    linesWrap.appendChild(erpWholesaleLineRow("", null, accountPriceDollars()));
  });
  form.appendChild(addRowBtn);
  linesWrap.appendChild(erpWholesaleLineRow("", null, accountPriceDollars()));

  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Create wholesale order";
  form.appendChild(submit);
  form.appendChild(status);

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var rows = linesWrap.querySelectorAll(".erp-po-line");
    if (!rows.length) {
      status.textContent = "Add at least one line.";
      return;
    }
    var lines = [];
    for (var i = 0; i < rows.length; i++) {
      var f = rows[i].querySelector('input[name="flavor_name"]').value.trim();
      var qv = Number(rows[i].querySelector('input[name="qty_bags"]').value);
      var priceRaw = rows[i].querySelector('input[name="unit_price"]').value.trim();
      if (!f || !isFinite(qv) || qv <= 0) {
        status.textContent = "Every line needs a flavor name and a bag quantity greater than zero.";
        return;
      }
      var line = {flavor_name: f, qty_bags: qv};
      if (priceRaw) {
        var cents = erpDollarsToCents(priceRaw);
        if (cents === null) {
          status.textContent = "Line " + (i + 1) + ": price must be a number or left blank (account price).";
          return;
        }
        line.unit_price_cents = cents;
      }
      lines.push(line);
    }
    submit.disabled = true;
    status.textContent = "Creating order…";
    erpPost("/api/erp/wholesale-orders", {
      account_id: Number(acctSel.value),
      order_date: orderDate.value || undefined,
      due_date: dueDate.value || undefined,
      notes: form.notes.value.trim(),
      lines: lines
    }).then(function (res) {
      erpState.showNewWholesaleOrder = false;
      erpGoToOrder("wholesale", res.order.id);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

  form.appendChild(erpField("Payment terms", erpTextInput("payment_terms", "Net 30")));
  form.appendChild(erpField("Notes", erpTextInput("notes", "")));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = true;
  form.appendChild(erpField("Active", activeInput));
  var staffManagedInput = document.createElement("input");
  staffManagedInput.type = "checkbox";
  form.appendChild(erpField("We create this customer's orders", staffManagedInput));
  var staffManagedHint = document.createElement("p");
  staffManagedHint.className = "erp-form-status";
  staffManagedHint.textContent = "Staff-managed: the customer doesn't need to verify a portal account. Employees create their orders and send invoices.";
  form.appendChild(staffManagedHint);
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Create account";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Account name is required.";
      return;
    }
    var payload = {
      name: name,
      contact_name: form.contact_name.value.trim(),
      contact_person: form.contact_person.value.trim(),
      email: emailInput.value.trim(),
      phone: form.phone.value.trim(),
      payment_terms: form.payment_terms.value.trim(),
      default_po: form.default_po.value.trim(),
      notes: form.notes.value.trim(),
      active: activeInput.checked,
      pricing_mode: (form.querySelector('input[name="pricing_mode"]:checked') || {}).value || "bag",
      staff_managed: staffManagedInput.checked,
      location_name: form.location_name.value.trim(),
      street: form.street.value.trim(),
      city: form.city.value.trim(),
      state: form.state.value.trim(),
      zip: form.zip.value.trim(),
      location_contact: form.location_contact.value.trim(),
      location_email: form.location_email.value.trim(),
      location_phone: form.location_phone.value.trim()
    };
    var priceFields = [["price_per_bag", "price_per_bag_cents"],
      ["savory_price", "savory_price_cents"], ["sweet_price", "sweet_price_cents"]];
    for (var pi = 0; pi < priceFields.length; pi++) {
      var raw = form[priceFields[pi][0]].value.trim();
      if (raw) {
        var c = erpDollarsToCents(raw);
        if (c === null) {
          status.textContent = "Prices must be numbers.";
          return;
        }
        payload[priceFields[pi][1]] = c;
      }
    }
    submit.disabled = true;
    status.textContent = "Creating account…";
    erpPost("/api/erp/wholesale-accounts", payload).then(function (res) {
      erpState.showNewAccount = false;
      erpState.selectedAccountId = res.account.id;
      erpState.showEditAccount = false;
      return loadErpOrdersDetail();
    }).catch(function (error) {

}

/* ---------- account detail ---------- */
function renderErpAccountDetail(body) {
  var id = erpState.selectedAccountId;
  setAdminDetailStatus("Loading account…");
  erpGet("/api/erp/wholesale-accounts/" + encodeURIComponent(String(id))).then(function (res) {
    var a = res.account;
    var orders = res.orders || [];
    body.replaceChildren();
    body.appendChild(erpBackButton("← All accounts", function () {
      erpState.selectedAccountId = null;
      erpState.showEditAccount = false;
      erpState.ordersView = "accounts";
      renderErpOrdersDetail();
    }));
    var h2 = document.createElement("h2");
    h2.textContent = a.name + " ";
    h2.appendChild(erpChip(a.active ? "received" : "cancelled", a.active ? "Active" : "Inactive"));
    body.appendChild(h2);
    var meta = document.createElement("div");
    meta.className = "erp-detail-meta";
    ["Contact: " + (a.contact_name || "—"),
     "Contact person: " + (a.contact_person || "—"),
     "Email: " + (a.email || "—"),
     "Phone: " + (a.phone || "—"),
     "Address: " + (a.address || "—"),
     "Price/bag: " + (a.price_per_bag_cents ? erpMoney(a.price_per_bag_cents) : "—"),
     "Pricing: " + (((a.pricing_mode || "bag") === "case") ? "Per case (12 bags)" : "Per bag"),
     "Savory: " + (a.savory_price_cents ? erpMoney(a.savory_price_cents) : "—") +
       " · Sweet: " + (a.sweet_price_cents ? erpMoney(a.sweet_price_cents) : "—") +
       (((a.pricing_mode || "bag") === "case" && a.savory_price_cents && a.sweet_price_cents)
         ? "  (cases: " + erpMoney(a.savory_price_cents * 12) + " · " + erpMoney(a.sweet_price_cents * 12) + ")" : ""),
     "Default PO: " + (a.default_po || "—"),
     "Portal: " + (a.account_status || "active"),
     "Ordering: " + (a.staff_managed ? "We create their orders" : "Customer orders in the portal"),
     "Terms: " + (a.payment_terms || "—"),
     "Orders: " + orders.length
    ].forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      meta.appendChild(s);
    });
    body.appendChild(meta);
    if (a.notes) {
      var notes = document.createElement("p");
      notes.textContent = a.notes;
      body.appendChild(notes);
    }
    if (erpIsAdmin()) {
      var etool = document.createElement("div");
      etool.className = "erp-toolbar";
      // Phase 5: invite the customer to the ordering portal — skipped for
      // staff-managed accounts: we create their orders, so the customer
      // never needs to verify a portal account.
      if (!a.staff_managed) {
        var inviteBtn = document.createElement("button");
        inviteBtn.type = "button";
        inviteBtn.textContent = "Invite to portal";
        inviteBtn.addEventListener("click", function () {
          inviteBtn.disabled = true;
          setAdminDetailStatus("Sending invitation…");
          erpPost("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id)) + "/invite?reveal=1", {
            portal_url: location.origin + location.pathname
          }).then(function (res) {
            setAdminDetailStatus("Invitation sent to " + res.email + "." +
              (res.invite_link ? " Invite link (copy to customer): " + res.invite_link : ""));
          }).catch(function (error) {
            setAdminDetailStatus(error.message, true);
          }).finally(function () { inviteBtn.disabled = false; });
        });
        etool.appendChild(inviteBtn);
      } else {
        var smNote = document.createElement("span");
        smNote.textContent = "Staff-managed — we create their orders; no portal invite needed.";
        etool.appendChild(smNote);
      }
      // Edit sits next to Deactivate so the two account actions are together.
      var editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.textContent = erpState.showEditAccount ? "Cancel edit" : "Edit account";
      editBtn.addEventListener("click", function () {
        erpState.showEditAccount = !erpState.showEditAccount;
        renderErpAccountDetail(body);
      });
      etool.appendChild(editBtn);
      // Deactivate / reactivate the customer. Deactivating blocks their
      // portal login immediately; the button flips to Reactivate as the undo.
      var deactBtn = document.createElement("button");
      deactBtn.type = "button";
      var isDeactivated = (a.account_status === "deactivated");
      deactBtn.textContent = isDeactivated ? "Reactivate" : "Deactivate";
      deactBtn.addEventListener("click", function () {
        if (!isDeactivated) {
          var ok = window.confirm("Deactivate " + a.name +
            "? They will no longer be able to log in to the ordering portal.");
          if (!ok) return;
        }
        deactBtn.disabled = true;
        setAdminDetailStatus(isDeactivated ? "Reactivating…" : "Deactivating…");
        erpPost("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id)) +
                (isDeactivated ? "/reactivate" : "/deactivate"), {}).then(function () {
          setAdminDetailStatus(isDeactivated ? "Account reactivated." : "Account deactivated.");
          renderErpAccountDetail(body);
        }).catch(function (error) {
          setAdminDetailStatus(error.message, true);
        }).finally(function () { deactBtn.disabled = false; });
      });
      etool.appendChild(deactBtn);
      // Full delete: removes the account, its portal users, addresses, and
      // all of its orders. Destructive — two-tap inline confirm.
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "Delete";
      var delArmed = false;
      var delReset = null;
      delBtn.addEventListener("click", function () {
        if (!delArmed) {
          delArmed = true;
          delBtn.textContent = "Tap again to confirm delete";
          delReset = setTimeout(function () {
            delArmed = false;
            delBtn.textContent = "Delete";
          }, 6000);
          return;
        }
        if (delReset) clearTimeout(delReset);
        delArmed = false;
        delBtn.textContent = "Delete";
        delBtn.disabled = true;
        setAdminDetailStatus("Deleting…");
        erpDelete("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id))).then(function () {
          setAdminDetailStatus("Account deleted.");
          erpState.selectedAccountId = null;
          erpState.showEditAccount = false;
          erpState.ordersView = "accounts";
          renderErpOrdersDetail();
        }).catch(function (error) {
          setAdminDetailStatus(error.message, true);
        }).finally(function () { delBtn.disabled = false; });
      });
      etool.appendChild(delBtn);
      body.appendChild(etool);
      if (erpState.showEditAccount) body.appendChild(erpEditAccountForm(a));
    }
    // Phase 5: delivery addresses — customer profile, read-only for admins.
    // Customers manage their own locations in the portal Profile.
    var ah = document.createElement("h3");
    ah.textContent = "Customer profile — delivery locations (read-only)";
    body.appendChild(ah);
    var abody = document.createElement("div");
    abody.id = "erpAccountAddresses";
    body.appendChild(abody);
    erpRenderAccountAddresses(abody, a.id);
    var oh = document.createElement("h3");
    oh.textContent = "Order history";
    body.appendChild(oh);
    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    body.appendChild(wrap);
    if (!orders.length) {
      var empty = document.createElement("p");
      empty.className = "admin-orders-empty";
      empty.textContent = "No orders for this account yet.";
      wrap.appendChild(empty);
    } else {
      var table = document.createElement("table");
      table.className = "admin-orders-table";
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      ["Order", "Status", "Qty", "Total", "Order date", "Due"].forEach(function (c) {
        var th = document.createElement("th");
        th.textContent = c;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = document.createElement("tbody");
      orders.forEach(function (o) {
        var tr = document.createElement("tr");
        var numTd = document.createElement("td");
        var link = document.createElement("a");
        link.href = "#/orders";
        link.textContent = o.order_number;
        link.addEventListener("click", function (e) {
          e.preventDefault();
          erpGoToOrder("wholesale", o.id);
        });
        numTd.appendChild(link);
        tr.appendChild(numTd);
        var stTd = document.createElement("td");
        stTd.appendChild(erpChip(o.status, erpOrderStatusLabel(o.status)));
        tr.appendChild(stTd);
        tr.appendChild(erpCell("Qty", o.total_qty));
        tr.appendChild(erpCell("Total", erpMoney(o.total_cents)));
        tr.appendChild(erpCell("Order date", o.order_date || erpFmtDate(o.created_at)));
        tr.appendChild(erpCell("Due", o.due_date || "—"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
    }
    setAdminDetailStatus(a.name + ".");
  }).catch(function (error) {
    setAdminDetailStatus(error.message, true);
  });
}

/* ---------- Phase 5: delivery addresses ---------- */
function erpRenderAccountAddresses(container, accountId) {
  container.replaceChildren();
  erpGet("/api/erp/wholesale-accounts/" + encodeURIComponent(String(accountId)) + "/addresses").then(function (res) {
    var addrs = res.addresses || [];
    if (addrs.length) {
      var list = document.createElement("div");
      addrs.forEach(function (ad) {
        var row = document.createElement("div");
        row.className = "ws-prod-line" + (ad.active ? "" : " done");
        var info = document.createElement("div");
        var nm = document.createElement("div");
        nm.style.fontWeight = "800";
        nm.textContent = (ad.location_name || ad.label || "Location") + (ad.active ? "" : " (inactive)");
        var sub = document.createElement("div");
        sub.style.fontSize = "13px";
        sub.style.color = "var(--muted)";
        sub.textContent = [ad.street, ad.city, ad.state, ad.zip].filter(Boolean).join(", ");
        info.appendChild(nm);
        info.appendChild(sub);
        var contact = document.createElement("div");
        contact.style.fontSize = "13px";
        contact.style.color = "var(--muted)";
        var bits = [];
        if (ad.contact_name) bits.push(ad.contact_name);
        if (ad.contact_email) bits.push(ad.contact_email);
        if (ad.contact_phone) bits.push(ad.contact_phone);
        else if (ad.phone) bits.push(ad.phone);
        if (bits.length) {
          contact.textContent = bits.join(" · ");
          info.appendChild(contact);
        }
        row.appendChild(info);
        list.appendChild(row);
      });
      container.appendChild(list);
    } else {
      var e = document.createElement("p");
      e.className = "admin-orders-empty";
      e.textContent = "No delivery locations yet — the customer adds them in their portal profile.";
      container.appendChild(e);
    }
  }).catch(function (error) {
    container.textContent = error.message;
  });
}

function erpEditAccountForm(a) {

  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Account name", true);
  nameInput.value = a.name || "";
  form.appendChild(erpField("Name", nameInput));
  var contactInput = erpTextInput("contact_name", "");
  contactInput.value = a.contact_name || "";
  form.appendChild(erpField("Contact", contactInput));
  var emailInput = erpTextInput("email", "");
  emailInput.type = "email";
  emailInput.value = a.email || "";
  form.appendChild(erpField("Email", emailInput));
  var phoneInput = erpTextInput("phone", "");
  phoneInput.value = a.phone || "";
  form.appendChild(erpField("Phone", phoneInput));
  var contactPersonEditInput = erpTextInput("contact_person", "");

  var savoryEditInput = erpTextInput("savory_price", "4.00");

  form.appendChild(erpField("Savory price/bag ($)", savoryEditInput));

  if (a.sweet_price_cents) sweetEditInput.value = (Number(a.sweet_price_cents) / 100).toFixed(2);
  form.appendChild(erpField("Sweet price/bag ($)", sweetEditInput));
  var modeEditField = document.createElement("label");
  modeEditField.textContent = "Price by ";

  modeEditBag.type = "radio"; modeEditBag.name = "pricing_mode"; modeEditBag.value = "bag";
  modeEditBag.checked = (a.pricing_mode || "bag") !== "case";
  var modeEditBagLab = document.createElement("span");
  modeEditBagLab.textContent = " Per bag  ";
  var modeEditCase = document.createElement("input");
  modeEditCase.type = "radio"; modeEditCase.name = "pricing_mode"; modeEditCase.value = "case";
  modeEditCase.checked = (a.pricing_mode || "bag") === "case";
  var modeEditCaseLab = document.createElement("span");
  modeEditCaseLab.textContent = " Per case (12 bags) ";
  modeEditField.appendChild(modeEditBag); modeEditField.appendChild(modeEditBagLab);
  modeEditField.appendChild(modeEditCase); modeEditField.appendChild(modeEditCaseLab);
  form.appendChild(modeEditField);
  var caseEditHint = document.createElement("p");
  caseEditHint.className = "erp-form-status";
  form.appendChild(caseEditHint);
  var paintCaseEditHint = function () {
    var sv = erpDollarsToCents(savoryEditInput.value.trim());
    var sw = erpDollarsToCents(sweetEditInput.value.trim());
    if (sv === null || sw === null) { caseEditHint.textContent = ""; return; }
    caseEditHint.textContent = "Case price (12 bags): savory " + erpMoney(sv * 12) +

  };
  savoryEditInput.addEventListener("input", paintCaseEditHint);
  sweetEditInput.addEventListener("input", paintCaseEditHint);
  paintCaseEditHint();
  var poInput = erpTextInput("default_po", "");
  poInput.value = a.default_po || "";
  form.appendChild(erpField("Default PO", poInput));
  var termsInput = erpTextInput("payment_terms", "Net 30");
  termsInput.value = a.payment_terms || "";
  form.appendChild(erpField("Payment terms", termsInput));
  var notesInput = erpTextInput("notes", "");
  notesInput.value = a.notes || "";
  form.appendChild(erpField("Notes", notesInput));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = !!a.active;
  form.appendChild(erpField("Active", activeInput));
  var staffManagedEditInput = document.createElement("input");
  staffManagedEditInput.type = "checkbox";
  staffManagedEditInput.checked = !!a.staff_managed;
  form.appendChild(erpField("We create this customer's orders", staffManagedEditInput));
  var staffManagedEditHint = document.createElement("p");
  staffManagedEditHint.className = "erp-form-status";
  staffManagedEditHint.textContent = "Staff-managed: the customer doesn't need to verify a portal account. Employees create their orders and send invoices.";
  form.appendChild(staffManagedEditHint);
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Save account";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Account name is required.";
      return;
    }
    var payload = {
      name: name,
      contact_name: contactInput.value.trim(),
      contact_person: contactPersonEditInput.value.trim(),
      email: emailInput.value.trim(),
      phone: phoneInput.value.trim(),
      payment_terms: termsInput.value.trim(),
      default_po: poInput.value.trim(),
      notes: notesInput.value.trim(),
      active: activeInput.checked,
      pricing_mode: (form.querySelector('input[name="pricing_mode"]:checked') || {}).value || "bag",
      staff_managed: staffManagedEditInput.checked
    };
    var priceFields = [["savory_price", "savory_price_cents", savoryEditInput.value.trim()],
      ["sweet_price", "sweet_price_cents", sweetEditInput.value.trim()]];
    for (var pi = 0; pi < priceFields.length; pi++) {
      if (priceFields[pi][2]) {
        var cents = erpDollarsToCents(priceFields[pi][2]);
        if (cents === null) {
          status.textContent = "Prices must be numbers.";
          return;
        }
        payload[priceFields[pi][1]] = cents;
      }
    }
    submit.disabled = true;
    status.textContent = "Saving…";
    erpPut("/api/erp/wholesale-accounts/" + encodeURIComponent(String(a.id)), payload).then(function () {
      erpState.showEditAccount = false;
      renderErpAccountDetail(adminDetailEls().body);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

/* ---------- Phase 5: production checklist ---------- */
function erpRenderProductionChecklist(container, orderId, orderStatus, onDone) {
  container.replaceChildren();
  erpGet("/api/erp/wholesale-orders/" + encodeURIComponent(String(orderId)) + "/production").then(function (res) {
    var lines = res.lines || [];
    if (!lines.length) return; // no checklist until the order enters production
    var h = document.createElement("h3");
    h.textContent = "Production checklist";
    container.appendChild(h);
    var prog = document.createElement("p");
    prog.className = "ws-progress";
    prog.textContent = res.done + " of " + res.total + " flavors done";
    container.appendChild(prog);
    lines.forEach(function (l) {
      var row = document.createElement("div");
      row.className = "ws-prod-line" + (l.done ? " done" : "");
      var info = document.createElement("div");
      var nm = document.createElement("div");
      nm.style.fontWeight = "800";
      nm.textContent = l.flavor_name + " — " + l.qty_bags + " bags";
      info.appendChild(nm);
      if (l.done && l.done_by) {
        var sub = document.createElement("div");
        sub.style.fontSize = "13px";
        sub.style.color = "var(--muted)";
        sub.textContent = "Done by " + l.done_by;
        info.appendChild(sub);
      }
      row.appendChild(info);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = l.done ? "Undo" : "Mark done";
      btn.addEventListener("click", function () {
        btn.disabled = true;
        erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(orderId)) +
          "/production/" + l.id + "/done", {done: !l.done}).then(function () {
          if (onDone) onDone();
        }).catch(function (e) {
          btn.disabled = false;
          setAdminDetailStatus(e.message, true);
        });
      });
      row.appendChild(btn);
      container.appendChild(row);
    });
  }).catch(function () { /* checklist unavailable — not fatal */ });
}

/* ---------- batch detail: linked orders section (Phase 3 extension) ---------- */
function erpRenderBatchLinkedOrders(body, batch) {
  var h = document.createElement("h3");
  h.textContent = "Linked orders";
  body.appendChild(h);
  var linkable = erpIsAdmin() && batch.status !== "completed" && batch.status !== "reversed" && batch.status !== "cancelled";
  if (linkable) {
    var toolbar = document.createElement("div");
    toolbar.className = "erp-toolbar";
    var linkBtn = document.createElement("button");
    linkBtn.type = "button";
    linkBtn.textContent = "Link order";
    linkBtn.addEventListener("click", function () {
      erpShowLinkOrderModal(batch, function () { renderErpBatchDetail(adminDetailEls().body); });
    });
    toolbar.appendChild(linkBtn);
    body.appendChild(toolbar);
  }
  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  body.appendChild(wrap);
  var loading = document.createElement("p");
  loading.className = "admin-orders-empty";
  loading.textContent = "Loading linked orders…";
  wrap.appendChild(loading);
  erpGet("/api/erp/batches/" + encodeURIComponent(String(batch.id)) + "/orders").then(function (res) {
    wrap.replaceChildren();
    var links = res.links || [];
    if (!links.length) {
      var empty = document.createElement("p");
      empty.className = "admin-orders-empty";
      empty.textContent = "No orders linked to this batch yet.";
      wrap.appendChild(empty);
      return;
    }
    var table = document.createElement("table");
    table.className = "admin-orders-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["Order", "Source", "Customer", "Bags", "Linked by", "Linked at"].concat(linkable ? [""] : []).forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });

    links.forEach(function (lk) {
      var tr = document.createElement("tr");
      var numTd = document.createElement("td");
      var link = document.createElement("a");
      link.href = "#/orders";
      link.textContent = lk.order_number;
      link.addEventListener("click", function (e) {
        e.preventDefault();
        erpGoToOrder(lk.order_source, lk.order_id);
      });
      numTd.appendChild(link);
      tr.appendChild(numTd);
      var srcTd = document.createElement("td");
      srcTd.appendChild(erpChip(lk.order_source, erpSourceLabel(lk.order_source)));
      tr.appendChild(srcTd);
      tr.appendChild(erpCell("Customer", lk.customer_name));
      tr.appendChild(erpCell("Bags", erpQty(lk.qty_bags)));
      tr.appendChild(erpCell("Linked by", lk.created_by));
      tr.appendChild(erpCell("Linked at", erpFmtDate(lk.created_at)));
      if (linkable) {
        var unTd = document.createElement("td");
        var unBtn = document.createElement("button");
        unBtn.type = "button";
        unBtn.textContent = "Unlink";
        unBtn.addEventListener("click", function () {
          if (!window.confirm("Unlink order " + lk.order_number + " from batch " + batch.batch_number + "?")) return;
          unBtn.disabled = true;
          setAdminDetailStatus("Unlinking…");
          erpDelete("/api/erp/batches/" + encodeURIComponent(String(batch.id)) +
            "/orders/" + encodeURIComponent(String(lk.id))).then(function () {
            renderErpBatchDetail(adminDetailEls().body);
          }).catch(function (error) {
            unBtn.disabled = false;
            setAdminDetailStatus(error.message, true);
          });
        });
        unTd.appendChild(unBtn);
        tr.appendChild(unTd);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

  }).catch(function (error) {
    wrap.replaceChildren();
    var e = document.createElement("p");
    e.className = "admin-orders-empty";
    e.textContent = error.message;
    wrap.appendChild(e);
  });
}

/* ---------------- EDI ---------------- */
function erpEdiStatusLabel(s) {
  var labels = {received: "Received", parsed: "Parsed", mapped: "Mapped",
    queued: "Queued", sent: "Sent", acked: "Acked", failed: "Failed"};
  return labels[s] || s;
}
function erpEdiDocTypeLabel(t) {
  var labels = {850: "850 PO", 855: "855 Ack", 856: "856 ASN", 810: "810 Invoice", 997: "997"};
  return labels[t] || t;
}
function erpEdiDirectionLabel(d) {
  return d === "inbound" ? "Inbound" : d === "outbound" ? "Outbound" : (d || "—");
}
function erpTransportLabel(t) {
  var labels = {"manual-file": "Manual file", sftp: "SFTP", api: "API", webhook: "Webhook"};
  return labels[t] || t;
}

async function loadErpEdiDetail() {
  setAdminDetailStatus("Loading EDI…");
  try {
    var q = [];
    if (erpState.ediDocDirectionFilter) q.push("direction=" + encodeURIComponent(erpState.ediDocDirectionFilter));
    if (erpState.ediDocTypeFilter) q.push("doc_type=" + encodeURIComponent(erpState.ediDocTypeFilter));
    if (erpState.ediDocStatusFilter) q.push("status=" + encodeURIComponent(erpState.ediDocStatusFilter));
    var qs = q.length ? "?" + q.join("&") : "";
    var results = await Promise.all([
      erpGet("/api/erp/edi-documents" + qs),
      erpGet("/api/erp/edi-partners")
    ]);
    erpState.ediDocuments = results[0].documents || [];
    erpState.ediPartners = results[1].partners || [];
    renderErpEdiDetail();
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ?
      "We couldn't connect to load EDI." : error.message, true);
  }
}

function renderErpEdiDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  if (erpState.selectedEdiDocId) { renderErpEdiDocDetail(els.body); return; }
  if (erpState.selectedEdiPartnerId) { renderErpEdiPartnerDetail(els.body); return; }
  var h2 = document.createElement("h2");
  h2.textContent = "EDI";
  els.body.appendChild(h2);
  if (erpState.lastWebhookKey) els.body.appendChild(erpWebhookKeyNotice());
  var tabs = document.createElement("div");
  tabs.className = "erp-subtabs";
  [["documents", "Documents"], ["partners", "Partners"]].forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t[1];
    if (erpState.ediView === t[0]) b.classList.add("active");
    b.addEventListener("click", function () {
      erpState.ediView = t[0];
      renderErpEdiDetail();
    });
    tabs.appendChild(b);
  });
  els.body.appendChild(tabs);
  if (erpState.ediView === "documents") renderErpEdiDocuments(els.body);
  else renderErpEdiPartners(els.body);
}

function erpWebhookKeyNotice() {
  var box = document.createElement("div");
  box.className = "erp-key-notice";
  var strong = document.createElement("strong");
  strong.textContent = "Webhook key — copy it now. It is shown only once and never again.";
  box.appendChild(strong);

  dismiss.type = "button";

  return box;
}

/* ---------- EDI documents ---------- */
function renderErpEdiDocuments(body) {
  var toolbar = document.createElement("div");
  toolbar.className = "erp-toolbar";
  function filterSelect(labelText, options, current, onChange) {
    var label = document.createElement("label");
    label.textContent = labelText + " ";
    var sel = document.createElement("select");
    options.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt[0];
      o.textContent = opt[1];
      if (current === opt[0]) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", onChange);
    label.appendChild(sel);
    return label;
  }
  toolbar.appendChild(filterSelect("Direction",
    [["", "All"], ["inbound", "Inbound"], ["outbound", "Outbound"]],
    erpState.ediDocDirectionFilter,
    function (e) { erpState.ediDocDirectionFilter = e.target.value; loadErpEdiDetail(); }));
  toolbar.appendChild(filterSelect("Type",
    [["", "All"], ["850", "850 PO"], ["855", "855 Ack"], ["856", "856 ASN"], ["810", "810 Invoice"], ["997", "997"]],
    erpState.ediDocTypeFilter,
    function (e) { erpState.ediDocTypeFilter = e.target.value; loadErpEdiDetail(); }));
  toolbar.appendChild(filterSelect("Status",
    [["", "All"], ["received", "Received"], ["parsed", "Parsed"], ["mapped", "Mapped"],
     ["queued", "Queued"], ["sent", "Sent"], ["acked", "Acked"], ["failed", "Failed"]],
    erpState.ediDocStatusFilter,
    function (e) { erpState.ediDocStatusFilter = e.target.value; loadErpEdiDetail(); }));
  if (erpIsAdmin()) {
    var upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.textContent = erpState.showUploadEdi ? "Cancel" : "Upload X12";
    upBtn.addEventListener("click", function () {
      erpState.showUploadEdi = !erpState.showUploadEdi;
      renderErpEdiDetail();
    });
    toolbar.appendChild(upBtn);
  }
  body.appendChild(toolbar);
  if (erpState.showUploadEdi && erpIsAdmin()) body.appendChild(erpEdiUploadForm());
  if (erpState.ediUploadPreview) body.appendChild(erpEdiUploadPreview());

  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  body.appendChild(wrap);
  if (!erpState.ediDocuments.length) {
    var empty = document.createElement("p");
    empty.className = "admin-orders-empty";
    empty.textContent = "No EDI documents match these filters.";
    wrap.appendChild(empty);
    return;
  }
  var table = document.createElement("table");
  table.className = "admin-orders-table";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["#", "Partner", "Direction", "Type", "Status", "Order", "Created"].forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  erpState.ediDocuments.forEach(function (d) {
    var tr = document.createElement("tr");
    tr.style.cursor = "pointer";
    tr.addEventListener("click", function () {
      erpState.selectedEdiDocId = d.id;
      renderErpEdiDetail();
    });
    tr.appendChild(erpCell("#", d.id));
    tr.appendChild(erpCell("Partner", d.partner_name));
    var dirTd = document.createElement("td");
    dirTd.appendChild(erpChip(d.direction, erpEdiDirectionLabel(d.direction)));
    tr.appendChild(dirTd);
    tr.appendChild(erpCell("Type", erpEdiDocTypeLabel(d.doc_type)));
    var stTd = document.createElement("td");
    stTd.appendChild(erpChip(d.status, erpEdiStatusLabel(d.status)));
    tr.appendChild(stTd);
    var ordTd = document.createElement("td");
    if (d.order_source && d.order_id) {
      var link = document.createElement("a");
      link.href = "#/orders";
      link.textContent = d.order_number || (d.order_source + "/" + d.order_id);
      link.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        erpGoToOrder(d.order_source, d.order_id);
      });
      ordTd.appendChild(link);
    } else {
      ordTd.textContent = "—";
    }
    tr.appendChild(ordTd);
    tr.appendChild(erpCell("Created", erpFmtDate(d.created_at)));
    tbody.appendChild(tr);

function erpEdiUploadForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var partnerSel = document.createElement("select");
  partnerSel.name = "partner_id";
  var none = document.createElement("option");
  none.value = "";
  none.textContent = "No partner (auto-match)";
  partnerSel.appendChild(none);
  erpState.ediPartners.forEach(function (p) {
    var o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name + " (" + erpTransportLabel(p.transport) + ")";
    partnerSel.appendChild(o);
  });
  form.appendChild(erpField("Partner", partnerSel));
  var fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".txt,.edi,.x12";
  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      area.value = String(reader.result || "");
      nameInput.value = file.name;
    };
    reader.readAsText(file);
  });
  form.appendChild(erpField("File", fileInput));
  var nameInput = erpTextInput("filename", "purchase-order.x12");
  form.appendChild(erpField("Filename", nameInput));
  var area = document.createElement("textarea");
  area.rows = 10;
  area.required = true;
  area.style.width = "100%";
  area.placeholder = "Paste X12 content here (or choose a file above)…";
  form.appendChild(area);
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Parse upload";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!area.value.trim()) {
      status.textContent = "Paste X12 content or choose a file.";
      return;
    }
    submit.disabled = true;
    status.textContent = "Parsing…";
    var payload = {filename: nameInput.value.trim(), content: area.value};
    if (partnerSel.value) payload.partner_id = Number(partnerSel.value);
    erpPost("/api/erp/edi-documents/upload", payload).then(function (res) {
      erpState.ediUploadPreview = res.preview;
      erpState.ediUploadedDocId = res.document.id;
      erpState.showUploadEdi = false;
      status.textContent = "";
      return loadErpEdiDetail();
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

function erpEdiUploadPreview() {
  var preview = erpState.ediUploadPreview;
  var box = document.createElement("div");
  box.className = "erp-alert-box";
  var strong = document.createElement("strong");
  strong.textContent = "Upload parsed — document #" + erpState.ediUploadedDocId + ".";
  box.appendChild(strong);
  var meta = document.createElement("div");
  meta.className = "erp-detail-meta";
  ["PO: " + (preview.po_number || "—"),
   "Partner: " + (preview.partner_name || "—"),
   "Matched account: " + (preview.account_name || "—")
  ].forEach(function (t) {
    var s = document.createElement("span");
    s.textContent = t;
    meta.appendChild(s);
  });
  box.appendChild(meta);
  var lines = preview.lines || [];
  if (lines.length) {
    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    var table = document.createElement("table");
    table.className = "admin-orders-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["Flavor", "Qty", "Unit price"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    lines.forEach(function (l) {
      var tr = document.createElement("tr");
      tr.appendChild(erpCell("Flavor", l.flavor));
      tr.appendChild(erpCell("Qty", l.qty));
      tr.appendChild(erpCell("Unit price", l.unit_price_cents ? erpMoney(l.unit_price_cents) : "—"));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.appendChild(wrap);
  }
  var errors = preview.errors || [];
  if (errors.length) {
    var eh = document.createElement("p");
    eh.style.fontWeight = "800";
    eh.textContent = "Fix these before confirming:";
    box.appendChild(eh);
    var ul = document.createElement("ul");
    errors.forEach(function (e) {
      var li = document.createElement("li");
      li.textContent = e;
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  var btnRow = document.createElement("div");
  btnRow.className = "erp-toolbar";
  if (!errors.length) {
    var confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.textContent = "Confirm → create wholesale order";
    confirmBtn.addEventListener("click", function () {
      confirmBtn.disabled = true;
      setAdminDetailStatus("Creating wholesale order from PO…");
      erpPost("/api/erp/edi-documents/" + encodeURIComponent(String(erpState.ediUploadedDocId)) + "/map", {}).then(function (res) {
        erpState.ediUploadPreview = null;
        erpState.ediUploadedDocId = null;
        erpGoToOrder("wholesale", res.order.id);
      }).catch(function (error) {
        confirmBtn.disabled = false;
        setAdminDetailStatus(error.message, true);
      });
    });
    btnRow.appendChild(confirmBtn);
  }
  var discardBtn = document.createElement("button");
  discardBtn.type = "button";
  discardBtn.textContent = "Discard";
  discardBtn.addEventListener("click", function () {
    erpState.ediUploadPreview = null;
    erpState.ediUploadedDocId = null;
    renderErpEdiDetail();
  });
  btnRow.appendChild(discardBtn);
  box.appendChild(btnRow);
  return box;
}

function erpNewEdiPartnerForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Partner name", true);
  form.appendChild(erpField("Name", nameInput));
  form.appendChild(erpField("Provider", erpTextInput("provider", "e.g. SPS Commerce")));
  var transportSel = document.createElement("select");

    o.value = t[0];
    o.textContent = t[1];
    transportSel.appendChild(o);
  });
  form.appendChild(erpField("Transport", transportSel));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = true;
  form.appendChild(erpField("Active", activeInput));
  var configArea = document.createElement("textarea");
  configArea.rows = 4;
  configArea.style.width = "100%";
  configArea.placeholder = 'Optional config JSON, e.g. {"account_id": 3, "ship_to_map": {}}';
  form.appendChild(erpField("Config JSON", configArea));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Create partner";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Partner name is required.";
      return;
    }
    var payload = {
      name: name,
      provider: form.provider.value.trim(),
      transport: transportSel.value,
      active: activeInput.checked
    };
    var cfgRaw = configArea.value.trim();
    if (cfgRaw) {
      try {
        payload.config = JSON.parse(cfgRaw);
      } catch (e) {
        status.textContent = "Config must be valid JSON.";
        return;
      }
    }
    submit.disabled = true;
    status.textContent = "Creating partner…";
    erpPost("/api/erp/edi-partners", payload).then(function (res) {
      erpState.showNewPartner = false;
      var key = res.webhook_key || (res.partner && res.partner.webhook_key);
      if (key) erpState.lastWebhookKey = key;
      erpState.selectedEdiPartnerId = res.partner.id;
      erpState.showEditPartner = false;
      return loadErpEdiDetail();

      submit.disabled = false;
      status.textContent = error.message;

function erpEditEdiPartnerForm(p) {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";
  var nameInput = erpTextInput("name", "Partner name", true);
  nameInput.value = p.name || "";
  form.appendChild(erpField("Name", nameInput));
  var providerInput = erpTextInput("provider", "");
  providerInput.value = p.provider || "";
  form.appendChild(erpField("Provider", providerInput));
  var transportSel = document.createElement("select");
  [["manual-file", "Manual file"], ["sftp", "SFTP"], ["api", "API"], ["webhook", "Webhook"]].forEach(function (t) {
    var o = document.createElement("option");
    o.value = t[0];
    o.textContent = t[1];
    if (p.transport === t[0]) o.selected = true;
    transportSel.appendChild(o);
  });
  form.appendChild(erpField("Transport", transportSel));
  var activeInput = document.createElement("input");
  activeInput.type = "checkbox";
  activeInput.checked = !!p.active;
  form.appendChild(erpField("Active", activeInput));
  var configArea = document.createElement("textarea");
  configArea.rows = 4;
  configArea.style.width = "100%";
  try {
    configArea.value = JSON.stringify(p.config || {}, null, 2);
  } catch (e) {
    configArea.value = "";
  }
  form.appendChild(erpField("Config JSON", configArea));
  var rotateInput = document.createElement("input");
  rotateInput.type = "checkbox";
  form.appendChild(erpField("Rotate webhook key", rotateInput));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Save partner";
  form.appendChild(submit);
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = "Partner name is required.";
      return;
    }
    var payload = {
      name: name,
      provider: providerInput.value.trim(),
      transport: transportSel.value,
      active: activeInput.checked
    };
    var cfgRaw = configArea.value.trim();
    if (cfgRaw) {
      try {
        payload.config = JSON.parse(cfgRaw);
      } catch (e) {
        status.textContent = "Config must be valid JSON.";
        return;
      }
    }
    if (rotateInput.checked) payload.rotate_webhook_key = true;
    submit.disabled = true;
    status.textContent = "Saving…";
    erpPut("/api/erp/edi-partners/" + encodeURIComponent(String(p.id)), payload).then(function (res) {
      erpState.showEditPartner = false;
      var key = res.webhook_key || (res.partner && res.partner.webhook_key);
      if (key) erpState.lastWebhookKey = key;
      renderErpEdiPartnerDetail(adminDetailEls().body);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

async function erpDownloadCsv(path, filename) {
  setAdminDetailStatus("Preparing export…");
  try {
    var response = await authFetch(path);
    if (!response.ok) {
      var data = await response.json().catch(function () { return {}; });
      throw new Error(authMessage(data, "Export failed."));
    }
    var blob = await response.blob();
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error.message, true);
  }
}

function erpReportTable(headers, rows) {
  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  var table = document.createElement("table");
  table.className = "admin-orders-table";
  var thead = document.createElement("thead");
  var htr = document.createElement("tr");
  headers.forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    r.forEach(function (c) {
      var td = document.createElement("td");
      td.textContent = (c === null || c === undefined || c === "") ? "—" : String(c);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function erpReportQuery(extra) {
  var q = [];
  if (erpState.reportFilters.from) q.push("from=" + encodeURIComponent(erpState.reportFilters.from));
  if (erpState.reportFilters.to) q.push("to=" + encodeURIComponent(erpState.reportFilters.to));
  if (extra) q.push(extra);
  return q.length ? "?" + q.join("&") : "";
}

      var o = document.createElement("option");

function erpShowQbPushModal(opts) {
  var modal = erpOpenModal(opts.title);
  var status = document.createElement("div");
  status.style.marginBottom = "8px";
  modal.body.appendChild(status);
  status.textContent = "Loading preview…";
  erpGet(opts.previewPath).then(function (pv) {
    status.textContent = "";
    opts.renderPreview(modal.body, pv);
    if (pv.item_configured === false) {
      var warn = document.createElement("p");
      warn.style.color = "#c92e29";
      warn.textContent = "No QuickBooks item is configured. Set it in Settings → QuickBooks first.";
      modal.body.appendChild(warn);
      return;
    }
    var note = document.createElement("p");
    note.style.color = "var(--muted)";
    note.textContent = "QuickBooks invoices and sales receipts go live immediately — there is no draft state. This cannot be undone from here.";
    modal.body.appendChild(note);
    var row = document.createElement("div");
    row.className = "erp-toolbar";
    var confirm = document.createElement("button");
    confirm.type = "button";
    confirm.textContent = opts.confirmLabel;
    confirm.addEventListener("click", function () {
      confirm.disabled = true;
      status.textContent = "Pushing to QuickBooks…";
      erpPost(opts.pushPath, {}).then(function (res) {
        modal.close();
        setAdminDetailStatus("Pushed to QuickBooks.");
        if (opts.onDone) opts.onDone(res);
      }).catch(function (error) {
        confirm.disabled = false;
        status.textContent = error.message;
      });
    });
    row.appendChild(confirm);
    modal.body.appendChild(row);
  }).catch(function (error) {
    status.textContent = error.message;
  });
}

// Frontend gating is display-only; the backend enforces every permission.
// Nothing here publishes, sends, or replies on its own — approve/send/
// publish-now are admin-only and the backend enforces that too.
var MKT_REFUND_POLICY = "Orders are guaranteed to arrive in perfect condition. A dissatisfied customer must contact Customer Service within 30 days of receipt with a detailed description and photo(s). The remedy is reshipment or replacement/exchange with an equal-or-greater-value item within 5 days. Refunds are not offered — replacement or exchange only.";
// Printfix has no erpCan (that helper exists only in the permissions
// build); the marketing section checks the session's stored perms
// directly, with the same admin-grants-all rule.
function mktHas(perm) {
  if (erpIsAdmin()) return true;
  var perms = erpSession().perms || [];
  return perms.indexOf(perm) !== -1;
}
function mktCanIgRead() { return mktHas("instagram.read"); }
function mktCanIgWrite() { return mktHas("instagram.write"); }
function mktCanNewsRead() { return mktHas("newsletter.read"); }
function mktCanNewsWrite() { return mktHas("newsletter.write"); }
function mktCanSupRead() { return mktHas("support.read"); }
function mktCanSupWrite() { return mktHas("support.write"); }
function mktDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleString("en-US", { timeZone: "America/Los_Angeles", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + " PT";
}
function mktBtn(label, onClick, disabled) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  if (disabled) b.disabled = true;
  b.addEventListener("click", onClick);
  return b;
}
function mktNote(text) {
  var p = document.createElement("p");
  p.className = "admin-orders-empty";
  p.textContent = text;
  return p;
}
function mktMetricRow(label, value) {
  var row = document.createElement("div");
  var b = document.createElement("b");
  b.textContent = label + ": ";
  row.appendChild(b);
  row.appendChild(document.createTextNode(value === null || value === undefined || value === "" ? "unavailable" : String(value)));
  return row;
}

async function loadErpMarketingDetail() {
  setAdminDetailStatus("Loading marketing & service…");
  try {
    var results = await Promise.all([
      mktCanIgRead() ? erpGet("/api/erp/marketing/instagram/dashboard").catch(function () { return null; }) : Promise.resolve(null),
      mktCanNewsRead() ? erpGet("/api/erp/marketing/newsletters").catch(function () { return null; }) : Promise.resolve(null),
      mktCanSupRead() ? erpGet("/api/erp/marketing/support/tickets").catch(function () { return null; }) : Promise.resolve(null)
    ]);
    erpState.mktIg = results[0];
    erpState.mktNews = results[1];
    erpState.mktTickets = results[2];
    renderErpMarketingDetail();
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ? "We couldn't connect to load marketing." : error.message, true);
  }
}

function renderErpMarketingDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  els.body.appendChild(erpSectionTitle("Marketing & Service"));
  var sections = [];
  if (mktCanIgRead()) sections.push(["instagram", "Instagram"]);
  if (mktCanNewsRead()) sections.push(["newsletter", "Newsletter"]);
  if (mktCanSupRead()) sections.push(["support", "Support inbox"]);
  if (!erpState.mktView || sections.every(function (s) { return s[0] !== erpState.mktView; })) {
    erpState.mktView = sections.length ? sections[0][0] : "instagram";
  }
  var tabs = document.createElement("div");
  tabs.className = "erp-toolbar";
  sections.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = s[1];
    if (erpState.mktView === s[0]) b.disabled = true;
    b.addEventListener("click", function () { erpState.mktView = s[0]; erpState.mktSelectedTicketId = null; erpState.mktTicketDetail = null; renderErpMarketingDetail(); });
    tabs.appendChild(b);
  });
  els.body.appendChild(tabs);
  if (erpState.mktView === "instagram" && mktCanIgRead()) renderMktInstagram(els.body);
  else if (erpState.mktView === "newsletter" && mktCanNewsRead()) renderMktNewsletter(els.body);
  else if (erpState.mktView === "support" && mktCanSupRead()) renderMktSupport(els.body);
}

    st.style.color = "var(--muted)";
    st.style.flex = "1 1 100%";
    form.appendChild(st);
    var btn = mktBtn("Create ticket", function () {
      btn.disabled = true;
      st.textContent = "Creating…";
      erpPost("/api/erp/marketing/support/tickets", {
        customer_email: emIn.value, customer_name: nmIn.value,
        subject: suIn.value, body: boIn.value,
        order_source: osIn.value || null,
        order_id: oiIn.value ? Number(oiIn.value) : null
      }).then(loadErpMarketingDetail).catch(function (e) { st.textContent = e.message; btn.disabled = false; });
    });
    form.appendChild(btn);
    body.appendChild(form);
  }
}

/* ---------- Staff & permissions (admin only) ---------- */
var ERP_PERM_GROUPS = [
  ["Inventory", [["inventory.read", "View inventory"], ["inventory.adjust", "Adjust stock + counts"], ["inventory.transfer", "Transfer stock"], ["inventory.receive", "Receive goods"]]],
  ["Purchasing", [["purchasing.read", "View vendors + purchase orders"], ["purchasing.write", "Manage vendors + purchase orders"]]],
  ["Production", [["recipes.read", "View recipes"], ["recipes.write", "Create + edit recipes"], ["batches.read", "View batches"], ["batches.write", "Run batches"]]],
  ["Order hub", [["orders.read", "View orders"], ["orders.write", "Update + manage orders"]]],
  ["Wholesale accounts", [["accounts.read", "View wholesale accounts"], ["accounts.write", "Manage wholesale accounts"]]],
  ["EDI", [["edi.read", "View EDI documents"], ["edi.write", "Manage EDI"]]],
  ["Reports", [["reports.read", "View reports"]]],
  ["Accounting", [["accounting.read", "View accounting"], ["accounting.write", "Manage accounting"], ["tax.read", "View sales tax"], ["tax.write", "Manage sales tax"], ["payroll.read", "View payroll"], ["payroll.write", "Manage payroll"]]],
  ["Marketing & Service", [["instagram.read", "View Instagram schedule + insights"], ["instagram.write", "Manage Instagram posts"], ["newsletter.read", "View newsletter issues"], ["newsletter.write", "Manage + send newsletters"], ["support.read", "View support inbox"], ["support.write", "Manage support tickets"]]]
];
async function loadErpStaffPermsDetail() {
  setAdminDetailStatus("Loading staff permissions…");
  try {
    var data = await erpGet("/api/erp/admin/staff-permissions");
    renderErpStaffPermsDetail(data);
    setAdminDetailStatus(data.staff.length + " staff member" + (data.staff.length === 1 ? "." : "s."));
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ?
      "We couldn't connect to load staff permissions." : error.message, true);
  }
}
function renderErpStaffPermsDetail(data) {
  var els = adminDetailEls();
  els.body.replaceChildren();
  var h2 = document.createElement("h2");
  h2.textContent = "Staff & permissions";
  els.body.appendChild(h2);
  var note = document.createElement("p");
  note.className = "admin-orders-empty";
  note.textContent = "Only Matt and DJ can change these. Changes apply immediately; staff see new menus next time they sign in. Staff management, QuickBooks, Settings, and all deletions stay admin-only and are never listed here.";
  els.body.appendChild(note);
  // Add a staff member (starts with no permissions — tick their boxes below).
  var addCard = document.createElement("div");
  addCard.className = "erp-form";
  var addTitle = document.createElement("h3");
  addTitle.textContent = "Add staff member";
  addCard.appendChild(addTitle);
  var addNote = document.createElement("p");
  addNote.className = "admin-orders-empty";
  addNote.textContent = "They get a setup email to verify their account. New staff start with no permissions.";
  addCard.appendChild(addNote);
  var nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Name";
  addCard.appendChild(erpField("Name", nameInput));
  var emailInput = document.createElement("input");
  emailInput.type = "email";
  emailInput.placeholder = "Email";
  addCard.appendChild(erpField("Email", emailInput));
  var passInput = document.createElement("input");
  passInput.type = "password";
  passInput.placeholder = "Temporary password (8+ characters)";
  addCard.appendChild(erpField("Password", passInput));
  var addStatus = document.createElement("p");
  addStatus.style.color = "var(--muted)";
  addStatus.style.flex = "1 1 100%";
  addCard.appendChild(addStatus);
  var addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "Add staff member";
  addBtn.addEventListener("click", function () {
    addBtn.disabled = true;
    addStatus.textContent = "Adding…";
    erpPost("/api/admin/staff", { name: nameInput.value, email: emailInput.value, password: passInput.value }).then(function () {
      loadErpStaffPermsDetail();
    }).catch(function (error) {
      addStatus.textContent = error.message;
      addBtn.disabled = false;
    });
  });
  addCard.appendChild(addBtn);
  els.body.appendChild(addCard);
  (data.staff || []).forEach(function (s) {
    var card = document.createElement("div");
    card.className = "erp-form";
    var h3 = document.createElement("h3");
    h3.textContent = s.name + " (" + s.email + ")" + (s.active ? "" : " — inactive");
    h3.style.flex = "1 1 100%";
    card.appendChild(h3);
    var boxes = {};
    ERP_PERM_GROUPS.forEach(function (g) {
      var gdiv = document.createElement("div");
      gdiv.style.flex = "1 1 100%";
      var gh = document.createElement("h4");
      gh.textContent = g[0];
      gdiv.appendChild(gh);
      g[1].forEach(function (p) {
        var lab = document.createElement("label");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = (s.perms || []).indexOf(p[0]) !== -1;
        boxes[p[0]] = cb;
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(" " + p[1]));
        gdiv.appendChild(lab);
      });
      card.appendChild(gdiv);
    });
    var status = document.createElement("p");
    status.style.color = "var(--muted)";
    status.style.flex = "1 1 100%";
    card.appendChild(status);
    var saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.textContent = "Save permissions";
    saveBtn.addEventListener("click", function () {
      var perms = Object.keys(boxes).filter(function (k) { return boxes[k].checked; });
      saveBtn.disabled = true;
      status.textContent = "Saving…";
      erpPut("/api/erp/admin/staff-permissions/" + encodeURIComponent(String(s.id)), { perms: perms }).then(function () {
        status.textContent = "Saved.";
        saveBtn.disabled = false;
      }).catch(function (error) {
        status.textContent = error.message;
        saveBtn.disabled = false;
      });
    });
    card.appendChild(saveBtn);
    els.body.appendChild(card);
  });
}

async function loadErpSettingsDetail() {
  setAdminDetailStatus("Loading…");
  try {
    var res = await erpGet("/api/erp/quickbooks/status");
    erpState.qbStatus = res;
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error.message, true);
    erpState.qbStatus = null;
  }
  renderErpSettingsDetail();
}

function renderErpSettingsDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  var h2 = document.createElement("h2");
  h2.textContent = "Settings";
  els.body.appendChild(h2);
  var staffLink = document.createElement("p");
  var staffA = document.createElement("a");
  staffA.href = "#/staff-perms";
  staffA.textContent = "Staff & permissions \u2014 choose what each staff member can use";
  staffLink.appendChild(staffA);
  els.body.appendChild(staffLink);
  var st = erpState.qbStatus;
  var card = document.createElement("div");
  card.className = "admin-orders-wrap";
  var h3 = document.createElement("h3");
  h3.textContent = "QuickBooks";
  card.appendChild(h3);
  var p = document.createElement("p");
  if (!st) {
    p.textContent = "Could not load QuickBooks status.";
  } else if (!st.configured) {
    p.textContent = "Not configured. Set QB_CLIENT_ID and QB_CLIENT_SECRET on the backend, then connect.";
    p.style.color = "#c92e29";
  } else if (st.connected) {
    p.textContent = "Connected" + (st.company_name ? " to " + st.company_name : "") + ".";
  } else {
    p.textContent = "Not connected.";
  }
  card.appendChild(p);
  if (typeof location !== "undefined" && location.hash.indexOf("qb=connected") >= 0) {
    var ok = document.createElement("p");
    ok.style.color = "#1a8d83";
    ok.textContent = "QuickBooks connected successfully.";
    card.appendChild(ok);
  }
  if (st && st.configured) {
    var row = document.createElement("div");
    row.className = "erp-toolbar";
    if (st.connected) {
      var dis = document.createElement("button");
      dis.type = "button";
      dis.textContent = "Disconnect";
      dis.addEventListener("click", function () {
        if (!window.confirm("Disconnect QuickBooks? Pushed invoices stay in QuickBooks.")) return;
        erpPost("/api/erp/quickbooks/disconnect", {}).then(function () {
          loadErpSettingsDetail();
        }).catch(function (error) { setAdminDetailStatus(error.message, true); });
      });
      row.appendChild(dis);
    } else {
      var conn = document.createElement("button");
      conn.type = "button";
      conn.textContent = "Connect QuickBooks";
      conn.addEventListener("click", function () {
        conn.disabled = true;
        erpGet("/api/erp/quickbooks/connect").then(function (res) {
          window.location = res.authorize_url;
        }).catch(function (error) {
          conn.disabled = false;
          setAdminDetailStatus(error.message, true);
        });
      });
      row.appendChild(conn);
    }
    card.appendChild(row);
    // item mapping config
    var h4 = document.createElement("h4");
    h4.textContent = "Item mapping";
    card.appendChild(h4);
    var note = document.createElement("p");
    note.style.color = "var(--muted)";
    note.textContent = "The QuickBooks item used on invoice and sales-receipt lines. Find the item ID in QuickBooks (Items list).";
    card.appendChild(note);
    var form = document.createElement("div");
    form.className = "erp-form erp-form-inline";
    var itemInput = erpTextInput("wholesale_item_id", "Wholesale item ID");
    itemInput.style.width = "120px";
    var nameInput = erpTextInput("wholesale_item_name", "Item name (label)");
    nameInput.style.width = "200px";
    var salesInput = erpTextInput("sales_item_id", "Sales summary item ID (optional)");
    salesInput.style.width = "200px";
    form.appendChild(erpField("Wholesale item ID", itemInput));
    form.appendChild(erpField("Item name", nameInput));
    form.appendChild(erpField("Summary item ID", salesInput));
    var save = document.createElement("button");
    save.type = "button";
    save.textContent = "Save mapping";
    save.addEventListener("click", function () {
      save.disabled = true;
      erpPost("/api/erp/quickbooks/config", {
        wholesale_item_id: itemInput.value.trim(),
        wholesale_item_name: nameInput.value.trim(),
        sales_item_id: salesInput.value.trim()
      }).then(function (res) {
        save.disabled = false;
        setAdminDetailStatus("Mapping saved.");
        itemInput.value = res.config.wholesale_item_id || "";
        nameInput.value = res.config.wholesale_item_name || "";
        salesInput.value = res.config.sales_item_id || "";
      }).catch(function (error) {
        save.disabled = false;
        setAdminDetailStatus(error.message, true);
      });
    });
    form.appendChild(save);
    card.appendChild(form);
    erpGet("/api/erp/quickbooks/config").then(function (res) {
      itemInput.value = res.config.wholesale_item_id || "";
      nameInput.value = res.config.wholesale_item_name || "";
      salesInput.value = res.config.sales_item_id || "";
    }).catch(function () {});
  }
  els.body.appendChild(card);
  var danger = document.createElement("div");
  danger.className = "admin-orders-wrap";
  danger.style.border = "2px solid #c92e29";
  var dh = document.createElement("h3");
  dh.textContent = "Danger zone";
  dh.style.color = "#c92e29";
  danger.appendChild(dh);
  var dp = document.createElement("p");
  dp.textContent = "Permanently delete ALL ERP data — locations, items, stock, lots, vendors, purchase orders, counts, recipes, batches, wholesale accounts, orders, fulfillment, EDI and QuickBooks links — and start over empty. This cannot be undone. Your admin/staff logins are NOT affected.";
  danger.appendChild(dp);
  var wipeBtn = document.createElement("button");
  wipeBtn.type = "button";
  wipeBtn.textContent = "Delete all ERP data";
  wipeBtn.style.background = "#c92e29";
  wipeBtn.style.color = "#fff";
  var wipeArmed = false;
  var wipeReset = null;
  wipeBtn.addEventListener("click", function () {
    if (!wipeArmed) {
      wipeArmed = true;
      wipeBtn.textContent = "Tap again to confirm — this erases everything";
      wipeReset = setTimeout(function () {
        wipeArmed = false;
        wipeBtn.textContent = "Delete all ERP data";
      }, 6000);
      return;
    }
    if (wipeReset) clearTimeout(wipeReset);
    wipeBtn.disabled = true;
    erpPost("/api/erp/reset", { confirm: "RESET ALL ERP DATA" }).then(function (res) {
      var total = 0;
      Object.keys(res.deleted || {}).forEach(function (k) { total += res.deleted[k] || 0; });
      setAdminDetailStatus("ERP wiped clean: " + total + " rows deleted across "
        + Object.keys(res.deleted || {}).length + " tables.");
      loadErpSettingsDetail();
    }).catch(function (error) {
      wipeBtn.disabled = false;
      wipeArmed = false;
      wipeBtn.textContent = "Delete all ERP data";
      setAdminDetailStatus(error.message, true);
    });
  });
  danger.appendChild(wipeBtn);
  els.body.appendChild(danger);
}

/* ---------- boot (MUST stay last) ---------- */
// This line used to sit mid-script, before the ERP state (erpState) was
// assigned. On a refresh while signed in it ran enterApp() -> renderRoute()
// -> the Inventory/Production branch touched erpState while it was still
// undefined, throwing and aborting the rest of the script: blank page, dead
// tabs, with only Dashboard (which never touches erpState) still working.
// Running it here, after every section has initialized, makes a refresh
// behave exactly like a fresh sign-in, where the whole script already ran.
async function erpRestoreSession() {
  // Phase 2 single sign-in: no token in storage -> the shared pal_session
  // cookie may already carry this admin's login from the storefront.
  try {
    var resp = await fetch(API_BASE + "/api/erp/session", { credentials: "include" });
    if (!resp.ok) return false;
    var data = await resp.json().catch(function () { return {}; });
    if (!data || data.role !== "admin") return false;
    var me = await fetch(API_BASE + "/api/auth/me", { credentials: "include" });
    if (!me.ok) return false;
    var meData = await me.json().catch(function () { return {}; });
    if (!meData.is_admin) return false;
    saveSession("", meData.name || meData.email || "", meData.email || "", "admin");
    enterApp();
    return true;
  } catch (e) { return false; }
}
if (wholesaleSetupToken()) { showWholesaleSetup(); }
else if (isLoggedIn()) { enterApp(); }
else { erpRestoreSession().then(function (restored) { if (!restored) showLogin(); }); }
</script>
