/* ---------- new batch form ---------- */
function erpNewBatchForm() {
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";

  var recipeSel = document.createElement("select");
  recipeSel.name = "recipe_id";
  recipeSel.required = true;
  erpState.recipes.forEach(function (r) {
    var o = document.createElement("option");
    o.value = r.id;
    o.textContent = r.name + " (" + erpQty(r.batch_size_bags) + " bags/batch)";
    recipeSel.appendChild(o);
  });
  form.appendChild(erpField("Recipe", recipeSel));

  var qtyInput = erpTextInput("planned_qty_bags", "e.g. 50", true);
  qtyInput.type = "number";
  qtyInput.min = "0.01";
  qtyInput.step = "any";
  form.appendChild(erpField("Planned bags", qtyInput));

  var locSel = document.createElement("select");
  locSel.name = "location_id";
  erpLocationOptions(erpDefaultLocationId()).forEach(function (o) { locSel.appendChild(o); });
  form.appendChild(erpField("Location", locSel));

  form.appendChild(erpField("Order ref (optional)", erpTextInput("order_ref", "#1042 or wholesale name")));
  form.appendChild(erpField("Notes (optional)", erpTextInput("notes", "")));

  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Create batch";
  form.appendChild(submit);
  form.appendChild(status);

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var planned = Number(qtyInput.value);
    if (!isFinite(planned) || planned <= 0) {
      status.textContent = "Planned bags must be greater than zero.";
      return;
    }
    submit.disabled = true;
    status.textContent = "Creating batch…";
    erpPost("/api/erp/batches", {
      recipe_id: Number(recipeSel.value),
      planned_qty_bags: planned,
      location_id: Number(locSel.value),
      order_ref: form.order_ref.value.trim(),
      notes: form.notes.value.trim()
    }).then(function (res) {
      erpState.showNewBatch = false;
      erpState.newBatchResult = res.batch;
      erpState.lastShortfalls = res.batch.shortfalls || null;
      return loadErpProductionDetail();
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

/* ---------- batch detail ---------- */
function renderErpBatchDetail(body) {
  setAdminDetailStatus("Loading batch…");
  erpGet("/api/erp/batches/" + encodeURIComponent(String(erpState.selectedBatchId))).then(function (res) {
    var b = res.batch;
    body.replaceChildren();
    body.appendChild(erpBackButton("← All production", function () {
      erpState.selectedBatchId = null;
      erpState.newBatchResult = null;
      erpState.lastShortfalls = null;
      renderErpProductionDetail();
    }));
    var h2 = document.createElement("h2");
    h2.textContent = "Batch " + b.batch_number + " — " + b.recipe_name;
    body.appendChild(h2);
    var meta = document.createElement("div");
    meta.className = "erp-detail-meta";
    var chip = erpStatusChip(erpBatchStatusLabel(b.status));
    meta.appendChild(chip);
    var lines = [
      "Recipe v" + b.recipe_version,
      "Planned: " + erpQty(b.planned_qty_bags) + " bags",
      "Actual: " + (b.actual_qty_bags ? erpQty(b.actual_qty_bags) + " bags" : "—"),
      "Waste: " + erpQty(b.waste_qty_bags) + " bags",
      "Location: " + (b.location_code || "—"),
      "Order ref: " + (b.order_ref || "—"),
      "Lot code: " + (b.lot_code || "—"),
      "Expires: " + (b.expiry_date || "—"),
      "Cost: " + (b.total_cost_cents ? erpMoney(b.total_cost_cents) + " total (" +
        erpMoney(b.cost_per_bag_cents) + "/bag)" : "—")
    ];
    lines.forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      meta.appendChild(s);
    });
    body.appendChild(meta);

    // actions by status (admin only)
    if (erpIsAdmin()) {
      var actions = document.createElement("div");
      actions.className = "erp-toolbar";
      if (b.status === "planned") {
        var startBtn = document.createElement("button");
        startBtn.type = "button";
        startBtn.textContent = "Start batch";
        startBtn.addEventListener("click", function () {
          erpBatchAction(b.id, "start", null, "Starting…");
        });
        actions.appendChild(startBtn);
      }
      if (b.status === "in_progress") {
        actions.appendChild(erpCompleteBatchForm(b));
      }
      if (b.status === "planned" || b.status === "in_progress") {
        var cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.textContent = "Cancel batch";
        cancelBtn.addEventListener("click", function () {
          if (window.confirm("Cancel batch " + b.batch_number + "? This cannot be undone.")) {
            erpBatchAction(b.id, "cancel", null, "Cancelling…");
          }
        });
        actions.appendChild(cancelBtn);
      }
      if (b.status === "completed") {
        var revBtn = document.createElement("button");
        revBtn.type = "button";
        revBtn.textContent = "Reverse batch";
        revBtn.addEventListener("click", function () {
          if (window.confirm("Reverse batch " + b.batch_number + "? Stock will be put back.")) {
            erpBatchAction(b.id, "reverse", null, "Reversing…");
          }
        });
        actions.appendChild(revBtn);
      }
      if (actions.children.length) body.appendChild(actions);
    }

    // recipe lines scaled to this batch
    var lh = document.createElement("h3");
    lh.textContent = "Ingredients (recipe v" + b.recipe_version + ")";
    body.appendChild(lh);
    if (b.recipe_lines && b.recipe_lines.length) {
      var wrap = document.createElement("div");
      wrap.className = "admin-orders-wrap";
      var table = document.createElement("table");
      table.className = "admin-orders-table";
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      ["SKU", "Item", "Per batch", "For this batch", "On hand"].forEach(function (c) {
        var th = document.createElement("th");
        th.textContent = c;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = document.createElement("tbody");
      b.recipe_lines.forEach(function (l) {
        var tr = document.createElement("tr");
        tr.appendChild(erpCell("SKU", l.sku));
        tr.appendChild(erpCell("Item", l.item_name));
        tr.appendChild(erpCell("Per batch", erpQtyFrac(l.qty_per_batch) + " " + (l.unit || "")));
        tr.appendChild(erpCell("For this batch", erpQty(l.qty_for_batch) + " " + (l.unit || "")));
        tr.appendChild(erpCell("On hand", erpQty(l.on_hand) + " " + (l.unit || "")));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      body.appendChild(wrap);
    }

    // ingredients actually used (completed batches) with lot trace
    if (b.ingredients_used && b.ingredients_used.length) {
      var uh = document.createElement("h3");
      uh.textContent = "Ingredients used (lot trace)";
      body.appendChild(uh);
      var uwrap = document.createElement("div");
      uwrap.className = "admin-orders-wrap";
      var utable = document.createElement("table");
      utable.className = "admin-orders-table";
      var uthead = document.createElement("thead");
      var uhr = document.createElement("tr");
      ["SKU", "Item", "Lot", "Qty used", "Unit cost"].forEach(function (c) {
        var th = document.createElement("th");
        th.textContent = c;
        uhr.appendChild(th);
      });
      uthead.appendChild(uhr);
      utable.appendChild(uthead);
      var utbody = document.createElement("tbody");
      b.ingredients_used.forEach(function (u) {
        var tr = document.createElement("tr");
        tr.appendChild(erpCell("SKU", u.sku));
        tr.appendChild(erpCell("Item", u.item_name));
        tr.appendChild(erpCell("Lot", u.lot_code || "—"));
        tr.appendChild(erpCell("Qty used", erpQty(u.qty_used) + " " + (u.unit || "")));
        tr.appendChild(erpCell("Unit cost", erpMoney(u.unit_cost_cents)));
        utbody.appendChild(tr);
      });
      utable.appendChild(utbody);
      uwrap.appendChild(utable);
      body.appendChild(uwrap);
    }
    // Phase 3: linked orders for this batch
    erpRenderBatchLinkedOrders(body, b);
    setAdminDetailStatus("Batch " + b.batch_number + " — " + erpBatchStatusLabel(b.status) + ".");
  }).catch(function (error) {
    setAdminDetailStatus(error.message, true);
  });
}

function erpBatchAction(batchId, action, payload, workingText) {
  setAdminDetailStatus(workingText || "Working…");
  erpPost("/api/erp/batches/" + encodeURIComponent(String(batchId)) + "/" + action, payload || {})
    .then(function () { return erpGet("/api/erp/batches/" + encodeURIComponent(String(batchId))); })
    .then(function () { return loadErpProductionDetail(); })
    .then(function () { renderErpBatchDetail(adminDetailEls().body); })
    .catch(function (error) { setAdminDetailStatus(error.message, true); });
}

function erpCompleteBatchForm(b) {
  var form = document.createElement("form");
  form.className = "erp-form erp-form-inline";
  var actualInput = erpTextInput("actual_qty_bags", "Bags produced", true);
  actualInput.type = "number";
  actualInput.min = "0.01";
  actualInput.step = "any";
  actualInput.value = b.planned_qty_bags;
  var wasteInput = erpTextInput("waste_qty_bags", "Waste");
  wasteInput.type = "number";
  wasteInput.min = "0";
  wasteInput.step = "any";
  wasteInput.value = "0";
  form.appendChild(erpField("Bags produced", actualInput));
  form.appendChild(erpField("Waste bags", wasteInput));
  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = "Complete batch";
  form.appendChild(submit);
  var status = document.createElement("p");
  status.className = "erp-form-status";
  form.appendChild(status);
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var actual = Number(actualInput.value);
    if (!isFinite(actual) || actual <= 0) {
      status.textContent = "Bags produced must be greater than zero.";
      return;
    }
    submit.disabled = true;
    status.textContent = "Completing…";
    erpPost("/api/erp/batches/" + encodeURIComponent(String(b.id)) + "/complete", {
      actual_qty_bags: actual,
      waste_qty_bags: Number(wasteInput.value) || 0
    }).then(function () {
      return loadErpProductionDetail();
    }).then(function () {
      renderErpBatchDetail(adminDetailEls().body);
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

/* ---------- recipe detail + versioning ---------- */
function erpLabelSettingsBox(r, res) {
  var box = document.createElement("div");
  box.className = "admin-orders-wrap";
  var h = document.createElement("h3");
  h.textContent = "Label settings";
  box.appendChild(h);
  var note = document.createElement("p");
  note.style.color = "var(--muted)";
  note.textContent = "The name prints on the 4\u00d76 label and decides the barcode and QR code. " +
    "Serving size, serving weight, and servings per bag print on the Nutrition Facts panel and set the Net Wt. " +
    "Leave a serving field blank to use the automatic value.";
  box.appendChild(note);
  var form = document.createElement("div");
  form.className = "erp-form";
  /* In the permissions build erpCan gates this on recipes.write; in the
     pre-permissions live file erpCan does not exist and everyone with
     recipe access can save, as with every other recipe control there. */
  var canWrite = (typeof erpCan !== "function") || erpCan("recipes.write");
  var nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.value = r.name || "";
  nameInput.disabled = !canWrite;
  form.appendChild(erpField("Recipe name", nameInput));
  var sizeInput = document.createElement("input");
  sizeInput.type = "text";
  sizeInput.placeholder = "1 cup";
  sizeInput.value = r.serving_size || "";
  sizeInput.disabled = !canWrite;
  form.appendChild(erpField("Serving size", sizeInput));
  var gramsInput = document.createElement("input");
  gramsInput.type = "number";
  gramsInput.min = "0";
  gramsInput.step = "any";
  gramsInput.placeholder = "17";
  gramsInput.value = (r.serving_grams !== null && r.serving_grams !== undefined) ? r.serving_grams : "";
  gramsInput.disabled = !canWrite;
  form.appendChild(erpField("Serving weight (g)", gramsInput));
  var perInput = document.createElement("input");
  perInput.type = "number";
  perInput.min = "1";
  perInput.step = "1";
  perInput.placeholder = "Auto";
  perInput.value = (r.servings_per_bag !== null && r.servings_per_bag !== undefined) ? r.servings_per_bag : "";
  perInput.disabled = !canWrite;
  form.appendChild(erpField("Servings per bag", perInput));
  box.appendChild(form);
  var status = document.createElement("p");
  status.className = "erp-form-status";
  box.appendChild(status);
  if (canWrite) {
    var saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.textContent = "Save label settings";
    saveBtn.addEventListener("click", function () {
      saveBtn.disabled = true;
      status.textContent = "Saving\u2026";
      erpPut("/api/erp/recipes/" + encodeURIComponent(String(r.id)) + "/label-settings", {
        name: nameInput.value.trim(),
        serving_size: sizeInput.value.trim(),
        serving_grams: gramsInput.value.trim(),
        servings_per_bag: perInput.value.trim()
      }).then(function () {
        status.textContent = "Saved.";
        renderErpProductionDetail();
      }).catch(function (error) {
        status.textContent = error.message;
        saveBtn.disabled = false;
      });
    });
    box.appendChild(saveBtn);
  } else {
    var ro = document.createElement("p");
    ro.style.color = "var(--muted)";
    ro.textContent = "Only admins and staff with recipe permission can change these.";
    box.appendChild(ro);
  }
  return box;
}

function erpBarcodePictureBox(r, res) {
  var box = document.createElement("div");
  box.className = "admin-orders-wrap";
  var h = document.createElement("h3");
  h.textContent = "Barcode picture";
  box.appendChild(h);
  var pic = (res.recipe && res.recipe.barcode_image) || r.barcode_image || "";
  var note = document.createElement("p");
  note.style.color = "var(--muted)";
  if (pic) {
    var img = document.createElement("img");
    img.src = pic;
    img.alt = "Barcode picture";
    img.style.maxWidth = "260px";
    img.style.display = "block";
    img.style.marginBottom = "8px";
    box.appendChild(img);
    note.textContent = "This picture prints in the barcode spot on the 4×6 label, in place of the generated barcode.";
  } else {
    var code = erpMatchFlavorCode(r.name);
    note.textContent = code ?
      "No picture added — the label prints the " + code.name + " barcode automatically. Add a picture here to use it instead." :
      "No barcode picture yet — add one here and it will print in the barcode spot on the 4×6 label.";
  }
  box.appendChild(note);
  if (erpIsAdmin()) {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "image/png,image/jpeg,image/gif,image/webp";
    input.style.display = "block";
    input.style.marginBottom = "8px";
    box.appendChild(input);
    var status = document.createElement("p");
    status.style.color = "var(--muted)";
    box.appendChild(status);
    var upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.textContent = pic ? "Replace barcode picture" : "Upload barcode picture";
    upBtn.addEventListener("click", function () {
      var file = input.files && input.files[0];
      if (!file) { status.textContent = "Choose a picture first."; return; }
      if (file.size > 500 * 1024) { status.textContent = "That picture is over 500KB — pick a smaller one."; return; }
      upBtn.disabled = true;
      status.textContent = "Uploading…";
      var reader = new FileReader();
      reader.onload = function () {
        erpPost("/api/erp/recipes/" + encodeURIComponent(String(r.id)) + "/barcode-image",
          { image: reader.result }).then(function () {
          renderErpProductionDetail();
        }).catch(function (error) {
          status.textContent = error.message;
          upBtn.disabled = false;
        });
      };
      reader.onerror = function () {
        status.textContent = "Could not read that file.";
        upBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });
    box.appendChild(upBtn);
    if (pic) {
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "Remove picture";
      delBtn.style.marginLeft = "8px";
      var delArmed = false;
      var delTimer = null;
      delBtn.addEventListener("click", function () {
        if (!delArmed) {
          delArmed = true;
          delBtn.textContent = "Tap again to remove";
          delBtn.classList.add("erp-danger-armed");
          delTimer = setTimeout(function () {
            delArmed = false;
            delBtn.textContent = "Remove picture";
            delBtn.classList.remove("erp-danger-armed");
          }, 4000);
          return;
        }
        clearTimeout(delTimer);
        delBtn.disabled = true;
        erpDelete("/api/erp/recipes/" + encodeURIComponent(String(r.id)) + "/barcode-image").then(function () {
          renderErpProductionDetail();
        }).catch(function (error) {
          status.textContent = error.message;
          delBtn.disabled = false;
          delArmed = false;
          delBtn.textContent = "Remove picture";
          delBtn.classList.remove("erp-danger-armed");
        });
      });
      box.appendChild(delBtn);
    }
  }
  return box;
}

function renderErpRecipeDetail(body) {
  var version = erpState.selectedRecipeVersion;
  var path = "/api/erp/recipes/" + encodeURIComponent(String(erpState.selectedRecipeId)) +
    (version ? "?version=" + encodeURIComponent(String(version)) : "");
  setAdminDetailStatus("Loading recipe…");
  erpGet(path).then(function (res) {
    var r = res.recipe;
    body.replaceChildren();
    body.appendChild(erpBackButton("← All production", function () {
      erpState.selectedRecipeId = null;
      erpState.selectedRecipeVersion = null;
      erpState.showNewRecipeVersion = false;
      renderErpProductionDetail();
    }));
    var h2 = document.createElement("h2");
    h2.textContent = r.name + " — v" + res.version;
    body.appendChild(h2);
    var meta = document.createElement("div");
    meta.className = "erp-detail-meta";
    ["Batch size: " + erpQty(r.batch_size_bags) + " bags",
     "Versions: " + (res.versions || []).join(", ")].forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      meta.appendChild(s);
    });
    if ((res.versions || []).length > 1) {
      var vlabel = document.createElement("label");
      vlabel.textContent = "View version ";
      var vsel = document.createElement("select");
      res.versions.forEach(function (v) {
        var o = document.createElement("option");
        o.value = v;
        o.textContent = "v" + v;
        if (String(v) === String(res.version)) o.selected = true;
        vsel.appendChild(o);
      });
      vsel.addEventListener("change", function () {
        erpState.selectedRecipeVersion = vsel.value;
        erpState.showNewRecipeVersion = false;
        renderErpRecipeDetail(body);
      });
      vlabel.appendChild(vsel);
      meta.appendChild(vlabel);
    }
    body.appendChild(meta);

    if (erpIsAdmin()) {
      var toolbar = document.createElement("div");
      toolbar.className = "erp-toolbar";
      var nvBtn = document.createElement("button");
      nvBtn.type = "button";
      nvBtn.textContent = erpState.showNewRecipeVersion ? "Cancel edit" : "Edit recipe";
      nvBtn.addEventListener("click", function () {
        erpState.showNewRecipeVersion = !erpState.showNewRecipeVersion;
        renderErpRecipeDetail(body);
      });
      toolbar.appendChild(nvBtn);
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "Delete recipe";
      delBtn.style.marginLeft = "8px";
      var delArmed = false, delTimer = null;
      delBtn.addEventListener("click", function () {
        if (!delArmed) {
          delArmed = true;
          delBtn.textContent = "Tap again to confirm delete";
          delBtn.classList.add("erp-danger-armed");
          delTimer = setTimeout(function () {
            delArmed = false;
            delBtn.textContent = "Delete recipe";
            delBtn.classList.remove("erp-danger-armed");
          }, 3000);
          return;
        }
        clearTimeout(delTimer);
        delBtn.disabled = true;
        erpDelete("/api/erp/recipes/" + encodeURIComponent(String(r.id))).then(function () {
          erpState.selectedRecipeId = null;
          erpState.selectedRecipeVersion = null;
          erpState.showNewRecipeVersion = false;
          renderErpProductionDetail();
        }).catch(function (error) {
          setAdminDetailStatus(error.message, true);
          delBtn.disabled = false;
          delArmed = false;
          delBtn.textContent = "Delete recipe";
          delBtn.classList.remove("erp-danger-armed");
        });
      });
      toolbar.appendChild(delBtn);
      body.appendChild(toolbar);
      if (erpState.showNewRecipeVersion) {
        body.appendChild(erpNewRecipeForm(r));
      }
    }

    var wrap = document.createElement("div");
    wrap.className = "admin-orders-wrap";
    var table = document.createElement("table");
    table.className = "admin-orders-table";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["SKU", "Item", "Qty per batch", "Unit", "Line cost"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    (res.lines || []).forEach(function (l) {
      var tr = document.createElement("tr");
      tr.appendChild(erpCell("SKU", l.sku));
      tr.appendChild(erpCell("Item", l.item_name));
      tr.appendChild(erpCell("Qty per batch", erpQtyFrac(l.qty_per_batch)));
      tr.appendChild(erpCell("Unit", l.unit));
      tr.appendChild(erpCell("Line cost",
        l.line_cost_cents === null || l.line_cost_cents === undefined
          ? "—" : erpMoney(l.line_cost_cents)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    body.appendChild(wrap);

    var costBox = document.createElement("p");
    costBox.style.marginTop = "10px";
    var costText = "Batch cost: " + erpMoney(res.batch_cost_cents || 0) +
      " · Cost per bag: " + erpMoney(res.cost_per_bag_cents || 0);
    if (res.cost_unknown_lines > 0) {
      costText += " (" + res.cost_unknown_lines + " line" +
        (res.cost_unknown_lines === 1 ? "" : "s") +
        " not costed — the recipe unit doesn't match how the item is stocked)";
    }
    costBox.textContent = costText;
    body.appendChild(costBox);
    var costNote = document.createElement("p");
    costNote.style.color = "var(--muted)";
    costNote.textContent = "Costed the Budget Bytes way: for each ingredient, " +
      "(package price ÷ package size) × the amount used — set the package price and " +
      "size on the item in Inventory. Items without package pricing use their per-unit " +
      "or average purchase cost. Cup and spoon amounts are weighed automatically using " +
      "standard kitchen cup weights (or the item's own '1 cup weighs' if you set one). " +
      "Ingredients only — no labor.";
    body.appendChild(costNote);
    // Packaging cost: per finished bag for bags + labels, from the same
    // line costs as the batch total. Cost-only — this section never
    // fetches or renders the nutrition panel.
    body.appendChild(erpSectionTitle("Packaging cost"));
    var pkgWrap = document.createElement("div");
    pkgWrap.className = "admin-orders-wrap";
    var pkgBatchTotal = 0;
    var pkgAny = false;
    var pkgUncosted = [];
    [["bag", "Bag"], ["front_label", "Front label"],
     ["back_label", "Back label"]].forEach(function (pt) {
      var plines = (res.lines || []).filter(function (l) { return l.item_type === pt[0]; });
      if (!plines.length) return;
      pkgAny = true;
      var pieceBatch = 0;
      var ok = true;
      plines.forEach(function (l) {
        if (l.line_cost_cents === null || l.line_cost_cents === undefined) { ok = false; }
        else { pieceBatch += l.line_cost_cents; }
      });
      var pp = document.createElement("p");
      if (ok && r.batch_size_bags > 0) {
        pkgBatchTotal += pieceBatch;
        pp.textContent = pt[1] + ": " +
          erpMoney(Math.round(pieceBatch / r.batch_size_bags)) + " per finished bag";
      } else {
        pkgUncosted.push(pt[1]);
        pp.textContent = pt[1] + ": — (set package price and size on the item)";
      }
      pkgWrap.appendChild(pp);
    });
    if (!pkgAny) {
      var pkgNone = document.createElement("p");
      pkgNone.textContent = "No packaging lines in this recipe — add bag, front label, or back label lines to cost packaging.";
      pkgWrap.appendChild(pkgNone);
    } else {
      var pkgTot = document.createElement("p");
      pkgTot.textContent = "Packaging per finished bag: " +
        (pkgUncosted.length || !(r.batch_size_bags > 0) ? "—" :
          erpMoney(Math.round(pkgBatchTotal / r.batch_size_bags))) +
        (pkgUncosted.length ? " (partial — " + pkgUncosted.join(", ") + " not costed)" : "");
      pkgWrap.appendChild(pkgTot);
    }
    body.appendChild(pkgWrap);
    // Nutrition label: computed from the same per-batch amounts that drive
    // cost (Qty per batch + unit on each line), rendered as the standard
    // FDA Nutrition Facts panel and printable from the system.
    body.appendChild(erpSectionTitle("Nutrition label"));
    var nutBox = document.createElement("div");
    nutBox.className = "admin-orders-wrap";
    var nutBtn = document.createElement("button");
    nutBtn.type = "button";
    nutBtn.textContent = "Show nutrition label";
    nutBox.appendChild(nutBtn);
    var nutStatus = document.createElement("p");
    nutStatus.className = "erp-form-status";
    nutBox.appendChild(nutStatus);
    var nutView = document.createElement("div");
    nutBox.appendChild(nutView);
    nutBtn.addEventListener("click", function () {
      nutBtn.disabled = true;
      nutStatus.textContent = "Calculating…";
      erpGet("/api/erp/recipes/" + encodeURIComponent(String(r.id)) + "/nutrition").then(function (nut) {
        nutBtn.disabled = false;
        nutStatus.textContent = "";
        nutView.replaceChildren();
        if (!nut.batch_size_bags || nut.batch_size_bags <= 0) {
          nutStatus.textContent = "Set bags per batch on the recipe first.";
          return;
        }
        if ((nut.missing || []).length) {
          var warn = document.createElement("p");
          warn.style.color = "#c92e29";
          warn.textContent = "Not counted in the label (add nutrition facts to these items first): " +
            nut.missing.map(function (m) { return m.item + " — " + m.reason; }).join("; ");
          nutView.appendChild(warn);
        }
        var servForm = document.createElement("div");
        servForm.className = "erp-form erp-form-inline";
        var sizeInput = document.createElement("input");
        sizeInput.type = "text";
        sizeInput.value = r.serving_size || "1 cup";
        sizeInput.style.width = "90px";
        servForm.appendChild(erpField("Serving size", sizeInput));
        var gramsInput = document.createElement("input");
        gramsInput.type = "number";
        gramsInput.min = "0";
        gramsInput.step = "any";
        gramsInput.value = (r.serving_grams !== null && r.serving_grams !== undefined) ? r.serving_grams : "17";
        gramsInput.style.width = "80px";
        servForm.appendChild(erpField("Serving weight (g)", gramsInput));
        var perInput = document.createElement("input");
        perInput.type = "number";
        perInput.min = "1";
        perInput.step = "1";
        perInput.style.width = "80px";
        var bagGrams = nut.batch_grams > 0 ? nut.batch_grams / nut.batch_size_bags : 0;
        perInput.value = (r.servings_per_bag !== null && r.servings_per_bag !== undefined) ? r.servings_per_bag :
          (bagGrams > 0 ? Math.max(1, Math.round(bagGrams / (Number(gramsInput.value) || 17))) : "1");
        servForm.appendChild(erpField("Servings per bag", perInput));
        var panelWrap = document.createElement("div");
        nutView.appendChild(servForm);
        function perServing(key) {
          var per = Number(perInput.value) || 1;
          var bag = nut.per_bag[key];
          return (bag === null || bag === undefined) ? null : bag / per;
        }
        function fmtNum(v) {
          if (v === null || v === undefined) return "—";
          if (v === 0) return "0";
          var x = Math.round(v * 10) / 10;
          return String(x);
        }
        function renderFda() {
          panelWrap.innerHTML = erpFdaPanelHTML({
            servings: Number(perInput.value) || 1,
            servingSize: sizeInput.value.trim() || "1 cup",
            servingGrams: Number(gramsInput.value) || 17,
            value: perServing,
            fmt: fmtNum
          });
        }
        [sizeInput, gramsInput, perInput].forEach(function (inp) {
          inp.addEventListener("input", renderFda);
        });
        renderFda();
        nutView.appendChild(panelWrap);
        var printBtn = document.createElement("button");
        printBtn.type = "button";
        printBtn.textContent = "Print label";
        printBtn.style.marginTop = "10px";
        printBtn.addEventListener("click", function () {
          erpShowPrintLabel(r, nut, {
            sizeText: sizeInput.value.trim() || "1 cup",
            grams: Number(gramsInput.value) || 17,
            perContainer: Number(perInput.value) || 1,
            bagGrams: bagGrams,
            perServing: perServing,
            fmtNum: fmtNum
          });
        });
        nutView.appendChild(printBtn);
        var qrNote = document.createElement("p");
        qrNote.style.color = "var(--muted)";
        var flavorCode = erpMatchFlavorCode(r.name);
        var hasPic = !!(r.barcode_image);
        qrNote.textContent = hasPic ?
          "Prints at 4×6 with your uploaded barcode picture" +
          (flavorCode ? " and the " + flavorCode.name + " QR code." : ".") :
          flavorCode ?
          "Prints at 4×6 with the " + flavorCode.name + " barcode (" +
          flavorCode.upc + ") and QR code, carried over automatically." :
          "Standard FDA Nutrition Facts panel. Ingredients, manufacturer block, and net weight appear on the printed label below the panel. The QR code and barcode are added once this product is assigned a GTIN.";
        nutView.appendChild(qrNote);
      }).catch(function (error) {
        nutBtn.disabled = false;
        nutStatus.textContent = error.message;
      });
    });
    body.appendChild(erpLabelSettingsBox(r, res));
    body.appendChild(erpBarcodePictureBox(r, res));
    body.appendChild(nutBox);
    setAdminDetailStatus(r.name + " v" + res.version + " — " + (res.lines || []).length + " lines.");
  }).catch(function (error) {
    setAdminDetailStatus(error.message, true);
  });
}

/* ---------- standard FDA Nutrition Facts panel (shared) ---------- */
/* Renders the official FDA Nutrition Facts panel as an HTML string:
   black-bordered box, large "Nutrition Facts" header, servings per
   container, serving size, Amount per serving, big Calories, the
   % Daily Value column, mandatory nutrients in FDA order, and the DV
   footnote. Protein, trans fat, and total sugars show no %DV, per the
   FDA format. Used by the item detail view, the recipe detail view,
   and the print window, so all three show the same panel.
   opt: {servings (number|null), servingSize (string),
   servingGrams (number|null), value(key)->number|null,
   fmt(v)->string}. */
function erpFdaPanelHTML(opt) {
  var esc = function (s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  };
  var DV = {nut_fat_g: 78, nut_sat_fat_g: 20, nut_chol_mg: 300,
    nut_sodium_mg: 2300, nut_carb_g: 275, nut_fiber_g: 28,
    nut_added_sugars_g: 50, nut_vit_d_mcg: 20, nut_calcium_mg: 1300,
    nut_iron_mg: 18, nut_potassium_mg: 4700};
  var fmt = opt.fmt || function (v) {
    var x = Math.round(v * 10) / 10;
    return String(x).replace(/\.0$/, "");
  };
  function row(key, label, unit, indent, bold) {
    var v = opt.value(key);
    var dv = DV[key];
    var dvTxt = (v === null || v === undefined || !dv) ? "" :
      Math.round(v / dv * 100) + "%";
    var amt = (v === null || v === undefined) ? "—" :
      (key === "nut_calories" ? String(Math.round(v)) : fmt(v) + unit);
    var left = bold ? "<b>" + label + " " + amt + "</b>" : label + " " + amt;
    return "<div style=\"display:flex;justify-content:space-between;" +
      "font-size:13px;border-top:1px solid #ccc;padding:" + rowPad + ";" +
      (indent ? "padding-left:" + (indent * 12) + "px;" : "") + "\">" +
      "<span>" + left + "</span><span>" + dvTxt + "</span></div>";
  }
  function addedSugarsRow() {
    var v = opt.value("nut_added_sugars_g");
    var dvTxt = (v === null || v === undefined) ? "" :
      Math.round(v / 50 * 100) + "%";
    var amt = (v === null || v === undefined) ? "—" : fmt(v) + "g";
    return "<div style=\"display:flex;justify-content:space-between;" +
      "font-size:13px;border-top:1px solid #ccc;padding:" + rowPad + ";" +
      "padding-left:24px;\"><span>Includes " + amt +
      " Added Sugars</span><span>" + dvTxt + "</span></div>";
  }
  var rowPad = opt.roomy ? "6px 0" : "1px 0";
  var fsHead = opt.roomy ? "36px" : "32px";
  var fsCal = opt.roomy ? "32px" : "28px";
  var fsCalNum = opt.roomy ? "44px" : "38px";
  var cal = opt.value("nut_calories");
  var calTxt = (cal === null || cal === undefined) ? "—" :
    String(Math.round(cal));
  var servTxt = esc(opt.servingSize || "");
  if (opt.servingGrams) servTxt += " (" + opt.servingGrams + "g)";
  var html = "<div style=\"width:300px;border:2px solid #000;background:#fff;" +
    "color:#000;font-family:Arial,Helvetica,sans-serif;padding:6px 8px;" +
    "box-sizing:border-box;line-height:1.25;\">" +
    "<div style=\"font-size:" + fsHead + ";font-weight:900;line-height:1;\">" +
    "Nutrition Facts</div>" +
    "<div style=\"border-top:10px solid #000;margin:4px 0;\"></div>";
  if (opt.servings !== null && opt.servings !== undefined) {
    html += "<div style=\"font-size:13px;\"><b>" + opt.servings +
      "</b> servings per container</div>";
  }
  html += "<div style=\"font-size:14px;\"><b>Serving size</b> <b>" +
    (servTxt || "—") + "</b></div>" +
    "<div style=\"border-top:5px solid #000;margin:4px 0;\"></div>" +
    "<div style=\"font-size:12px;\"><b>Amount per serving</b></div>" +
    "<div style=\"display:flex;justify-content:space-between;" +
    "align-items:baseline;\"><span style=\"font-size:" + fsCal + ";" +
    "font-weight:900;\">Calories</span><span style=\"font-size:" + fsCalNum + ";" +
    "font-weight:900;\">" + calTxt + "</span></div>" +
    "<div style=\"border-top:8px solid #000;margin:4px 0;\"></div>" +
    "<div style=\"text-align:right;font-size:11px;font-weight:700;\">" +
    "% Daily Value*</div>" +
    row("nut_fat_g", "Total Fat", "g", 0, true) +
    row("nut_sat_fat_g", "Saturated Fat", "g", 1, false) +
    row("nut_trans_fat_g", "Trans Fat", "g", 1, false) +
    row("nut_chol_mg", "Cholesterol", "mg", 0, true) +
    row("nut_sodium_mg", "Sodium", "mg", 0, true) +
    row("nut_carb_g", "Total Carbohydrate", "g", 0, true) +
    row("nut_fiber_g", "Dietary Fiber", "g", 1, false) +
    row("nut_sugars_g", "Total Sugars", "g", 1, false) +
    addedSugarsRow() +
    row("nut_protein_g", "Protein", "g", 0, true) +
    "<div style=\"border-top:8px solid #000;margin:4px 0;\"></div>" +
    row("nut_vit_d_mcg", "Vitamin D", "mcg", 0, false) +
    row("nut_calcium_mg", "Calcium", "mg", 0, false) +
    row("nut_iron_mg", "Iron", "mg", 0, false) +
    row("nut_potassium_mg", "Potassium", "mg", 0, false) +
    "<div style=\"font-size:10px;margin-top:4px;\">* The % Daily Value " +
    "(DV) tells you how much a nutrient in a serving of food " +
    "contributes to a daily diet. 2,000 calories a day is used for " +
    "general nutrition advice.</div></div>";
  return html;
}

function erpNormalizeFlavorName(s) {
  var t = String(s || "").toLowerCase();
  try { t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}
  t = t.replace(/&/g, " and ").replace(/['’]/g, "");
  t = t.replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/\s+popcorn$/, "");
  return t;
}

}

  for (var i = 0; i < 6; i++) bits += L[Number(digits[i])];
  bits += "01010";
  for (var j = 6; j < 12; j++) {
    bits += L[Number(digits[j])].split("").map(function (b) {
      return b === "1" ? "0" : "1";
    }).join("");
  }
  bits += "101";
  var rects = "";
  for (var k = 0; k < bits.length; k++) {
    if (bits[k] === "1") {
      var start = k;
      while (k + 1 < bits.length && bits[k + 1] === "1") k++;
      rects += "<rect x=\"" + (start + 10) + "\" y=\"0\" width=\"" +
        (k - start + 1) + "\" height=\"60\"/>";
    }
  }
  var human = digits[0] + " " + digits.slice(1, 6) + " " +
    digits.slice(6, 11) + " " + digits[11];

    "style=\"display:block;width:100%;height:auto;\" aria-label=\"Barcode " +
    digits + "\"><g fill=\"#000\">" + rects + "</g>" +
    "<text x=\"57.5\" y=\"76\" font-family=\"Arial,Helvetica,sans-serif\" " +
    "font-size=\"11\" text-anchor=\"middle\">" + human + "</text></svg>";
}

/* Full standalone label document (used by previews and tests). The live
   Print button uses erpShowPrintLabel instead, which prints from this page
   so phone/tablet browsers cannot lose the label to a pop-up window. */
function erpRecipeLabelDoc(r, nut, serving) {
  var p = erpRecipeLabelParts(r, nut, serving);
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>" +
    p.title + "</title><style>" + p.style + "</style></head><body>" +
    "<div class=\"noprint\"><button onclick=\"window.print()\">Print</button> " +
    "Label prints at 4&times;6 inches.</div>" + p.label + "</body></html>";
}
/* Print the label from this page: hide the app, show only the label, and
   let the browser print the real document. On screen the label is
   enlarged to fill the window via a screen-only zoom rule; print
   uses a plain 4x6 block layout. The Print/Back bar floats
   above it and is hidden in print. Safari ignores @page size, so the bar
   notes iPhone/iPad users must pick 4x6 paper. */
function erpShowPrintLabel(r, nut, serving) {
  var p = erpRecipeLabelParts(r, nut, serving);
  var view = document.getElementById("erpPrintView");
  if (!view) {
    view = document.createElement("div");
    view.id = "erpPrintView";
    document.body.appendChild(view);
  }
  view.innerHTML = "<style>" + p.style + "</style>" +
    "<div class=\"erp-print-bar\"><button type=\"button\" id=\"erpPrintGo\">Print</button>" +
    "<button type=\"button\" id=\"erpPrintBack\">Back to recipe</button>" +
    "<p class=\"erp-print-help\">Label v11 &mdash; On screen the label is " +
    "enlarged for readability; it always prints at true 4&times;6. On " +
    "iPhone/iPad: Share, then Print, then pick your 4&times;6 label paper.</p></div>" + p.label;
  document.body.classList.add("erp-printing");
  window.scrollTo(0, 0);
  /* Fit the whole label in the 4x6 box: a long ingredient list
     (e.g. Birthday Cake) otherwise pushes the bottom band — address,
     Net Wt, QR code, barcode — past the box, where
     overflow:hidden clips it away. Scale the inner wrapper with
     transform (painting only, layout untouched) so the rendered
     content fits the fixed 6in box. Shrink only when it overflows. */
  var labelEl = view.querySelector(".label");
  var fitEl = view.querySelector(".labelfit");
  if (labelEl && fitEl && fitEl.scrollHeight > labelEl.clientHeight) {
    fitEl.style.transform = "scale(" + (labelEl.clientHeight / fitEl.scrollHeight) + ")";
    fitEl.style.transformOrigin = "top center";
  }
  /* Screen only: enlarge the label to fill the window, so on a wide
     desktop screen it does not sit as a tiny 4in column in a sea of
     white. The zoom lives in a screen-media rule only, so it cannot
     leak into print the way an inline zoom could if a browser
     ignored a print reset. Print uses the plain 4x6 layout below. */
  erpPrintScreenZoom();
  window.addEventListener("resize", erpPrintScreenZoom);
  document.getElementById("erpPrintGo").addEventListener("click", function () {
    window.print();
  });
  document.getElementById("erpPrintBack").addEventListener("click", erpHidePrintLabel);
}
function erpPrintScreenZoom() {
  if (!document.body.classList.contains("erp-printing")) return;
  var view = document.getElementById("erpPrintView");
  var labelEl = view ? view.querySelector(".label") : null;
  if (!view || !labelEl) return;
  var st = document.getElementById("erpPrintZoomStyle");
  if (!st) {
    st = document.createElement("style");
    st.id = "erpPrintZoomStyle";
    view.appendChild(st);
  }
  st.textContent = "";
  if (!labelEl.offsetWidth) return;
  var zw = (window.innerWidth - 24) / labelEl.offsetWidth;
  var zh = (window.innerHeight - 130) / labelEl.offsetHeight;
  var z = Math.max(1, Math.min(zw, zh, 2.5));
  st.textContent = "@media screen{#erpPrintView .label{zoom:" + z + ";}}";
}
function erpHidePrintLabel() {
  window.removeEventListener("resize", erpPrintScreenZoom);
  var view = document.getElementById("erpPrintView");
  if (view) view.innerHTML = "";
  document.body.classList.remove("erp-printing");
}
/* ---------- new recipe form (also used for new versions) ---------- */
function erpNewRecipeForm(existing) {
  var isVersion = !!existing;
  var form = document.createElement("form");
  form.className = "erp-form";
  var status = document.createElement("p");
  status.className = "erp-form-status";

  var nameInput, sizeInput, notesInput;
  if (!isVersion) {
    nameInput = erpTextInput("name", "e.g. Caramel", true);
    form.appendChild(erpField("Recipe name", nameInput));
  } else {
    var nh = document.createElement("p");
    nh.innerHTML = "<strong>Editing " + existing.name + "</strong> — saving creates a new " +
      "version; batches already made keep v" + existing.version + ".";
    form.appendChild(nh);
  }
  sizeInput = erpTextInput("batch_size_bags", "e.g. 50", true);
  sizeInput.type = "number";
  sizeInput.min = "0.01";
  sizeInput.step = "any";
  if (isVersion) sizeInput.value = existing.batch_size_bags;
  form.appendChild(erpField("Bags per batch", sizeInput));
  notesInput = erpTextInput("notes", "");
  if (isVersion) notesInput.value = existing.notes || "";
  form.appendChild(erpField("Notes (optional)", notesInput));

  var linesHead = document.createElement("h4");
  linesHead.textContent = "Ingredients & packaging per batch";
  form.appendChild(linesHead);
  var linesWrap = document.createElement("div");
  linesWrap.className = "erp-recipe-lines";
  form.appendChild(linesWrap);

  function itemOptions(selectedId) {
    return erpState.items.filter(function (i) { return i.active; }).map(function (i) {
      var o = document.createElement("option");
      o.value = i.id;
      o.textContent = i.sku + " — " + i.name + " (" + (i.unit || "") + ")";
      if (String(i.id) === String(selectedId)) o.selected = true;
      return o;
    });
  }
  function addLineRow(itemId, qty, unit) {
    var row = document.createElement("div");
    row.className = "erp-recipe-line-row";
    var sel = document.createElement("select");
    sel.required = true;
    itemOptions(itemId).forEach(function (o) { sel.appendChild(o); });
    row.appendChild(sel);
    var q = document.createElement("input");
    q.type = "text";
    q.inputMode = "decimal";
    q.required = true;
    q.placeholder = "Qty (e.g. 1/2)";
    q.style.width = "90px";
    if (qty !== undefined) q.value = erpQtyFrac(qty);
    row.appendChild(q);
    var u = document.createElement("select");
    u.style.width = "110px";
    function unitOptions(selectedUnit) {
      u.innerHTML = "";
      var labels = {cup: "cups", tablespoon: "tablespoons", teaspoon: "teaspoons",
                    oz: "oz", lb: "lb", g: "g", each: "each", bag: "bags"};
      var list = ERP_RECIPE_UNITS.slice();
      if (selectedUnit && list.indexOf(selectedUnit) === -1) {
        list.push(selectedUnit);
      }
      list.forEach(function (un) {
        var o = document.createElement("option");
        o.value = un;
        o.textContent = labels[un] || un;
        if (String(un) === String(selectedUnit)) o.selected = true;
        u.appendChild(o);
      });
    }
    var selItem = erpState.items.filter(function (i) { return String(i.id) === String(sel.value); })[0];
    unitOptions(unit || (selItem && selItem.unit) || "cup");
    sel.addEventListener("change", function () {
      var it = erpState.items.filter(function (i) { return String(i.id) === String(sel.value); })[0];
      if (it && it.unit && ERP_RECIPE_UNITS.indexOf(it.unit) !== -1) unitOptions(it.unit);
    });
    row.appendChild(u);
    var rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "✕";
    rm.setAttribute("aria-label", "Remove line");
    rm.addEventListener("click", function () { row.remove(); });
    row.appendChild(rm);
    linesWrap.appendChild(row);
  }
  var addRowBtn = document.createElement("button");
  addRowBtn.type = "button";
  addRowBtn.textContent = "+ Add line";
  addRowBtn.addEventListener("click", function () { addLineRow(); });
  form.appendChild(addRowBtn);

  // prefill when creating a new version
  if (isVersion) {
    erpGet("/api/erp/recipes/" + encodeURIComponent(String(existing.id))).then(function (res) {
      (res.lines || []).forEach(function (l) {
        addLineRow(l.item_id, l.qty_per_batch, l.unit);
      });
    }).catch(function () {});
  } else {
    addLineRow();
  }

  var submit = document.createElement("button");
  submit.type = "submit";
  submit.textContent = isVersion ? "Save changes" : "Create recipe";
  form.appendChild(submit);
  form.appendChild(status);

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var rows = linesWrap.querySelectorAll(".erp-recipe-line-row");
    if (!rows.length) {
      status.textContent = "Add at least one ingredient line.";
      return;
    }
    var lines = [];
    for (var i = 0; i < rows.length; i++) {
      var selects = rows[i].querySelectorAll("select");
      var qtyInput = rows[i].querySelector("input");
      var qv = erpParseQty(qtyInput.value);
      if (!isFinite(qv) || qv <= 0) {
        status.textContent = "Every line needs a quantity greater than zero — whole numbers, " +
          "decimals, or fractions like 1/2 or 1 1/2 all work.";
        return;
      }
      lines.push({item_id: Number(selects[0].value), qty_per_batch: qv,
                  unit: selects[1].value});
    }
    var size = Number(sizeInput.value);
    if (!isFinite(size) || size <= 0) {
      status.textContent = "Bags per batch must be greater than zero.";
      return;
    }
    submit.disabled = true;
    status.textContent = "Saving…";
    var payload = {batch_size_bags: size, notes: notesInput.value.trim(), lines: lines};
    var req;
    if (isVersion) {
      req = erpPut("/api/erp/recipes/" + encodeURIComponent(String(existing.id)), payload);
    } else {
      payload.name = nameInput.value.trim();
      if (!payload.name) {
        submit.disabled = false;
        status.textContent = "Recipe name is required.";
        return;
      }
      req = erpPost("/api/erp/recipes", payload);
    }
    req.then(function (res) {
      erpState.showNewRecipe = false;
      erpState.showNewRecipeVersion = false;
      erpState.selectedRecipeId = res.recipe.id;
      erpState.selectedRecipeVersion = null;
      return loadErpProductionDetail();
    }).catch(function (error) {
      submit.disabled = false;
      status.textContent = error.message;
    });
  });
  return form;
}

  head.appendChild(closeBtn);

  var bodyEl = document.createElement("div");
  modal.appendChild(bodyEl);
  overlay.appendChild(modal);
  function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  closeBtn.addEventListener("click", close);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
  function onEsc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
  }
  document.addEventListener("keydown", onEsc);
  document.body.appendChild(overlay);
  return {overlay: overlay, body: bodyEl, close: close};
}

/* ---------------- Order hub ---------------- */
async function loadErpOrdersDetail() {
  setAdminDetailStatus("Loading orders…");
  try {
    var q = [];
    if (erpState.ordersSourceFilter) q.push("source=" + encodeURIComponent(erpState.ordersSourceFilter));
    if (erpState.ordersStatusFilter) q.push("status=" + encodeURIComponent(erpState.ordersStatusFilter));
    if (erpState.ordersSearch) q.push("q=" + encodeURIComponent(erpState.ordersSearch));
    var qs = q.length ? "?" + q.join("&") : "";
    var results = await Promise.all([
      erpGet("/api/erp/orders" + qs),
      erpGet("/api/erp/wholesale-orders"),
      erpGet("/api/erp/wholesale-accounts")
    ]);
    erpState.orders = results[0].orders || [];
    erpState.wholesaleOrders = results[1].orders || [];
    erpState.wholesaleAccounts = results[2].accounts || [];
    renderErpOrdersDetail();
    setAdminDetailStatus("");
  } catch (error) {
    setAdminDetailStatus(error instanceof TypeError ?
      "We couldn't connect to load orders." : error.message, true);
  }
}

function renderErpOrdersDetail() {
  var els = adminDetailEls();
  els.body.replaceChildren();
  if (erpState.selectedOrderSource && erpState.selectedOrderId) { renderErpOrderDetail(els.body); return; }
  if (erpState.selectedAccountId) { renderErpAccountDetail(els.body); return; }
  var h2 = document.createElement("h2");
  h2.textContent = "Order hub";
  els.body.appendChild(h2);
  var tabs = document.createElement("div");
  tabs.className = "erp-subtabs";
  [["queue", "Queue"], ["wholesale", "Wholesale orders"], ["accounts", "Accounts"]].forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = t[1];
    if (erpState.ordersView === t[0]) b.classList.add("active");
    b.addEventListener("click", function () {
      erpState.ordersView = t[0];
      renderErpOrdersDetail();
    });
    tabs.appendChild(b);
  });
  els.body.appendChild(tabs);
  if (erpState.ordersView === "queue") renderErpOrderQueue(els.body);
  else if (erpState.ordersView === "wholesale") renderErpWholesaleOrders(els.body);
  else renderErpAccounts(els.body);
}

/* ---------- order queue ---------- */
function renderErpOrderQueue(body) {
  var toolbar = document.createElement("div");
  toolbar.className = "erp-toolbar";
  function filterSelect(labelText, options, current, onChange) {
    var label = document.createElement("label");
    label.textContent = labelText + " ";
    var sel = document.createElement("select");
    options.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt[0];
      o.textContent = opt[1];
      if (current === opt[0]) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", onChange);
    label.appendChild(sel);
    return label;
  }
  toolbar.appendChild(filterSelect("Source",
    [["", "All sources"], ["stripe", "Stripe"], ["paypal", "PayPal"], ["wholesale", "Wholesale"]],
    erpState.ordersSourceFilter,
    function (e) { erpState.ordersSourceFilter = e.target.value; loadErpOrdersDetail(); }));
  toolbar.appendChild(filterSelect("Status",
    [["", "All statuses"], ["new", "New"], ["in_production", "In production"], ["ready", "Ready"],
     ["shipped", "Shipped"], ["picked_up", "Picked up"], ["cancelled", "Cancelled"]],
    erpState.ordersStatusFilter,
    function (e) { erpState.ordersStatusFilter = e.target.value; loadErpOrdersDetail(); }));
  var search = document.createElement("input");
  search.type = "search";
  search.placeholder = "Search orders, customers…";
  search.value = erpState.ordersSearch;
  search.setAttribute("aria-label", "Search orders");
  search.addEventListener("input", function () {
    erpState.ordersSearch = search.value;
    if (erpState.ordersSearchTimer) clearTimeout(erpState.ordersSearchTimer);
    erpState.ordersSearchTimer = setTimeout(function () { loadErpOrdersDetail(); }, 500);
  });
  toolbar.appendChild(search);
  body.appendChild(toolbar);

  var wrap = document.createElement("div");
  wrap.className = "admin-orders-wrap";
  body.appendChild(wrap);
  if (!erpState.orders.length) {
    var empty = document.createElement("p");
    empty.className = "admin-orders-empty";
    empty.textContent = "No orders match these filters.";
    wrap.appendChild(empty);
    return;
  }
  var table = document.createElement("table");
  table.className = "admin-orders-table";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["Order", "Source", "Customer", "Items", "Qty", "Total", "Status", "Created"].forEach(function (c) {
    var th = document.createElement("th");
    th.textContent = c;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  erpState.orders.forEach(function (o) {
    var tr = document.createElement("tr");
    tr.style.cursor = "pointer";
    tr.addEventListener("click", function () {
      erpState.selectedOrderSource = o.source;
      erpState.selectedOrderId = o.id;
      erpState.orderReturnView = "queue";
      renderErpOrdersDetail();
    });
    tr.appendChild(erpCell("Order", o.number));
    var srcTd = document.createElement("td");
    srcTd.appendChild(erpChip(o.source, erpSourceLabel(o.source)));
    tr.appendChild(srcTd);
    var custTd = document.createElement("td");
    var nm = document.createElement("div");
    nm.textContent = o.customer_name || o.account_name || "—";
    nm.style.fontWeight = "700";
    custTd.appendChild(nm);
    if (o.email) {
      var em = document.createElement("div");
      em.textContent = o.email;
      em.style.fontSize = "12px";
      em.style.color = "#6d655e";
      custTd.appendChild(em);
    }
    tr.appendChild(custTd);
    tr.appendChild(erpCell("Items", o.items_summary));
    tr.appendChild(erpCell("Qty", o.total_qty));
    tr.appendChild(erpCell("Total", erpMoney(o.total_cents)));
    var stTd = document.createElement("td");
    stTd.appendChild(erpChip(o.status, erpOrderStatusLabel(o.status)));
    tr.appendChild(stTd);
    tr.appendChild(erpCell("Created", erpFmtDate(o.created_at)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
}


/* ---------- order detail ---------- */
function renderErpOrderDetail(body) {
  var source = erpState.selectedOrderSource;
  var id = erpState.selectedOrderId;
  setAdminDetailStatus("Loading order…");
  erpGet("/api/erp/orders/" + encodeURIComponent(source) + "/" + encodeURIComponent(String(id))).then(function (res) {
    var o = res.order;
    body.replaceChildren();
    body.appendChild(erpBackButton("← " + (erpState.orderReturnView === "wholesale" ? "All wholesale orders" : "Order queue"), function () {
      erpState.selectedOrderSource = null;
      erpState.selectedOrderId = null;
      renderErpOrdersDetail();
    }));
    var h2 = document.createElement("h2");
    h2.textContent = "Order " + o.number + " ";
    h2.appendChild(erpChip(o.source, erpSourceLabel(o.source)));
    if (o.via_edi) {
      h2.appendChild(document.createTextNode(" "));
      h2.appendChild(erpChip("mapped", "via EDI" + (o.account_name ? " · " + o.account_name : "")));
    }
    body.appendChild(h2);

    // Admin-only permanent delete for ONLINE orders (test orders that
    // were never real). Wholesale orders keep their own delete path.
    if (source !== "wholesale" && erpIsAdmin()) {
      var delWrap = document.createElement("div");
      delWrap.className = "erp-toolbar";
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "Delete order permanently";
      delBtn.style.background = "#c92e29";
      delBtn.style.color = "#fff";
      var delArmed = false;
      var delReset = null;
      delBtn.addEventListener("click", function () {
        if (!delArmed) {
          delArmed = true;
          delBtn.textContent = "Tap again to confirm — this erases the order";
          delReset = setTimeout(function () {
            delArmed = false;
            delBtn.textContent = "Delete order permanently";
          }, 6000);
          return;
        }
        if (delReset) clearTimeout(delReset);
        delBtn.disabled = true;
        erpDelete("/api/erp/orders/" + encodeURIComponent(source) + "/" + encodeURIComponent(String(id))).then(function () {
          erpState.selectedOrderSource = null;
          erpState.selectedOrderId = null;
          renderErpOrdersDetail();
        }).catch(function (error) {
          delBtn.disabled = false;
          delArmed = false;
          delBtn.textContent = "Delete order permanently";
          setAdminDetailStatus(error.message, true);
        });
      });
      delWrap.appendChild(delBtn);
      body.appendChild(delWrap);
    }

    var meta = document.createElement("div");
    meta.className = "erp-detail-meta";
    meta.appendChild(erpChip(o.status, erpOrderStatusLabel(o.status)));
    ["Customer: " + (o.customer_name || o.account_name || "—"),
     "Email: " + (o.email || "—"),
     "Items: " + (o.items_summary || "—"),
     "Qty: " + (o.total_qty !== null && o.total_qty !== undefined ? o.total_qty : "—"),
     "Total: " + erpMoney(o.total_cents),
     "Created: " + erpFmtDate(o.created_at),
     "Due: " + (o.due_date || "—")
    ].forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      meta.appendChild(s);
    });
    if (o.tracking_number) {
      var ts = document.createElement("span");
      ts.textContent = "Tracking: " + o.tracking_number;
      meta.appendChild(ts);
    }
    body.appendChild(meta);

    // customer / account block
    if (o.shipping_address || o.account) {
      var ca = document.createElement("h3");
      ca.textContent = "Customer";
      body.appendChild(ca);
      var cwrap = document.createElement("div");
      cwrap.className = "admin-orders-wrap";
      var ctable = document.createElement("table");
      ctable.className = "admin-orders-table";
      var ctbody = document.createElement("tbody");
      if (o.account) {
        var atr = document.createElement("tr");
        var ath = document.createElement("th");
        ath.textContent = "Account";
        atr.appendChild(ath);
        var atd = document.createElement("td");
        atd.textContent = o.account.name +
          (o.account.contact_name ? " — " + o.account.contact_name : "") +
          (o.account.email ? " · " + o.account.email : "") +
          (o.account.phone ? " · " + o.account.phone : "") +
          (o.account.payment_terms ? " · terms: " + o.account.payment_terms : "") +
          (o.account.price_per_bag_cents ? " · " + erpMoney(o.account.price_per_bag_cents) + "/bag" : "");
        atr.appendChild(atd);
        ctbody.appendChild(atr);
      }
      if (o.shipping_address) {
        var str = document.createElement("tr");
        var sth = document.createElement("th");
        sth.textContent = "Ship to";
        str.appendChild(sth);
        var std = document.createElement("td");
        std.style.whiteSpace = "pre-wrap";
        std.textContent = o.shipping_address;
        str.appendChild(std);
        ctbody.appendChild(str);
      }
      ctable.appendChild(ctbody);
      cwrap.appendChild(ctable);
      body.appendChild(cwrap);
    }

    // lines
    var lh = document.createElement("h3");
    lh.textContent = "Items";
    body.appendChild(lh);
    if (o.lines && o.lines.length) {
      var lwrap = document.createElement("div");
      lwrap.className = "admin-orders-wrap";
      var ltable = document.createElement("table");
      ltable.className = "admin-orders-table";
      var lthead = document.createElement("thead");
      var lhr = document.createElement("tr");
      ["Flavor", "Bags", "Unit price", "Line total"].forEach(function (c) {
        var th = document.createElement("th");
        th.textContent = c;
        lhr.appendChild(th);
      });
      lthead.appendChild(lhr);
      ltable.appendChild(lthead);
      var ltbody = document.createElement("tbody");
      o.lines.forEach(function (l) {
        var tr = document.createElement("tr");
        tr.appendChild(erpCell("Flavor", l.flavor_name));
        tr.appendChild(erpCell("Bags", l.qty_bags));
        tr.appendChild(erpCell("Unit price", erpMoney(l.unit_price_cents)));
        tr.appendChild(erpCell("Line total", erpMoney(l.line_total_cents)));
        ltbody.appendChild(tr);
      });
      ltable.appendChild(ltbody);
      lwrap.appendChild(ltable);
      body.appendChild(lwrap);
    } else {
      var summ = document.createElement("p");
      summ.textContent = o.items_summary || "No line detail.";
      body.appendChild(summ);
    }

    // admin: add an off-catalog product to a wholesale order
    if (erpIsAdmin() && o.source === "wholesale" &&
        ["shipped", "picked_up", "cancelled"].indexOf(o.status) === -1) {
      var addProdForm = document.createElement("form");
      addProdForm.className = "erp-form";
      var apTitle = document.createElement("strong");
      apTitle.textContent = "Add product";
      apTitle.style.width = "100%";
      addProdForm.appendChild(apTitle);
      var apNote = document.createElement("span");
      apNote.style.width = "100%";
      apNote.style.fontSize = "14px";
      apNote.style.color = "var(--muted)";
      apNote.textContent = "For products not on the site — enter any product name.";
      addProdForm.appendChild(apNote);
      var apNameLabel = document.createElement("label");
      apNameLabel.textContent = "Product ";
      var apNameInput = document.createElement("input");
      apNameInput.required = true;
      apNameInput.placeholder = "Custom variety pack";
      apNameLabel.appendChild(apNameInput);
      addProdForm.appendChild(apNameLabel);
      var apQtyLabel = document.createElement("label");
      apQtyLabel.textContent = "Qty (bags) ";
      var apQtyInput = document.createElement("input");
      apQtyInput.type = "number";
      apQtyInput.min = "1";
      apQtyInput.step = "any";
      apQtyInput.required = true;
      apQtyInput.placeholder = "12";
      apQtyLabel.appendChild(apQtyInput);
      addProdForm.appendChild(apQtyLabel);
      var apPriceLabel = document.createElement("label");
      apPriceLabel.textContent = "Unit price $ ";
      var apPriceInput = document.createElement("input");
      apPriceInput.type = "number";
      apPriceInput.min = "0.01";
      apPriceInput.step = "0.01";
      apPriceInput.placeholder = o.account && o.account.price_per_bag_cents ?
        (o.account.price_per_bag_cents / 100).toFixed(2) + " (account default)" : "4.00";
      apPriceLabel.appendChild(apPriceInput);
      addProdForm.appendChild(apPriceLabel);
      var apSubmit = document.createElement("button");
      apSubmit.type = "submit";
      apSubmit.textContent = "Add to order";
      addProdForm.appendChild(apSubmit);
      var apStatus = document.createElement("p");
      apStatus.className = "erp-form-status";
      addProdForm.appendChild(apStatus);
      addProdForm.addEventListener("submit", function (event) {
        event.preventDefault();
        apSubmit.disabled = true;
        apStatus.textContent = "Adding…";
        var payload = {
          product_name: apNameInput.value.trim(),
          qty_bags: Number(apQtyInput.value)
        };
        if (apPriceInput.value.trim()) {
          payload.unit_price_cents = Math.round(Number(apPriceInput.value) * 100);
        }
        erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(id)) + "/lines",
          payload).then(function () {
            renderErpOrderDetail(body);
          }).catch(function (error) {
            apSubmit.disabled = false;
            apStatus.textContent = error.message;
          });
      });
      body.appendChild(addProdForm);
    }

    // fulfillment
    var fh = document.createElement("h3");
    fh.textContent = "Fulfillment";
    body.appendChild(fh);
    var fwrap = document.createElement("div");
    fwrap.className = "admin-orders-wrap";
    var ftable = document.createElement("table");
    ftable.className = "admin-orders-table";
    var fthead = document.createElement("thead");
    var fhr = document.createElement("tr");
    ["Status", "Updated by", "When", "Note"].forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      fhr.appendChild(th);
    });
    fthead.appendChild(fhr);
    ftable.appendChild(fthead);
    var ftbody = document.createElement("tbody");
    var hist = (o.fulfillment && o.fulfillment.history) || [];
    if (!hist.length) {
      var ftr = document.createElement("tr");
      var ftd = document.createElement("td");
      ftd.colSpan = 4;
      ftd.textContent = "No fulfillment updates yet.";
      ftr.appendChild(ftd);
      ftbody.appendChild(ftr);
    }
    hist.forEach(function (hst) {
      var tr = document.createElement("tr");
      var std = document.createElement("td");
      std.appendChild(erpChip(hst.status, erpOrderStatusLabel(hst.status)));
      tr.appendChild(std);
      tr.appendChild(erpCell("Updated by", hst.updated_by));
      tr.appendChild(erpCell("When", erpFmtDate(hst.updated_at)));
      tr.appendChild(erpCell("Note", hst.note));
      ftbody.appendChild(tr);
    });
    ftable.appendChild(ftbody);
    fwrap.appendChild(ftable);
    body.appendChild(fwrap);

    if (erpIsAdmin()) {
      var fform = document.createElement("div");
      fform.className = "erp-form erp-form-inline";
      var noteInput = erpTextInput("note", "Status note (optional)");
      noteInput.style.minWidth = "220px";
      fform.appendChild(erpField("Note", noteInput));
      ["new", "in_production", "ready", "shipped", "picked_up", "cancelled"].forEach(function (s) {
        if (s === o.status) return;
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = "Mark " + erpOrderStatusLabel(s).toLowerCase();
        b.addEventListener("click", function () {
          b.disabled = true;
          setAdminDetailStatus("Updating status…");
          erpPost("/api/erp/orders/" + encodeURIComponent(source) + "/" +
            encodeURIComponent(String(id)) + "/status",
            {status: s, note: noteInput.value.trim()}).then(function () {
            renderErpOrderDetail(body);
          }).catch(function (error) {
            b.disabled = false;
            setAdminDetailStatus(error.message, true);
          });
        });
        fform.appendChild(b);
      });
      body.appendChild(fform);
    }

    // Phase 5: accept / decline submitted wholesale orders.
    if (source === "wholesale" && o.status === "submitted" && erpIsAdmin()) {
      var dec = document.createElement("div");
      dec.className = "erp-toolbar";
      dec.style.marginTop = "10px";
      var accBtn = document.createElement("button");
      accBtn.type = "button";
      accBtn.textContent = "Accept order";
      accBtn.style.fontWeight = "800";
      accBtn.addEventListener("click", function () {
        accBtn.disabled = true;
        setAdminDetailStatus("Accepting order…");
        erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(id)) + "/accept", {}).then(function () {
          setAdminDetailStatus("Order accepted — customer notified.");
          renderErpOrderDetail(body);
        }).catch(function (error) {
          accBtn.disabled = false;
          setAdminDetailStatus(error.message, true);
        });
      });
      var decBtn = document.createElement("button");
      decBtn.type = "button";
      decBtn.textContent = "Decline";
      decBtn.addEventListener("click", function () {
        var note = window.prompt("Reason for declining (sent to the customer):", "") || "";
        decBtn.disabled = true;
        erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(id)) + "/decline", {note: note}).then(function () {
          setAdminDetailStatus("Order declined — customer notified.");
          renderErpOrderDetail(body);
        }).catch(function (error) {
          decBtn.disabled = false;
          setAdminDetailStatus(error.message, true);
        });
      });
      dec.appendChild(accBtn);
      dec.appendChild(decBtn);
      body.appendChild(dec);
    }

    // Phase 5: per-flavor production checklist.
    if (source === "wholesale" && erpIsAdmin()) {
      var prodWrap = document.createElement("div");
      prodWrap.id = "erpProdChecklist";
      body.appendChild(prodWrap);
      erpRenderProductionChecklist(prodWrap, id, o.status, function () { renderErpOrderDetail(body); });
    }

    // QuickBooks (Phase 4: wholesale orders only, admin only)
    if (source === "wholesale" && erpIsAdmin()) {
      renderErpOrderQbSection(body, o, id, function () { renderErpOrderDetail(body); });
    }

    // linked batches
    var bh = document.createElement("h3");
    bh.textContent = "Linked batches";
    body.appendChild(bh);
    if (erpIsAdmin()) {
      var btoolbar = document.createElement("div");
      btoolbar.className = "erp-toolbar";
      var linkBtn = document.createElement("button");
      linkBtn.type = "button";
      linkBtn.textContent = "Link batch";
      linkBtn.addEventListener("click", function () {
        erpShowLinkBatchModal(o, function () { renderErpOrderDetail(body); });
      });
      btoolbar.appendChild(linkBtn);
      var traceBtn = document.createElement("button");
      traceBtn.type = "button";
      traceBtn.textContent = "Trace lots";
      traceBtn.addEventListener("click", function () {
        erpShowTraceModal(source, id, o.number);
      });
      btoolbar.appendChild(traceBtn);
      body.appendChild(btoolbar);
    } else {
      var tb = document.createElement("div");
      tb.className = "erp-toolbar";
      var tb2 = document.createElement("button");
      tb2.type = "button";
      tb2.textContent = "Trace lots";
      tb2.addEventListener("click", function () {
        erpShowTraceModal(source, id, o.number);
      });
      tb.appendChild(tb2);
      body.appendChild(tb);
    }
    var bwrap = document.createElement("div");
    bwrap.className = "admin-orders-wrap";
    var btable = document.createElement("table");
    btable.className = "admin-orders-table";
    var bthead = document.createElement("thead");
    var bhr = document.createElement("tr");
    ["Batch", "Lot code", "Batch status", "Bags"].concat(erpIsAdmin() ? [""] : []).forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      bhr.appendChild(th);
    });
    bthead.appendChild(bhr);
    btable.appendChild(bthead);
    var btbody = document.createElement("tbody");
    var links = o.linked_batches || [];
    if (!links.length) {
      var btr = document.createElement("tr");
      var btd = document.createElement("td");
      btd.colSpan = erpIsAdmin() ? 5 : 4;
      btd.textContent = "No batches linked to this order yet.";
      btr.appendChild(btd);
      btbody.appendChild(btr);
    }
    links.forEach(function (lk) {
      var tr = document.createElement("tr");
      var bnumTd = document.createElement("td");
      var bLink = document.createElement("a");
      bLink.href = "#/production";
      bLink.textContent = lk.batch_number;
      bLink.addEventListener("click", function (e) {
        e.preventDefault();
        erpGoToBatch(lk.batch_id);
      });
      bnumTd.appendChild(bLink);
      tr.appendChild(bnumTd);
      tr.appendChild(erpCell("Lot code", lk.lot_code));
      var bsTd = document.createElement("td");
      bsTd.appendChild(erpChip(lk.batch_status, erpBatchStatusLabel(lk.batch_status)));
      tr.appendChild(bsTd);
      tr.appendChild(erpCell("Bags", erpQty(lk.qty_bags)));
      if (erpIsAdmin()) {
        var unTd = document.createElement("td");
        var unBtn = document.createElement("button");
        unBtn.type = "button";
        unBtn.textContent = "Unlink";
        unBtn.addEventListener("click", function () {
          if (!window.confirm("Unlink batch " + lk.batch_number + " from this order?")) return;
          unBtn.disabled = true;
          setAdminDetailStatus("Unlinking…");
          erpDelete("/api/erp/batches/" + encodeURIComponent(String(lk.batch_id)) +
            "/orders/" + encodeURIComponent(String(lk.link_id))).then(function () {
            renderErpOrderDetail(body);
          }).catch(function (error) {
            unBtn.disabled = false;
            setAdminDetailStatus(error.message, true);
          });
        });
        unTd.appendChild(unBtn);
        tr.appendChild(unTd);
      }
      btbody.appendChild(tr);
    });
    btable.appendChild(btbody);
    bwrap.appendChild(btable);
    body.appendChild(bwrap);

    // admin: generate EDI documents
    if (erpIsAdmin()) {
      var gen = document.createElement("div");
      gen.className = "erp-toolbar";
      var genResult = document.createElement("div");
      function showGenResult(doc) {
        genResult.replaceChildren();
        var box = document.createElement("div");
        box.className = "erp-alert-box";
        var strong = document.createElement("strong");
        strong.textContent = "EDI document #" + doc.id + " (" + doc.doc_type + ") created — status: " + doc.status + ".";
        box.appendChild(strong);
        box.appendChild(document.createElement("br"));
        var viewBtn = document.createElement("button");
        viewBtn.type = "button";
        viewBtn.textContent = "View document";
        viewBtn.addEventListener("click", function () { erpGoToEdiDoc(doc.id); });
        box.appendChild(viewBtn);
        genResult.appendChild(box);
      }
      var b856 = document.createElement("button");
      b856.type = "button";
      b856.textContent = "Generate 856 (ASN)";
      b856.addEventListener("click", function () {
        b856.disabled = true;
        setAdminDetailStatus("Generating 856…");
        erpPost("/api/erp/orders/" + encodeURIComponent(source) + "/" +
          encodeURIComponent(String(id)) + "/edi-856", {}).then(function (res) {
          b856.disabled = false;
          showGenResult(res.document);
          setAdminDetailStatus("");
        }).catch(function (error) {
          b856.disabled = false;
          setAdminDetailStatus(error.message, true);
        });
      });
      gen.appendChild(b856);
      if (source === "wholesale") {
        var b810 = document.createElement("button");
        b810.type = "button";
        b810.textContent = "Generate 810 (invoice)";
        b810.addEventListener("click", function () {
          b810.disabled = true;
          setAdminDetailStatus("Generating 810…");
          erpPost("/api/erp/wholesale-orders/" + encodeURIComponent(String(id)) + "/edi-810", {}).then(function (res) {
            b810.disabled = false;
            showGenResult(res.document);
            setAdminDetailStatus("");
          }).catch(function (error) {
            b810.disabled = false;
            setAdminDetailStatus(error.message, true);
          });
        });
